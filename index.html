&lt;script&gt;
const SciMcqCore = (() =&gt; {
  const lectures = [1, 2, 3, 4, 6, 7, 8];
  function shuffle(values, random = Math.random) {
    const result = values.slice();
    for (let i = result.length - 1; i &gt; 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function validate(bank) {
    if (!Array.isArray(bank) || bank.length !== 350) throw new Error(&#x27;Expected 350 questions&#x27;);
    const ids = new Set();
    for (const q of bank) {
      if (!q.id || ids.has(q.id)) throw new Error(&#x27;Duplicate question ID&#x27;);
      ids.add(q.id);
      if (!lectures.includes(q.lecture)) throw new Error(&#x27;Unexpected lecture&#x27;);
      if (!Array.isArray(q.options) || q.options.length !== 4 || new Set(q.options).size !== 4) throw new Error(&#x27;Four distinct options required&#x27;);
      if (!Number.isInteger(q.answer) || q.answer &lt; 0 || q.answer &gt; 3) throw new Error(&#x27;Invalid answer&#x27;);
      if (!q.stem || !q.explain_zh || !q.key_en || !q.source_note) throw new Error(&#x27;Missing learning content&#x27;);
      if (![&#x27;core&#x27;, &#x27;practice&#x27;, &#x27;hard&#x27;].includes(q.priority)) throw new Error(&#x27;Invalid priority&#x27;);
    }
    for (const n of lectures) {
      const group = bank.filter(q =&gt; q.lecture === n);
      if (group.length !== 50 || group.filter(q =&gt; q.priority === &#x27;core&#x27;).length !== 10 ||
          group.filter(q =&gt; q.priority === &#x27;hard&#x27;).length !== 10) throw new Error(&#x27;Lecture coverage mismatch&#x27;);
    }
    return true;
  }
  function prioritizeUnseen(pool, history, random) {
    return shuffle(pool.filter(q =&gt; !history[q.id]), random).concat(shuffle(pool.filter(q =&gt; history[q.id]), random));
  }
  function makeDeck(bank, settings, history = {}, random = Math.random) {
    const lecture = settings.lecture === &#x27;all&#x27; ? null : Number(settings.lecture);
    if (settings.mode === &#x27;mixed35&#x27;) {
      const chosen = [];
      for (const n of lectures) {
        const pool = bank.filter(q =&gt; q.lecture === n &amp;&amp; q.priority !== &#x27;hard&#x27;);
        chosen.push(...prioritizeUnseen(pool, history, random).slice(0, 5));
      }
      return shuffle(chosen, random).map(q =&gt; q.id);
    }
    let pool = bank.filter(q =&gt; lecture === null || q.lecture === lecture);
    if (settings.mode === &#x27;hard&#x27;) {
      return prioritizeUnseen(pool.filter(q =&gt; q.priority === &#x27;hard&#x27;), history, random).map(q =&gt; q.id);
    }

(() =&gt; {
  const root = document.getElementById(&#x27;sci3116-mcq-practice&#x27;);
  const bank = [{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Conclusion&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A team has analysed its experiment and calculated group averages. Which step is still needed before presenting the study as complete?&quot;,&quot;options&quot;:[&quot;Repeat the hypothesis without mentioning the findings&quot;,&quot;Choose the preferred answer before inspecting the averages&quot;,&quot;Delete results that disagree with the prediction&quot;,&quot;State a conclusion that relates the findings to the hypothesis&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;分析數據後仍要作結論，交代結果是否支持假設及適用範圍。單列平均數或重抄假設，都未回答研究問題；亦不能為配合預期刪走結果。&quot;,&quot;key_en&quot;:&quot;Analysis must be followed by an evidence-based conclusion.&quot;,&quot;source_pages&quot;:[6,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 9&quot;,&quot;id&quot;:&quot;L1-001&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Hypothesis and prediction&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student proposes that any two masses attract. She then expects Earth to attract an orange. What is the relationship between these statements?&quot;,&quot;options&quot;:[&quot;The general attraction claim is a hypothesis; the orange expectation is a prediction&quot;,&quot;The orange expectation is the research instrument&quot;,&quot;Both statements are final experimental conclusions&quot;,&quot;The hypothesis is simply the observation of one falling apple&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;假設提出可檢驗的解釋，預測則由該解釋推出特定情況應觀察到甚麼。例子尚未給實驗結果，因此不能將兩句都當成已完成研究的結論。&quot;,&quot;key_en&quot;:&quot;A prediction states an expected observation if the hypothesis applies.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 1 PDF 7&quot;,&quot;id&quot;:&quot;L1-002&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Variables&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A proposed experiment asks whether daily green-tea consumption affects the incidence of cardiovascular disease. Which pairing is appropriate?&quot;,&quot;options&quot;:[&quot;Independent variable: disease incidence; dependent variable: assigned drink&quot;,&quot;Independent variable: the research title; dependent variable: the researcher&quot;,&quot;Independent variable: assigned drink condition; dependent variable: disease incidence&quot;,&quot;Independent variable: conclusion; dependent variable: hypothesis&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;自變量是研究比較的飲用條件；因變量是量度的疾病發生率。研究目的、假設及結論是研究組成部分，並不是這個例子的兩個變量。&quot;,&quot;key_en&quot;:&quot;Distinguish the condition compared from the outcome measured.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 1 PDF 9&quot;,&quot;id&quot;:&quot;L1-003&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Fair comparison&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;To test a new study method, a researcher compares it with the usual method. Which arrangement best supports a fair comparison?&quot;,&quot;options&quot;:[&quot;Change both the teaching method and the scoring rule between groups&quot;,&quot;Give only the new-method group extra teaching time&quot;,&quot;Keep the outcome measure and relevant conditions comparable&quot;,&quot;Use an easier final test only for the new-method group&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;公平比較需盡量令相關條件及量度可比，才較能把結果連到被研究的因素。若同時改測驗難度、評分或額外時間，便難分辨差異來自哪一因素。&quot;,&quot;key_en&quot;:&quot;A fair test limits competing explanations for an observed difference.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 8, 9&quot;,&quot;id&quot;:&quot;L1-004&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Falsifiability&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A new hypothesis makes a clear prediction that could fail in an appropriate test. Before testing, which description is most accurate?&quot;,&quot;options&quot;:[&quot;It is falsifiable, but not necessarily false&quot;,&quot;It is already falsified&quot;,&quot;It must be pseudoscience because failure is possible&quot;,&quot;It is certain to be true because a prediction exists&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;可證偽是指容許適當證據挑戰，並不表示已被推翻，更不等於一定錯。科學假設需要面對失敗可能；能作預測亦未令它自動成為真理。&quot;,&quot;key_en&quot;:&quot;Falsifiable does not mean already falsified.&quot;,&quot;source_pages&quot;:[5],&quot;source_note&quot;:&quot;Lecture 1 PDF 5&quot;,&quot;id&quot;:&quot;L1-005&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Responding to evidence&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Repeated well-designed tests do not support a prediction. Which response best fits the scientific-method diagram?&quot;,&quot;options&quot;:[&quot;Keep announcing success because the idea is attractive&quot;,&quot;Examine the method and consider revising or rejecting the hypothesis&quot;,&quot;Hide the tests until supportive results appear&quot;,&quot;Make every possible outcome count as support&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;不支持結果應促使檢查測試及修訂假設，而不是隱瞞或把所有結果都改稱支持。流程圖有回路，反映研究可以重試、修正，並非只向預期答案前進。&quot;,&quot;key_en&quot;:&quot;Unsupportive evidence should inform testing and revision.&quot;,&quot;source_pages&quot;:[6],&quot;source_note&quot;:&quot;Lecture 1 PDF 6&quot;,&quot;id&quot;:&quot;L1-006&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Pilot study&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Before a large experiment, a team tries its measurement procedure with a small preliminary study. What is its most suitable purpose?&quot;,&quot;options&quot;:[&quot;Check feasibility and gather preliminary information&quot;,&quot;Produce a final answer without uncertainty&quot;,&quot;Replace all later data collection&quot;,&quot;Guarantee that the final hypothesis is true&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;先導研究可幫助了解可行性、程序及初步資料，之後再完善研究。小規模試行不保證假設正確，亦不能自動取代後續正式測試和有條件結論。&quot;,&quot;key_en&quot;:&quot;A pilot study informs the design rather than guaranteeing the result.&quot;,&quot;source_pages&quot;:[6],&quot;source_note&quot;:&quot;Lecture 1 PDF 6&quot;,&quot;id&quot;:&quot;L1-007&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Measurement sensitivity&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In the apple-and-orange example, no visible movement between two small objects is detected. What is the most careful conclusion?&quot;,&quot;options&quot;:[&quot;The effect may be below the measurement sensitivity&quot;,&quot;No force can exist unless movement is visible to the eye&quot;,&quot;All attraction hypotheses are therefore false&quot;,&quot;The experiment proves that small objects have no mass&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;未見移動可能反映效應太小或儀器敏感度不足，不能直接推出吸引力為零。應按測量能力及條件評估結果，避免把未偵測到等同不存在。&quot;,&quot;key_en&quot;:&quot;Non-detection must be interpreted in relation to measurement limits.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 1 PDF 7&quot;,&quot;id&quot;:&quot;L1-008&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Chinese inventions&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which set matches the four yellow-highlighted inventions on Lecture 1 PDF page 15?&quot;,&quot;options&quot;:[&quot;Wheelbarrow, mechanical clock, gunpowder, watertight compartments&quot;,&quot;Magnetic compass, paddle-wheel boat, porcelain, canal locks&quot;,&quot;Paper making, magnetic compass, gunpowder, block printing&quot;,&quot;Paper making, mechanical clock, silk reeling, movable-type printing&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;第15頁黃色四項是造紙、磁羅盤、火藥及雕版印刷。其他選項混入同頁未高亮或下一頁的例子；尤其不能把雕版印刷換成活字印刷。&quot;,&quot;key_en&quot;:&quot;Keep the highlighted block-printing item distinct from movable-type printing.&quot;,&quot;source_pages&quot;:[15],&quot;source_note&quot;:&quot;Lecture 1 PDF 15&quot;,&quot;id&quot;:&quot;L1-009&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Science and engineering&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;One team investigates how light bends in glass; another designs a device using that behaviour. Which comparison best fits the lecture?&quot;,&quot;options&quot;:[&quot;Both activities are unrelated to science&quot;,&quot;The first is engineering solely because it uses equipment&quot;,&quot;The second cannot use any scientific knowledge&quot;,&quot;The first mainly seeks understanding; the second mainly pursues a practical design&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;研究光如何折射主要尋求自然規律，設計裝置主要達成實際目標。兩種工作可以互相支持，不能因科學研究用儀器，就否定其理解自然的目的。&quot;,&quot;key_en&quot;:&quot;Compare the primary purpose while allowing science and engineering to interact.&quot;,&quot;source_pages&quot;:[2,4],&quot;source_note&quot;:&quot;Lecture 1 PDF 2, 4&quot;,&quot;id&quot;:&quot;L1-010&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Research question&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which proposed classroom question is most readily developed into a testable study?&quot;,&quot;options&quot;:[&quot;What is the ultimate meaning of every lesson?&quot;,&quot;Which method is best for everyone forever?&quot;,&quot;Does a specified practice schedule change scores on the same vocabulary test?&quot;,&quot;Is learning wonderful?&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;可研究問題需要界定比較條件及可量度結果。指定練習安排和共同測驗可設計測試；其餘太含糊、屬價值提問或提出無法一次研究的普遍結論。&quot;,&quot;key_en&quot;:&quot;A workable research question specifies what will be compared and measured.&quot;,&quot;source_pages&quot;:[8],&quot;source_note&quot;:&quot;Lecture 1 PDF 8&quot;,&quot;id&quot;:&quot;L1-011&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;New research questions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;After studying falling objects, a team asks whether attraction varies with mass. What does this illustrate?&quot;,&quot;options&quot;:[&quot;A study must stop all inquiry once data are analysed&quot;,&quot;A conclusion can lead to a new research question&quot;,&quot;A new question invalidates every previous observation&quot;,&quot;Mass can be ignored in any later test&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;研究結果可引出下一輪問題，正如蘋果例子繼續追問質量與吸引的關係。有新問題不是否定全部已有資料，而是令解釋及研究範圍進一步發展。&quot;,&quot;key_en&quot;:&quot;Scientific inquiry can generate further questions.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 1 PDF 7&quot;,&quot;id&quot;:&quot;L1-012&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Support and certainty&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A prediction is supported in one well-conducted experiment. Which statement is justified?&quot;,&quot;options&quot;:[&quot;Further testing is now unscientific&quot;,&quot;The hypothesis has received support under the tested conditions&quot;,&quot;Every alternative explanation has certainly been eliminated&quot;,&quot;The hypothesis can never need revision&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;一次適當測試可以增加支持，但不能保證所有條件、未來證據或替代解釋都已處理。結論應限於研究所得，並容許再檢驗及修訂。&quot;,&quot;key_en&quot;:&quot;Supporting evidence is not a guarantee of permanent certainty.&quot;,&quot;source_pages&quot;:[6,10],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 10&quot;,&quot;id&quot;:&quot;L1-013&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Random allocation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Why might a researcher randomly allocate volunteers to two drink conditions?&quot;,&quot;options&quot;:[&quot;To make every participant biologically identical&quot;,&quot;To reduce systematic differences between comparison groups&quot;,&quot;To remove the need for measuring outcomes&quot;,&quot;To guarantee that the treatment works&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;隨機分配可減少分組方式造成的系統性差異，幫助公平比較；它不會令所有人完全相同，也不保證處理有效，更不能代替量度結果及分析。&quot;,&quot;key_en&quot;:&quot;Random allocation helps group comparability without guaranteeing identical groups.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 1 PDF 9&quot;,&quot;id&quot;:&quot;L1-014&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Correlation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Regular green-tea drinkers have lower disease incidence in an observational dataset. Why is an experiment still useful?&quot;,&quot;options&quot;:[&quot;Observational data can never contain useful information&quot;,&quot;The association must have been deliberately fabricated&quot;,&quot;An association alone may have alternative explanations&quot;,&quot;An experiment automatically proves the biological mechanism&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;觀察到關聯可提供研究線索，但飲茶者亦可能在生活習慣等方面不同。實驗有助比較替代解釋；不能因關聯不足就說資料全無價值或必定造假。&quot;,&quot;key_en&quot;:&quot;An association can motivate a controlled test without establishing causation.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 1 PDF 9&quot;,&quot;id&quot;:&quot;L1-015&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Outcome and mechanism&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A trial finds a difference in disease incidence between drink groups. What additional claim would require further evidence?&quot;,&quot;options&quot;:[&quot;The measured outcomes differed in that trial&quot;,&quot;The result relates to the tested question&quot;,&quot;The trial included a comparison&quot;,&quot;The difference occurred through one particular proposed biological mechanism&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;疾病發生率的組間差異，不會單獨證明某個指定生理機制。研究可回答結果問題，但若要聲稱經炎症或血流等途徑產生作用，仍需相應機制證據。&quot;,&quot;key_en&quot;:&quot;Evidence for an outcome is not automatically evidence for a specific mechanism.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 1 PDF 9&quot;,&quot;id&quot;:&quot;L1-016&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Testable prediction&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which statement is the clearest prediction from the hypothesis that a particular practice improves recall?&quot;,&quot;options&quot;:[&quot;Students assigned that practice will recall more words on a specified test than the comparison group&quot;,&quot;The researcher wants the practice to succeed&quot;,&quot;Recall is an interesting subject&quot;,&quot;Every disappointing result will mean the practice worked invisibly&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;預測應指出在指定比較及量度下預期會看到的結果。興趣與願望不是可檢驗預測；把不支持結果改稱看不見的成功，亦不能公平測試假設。&quot;,&quot;key_en&quot;:&quot;A prediction identifies an observable expected result.&quot;,&quot;source_pages&quot;:[6,8],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8&quot;,&quot;id&quot;:&quot;L1-017&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Protected claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A promoter says a force works whenever observed and hides perfectly whenever a test fails. What is the main testing problem?&quot;,&quot;options&quot;:[&quot;The claim has already been confirmed by every observer&quot;,&quot;The stated rules leave no possible result that would challenge it&quot;,&quot;The claim is too brief&quot;,&quot;The claim contains a natural phenomenon&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;若每一種結果都被安排成支持或逃避測試，主張便不容許證據有效挑戰。重點是測試條件與可反駁結果，不是句子長短或故事是否吸引。&quot;,&quot;key_en&quot;:&quot;A claim protected against every possible test outcome is not meaningfully falsifiable.&quot;,&quot;source_pages&quot;:[5],&quot;source_note&quot;:&quot;Lecture 1 PDF 5&quot;,&quot;id&quot;:&quot;L1-018&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Purpose and precision&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An engineer chooses an approximation after checking that its error meets a design requirement. What is the best interpretation of the lecture’s pi joke?&quot;,&quot;options&quot;:[&quot;Physicists are unable to use more digits&quot;,&quot;Approximations can be acceptable when justified by the task&quot;,&quot;Engineers never need accurate calculations&quot;,&quot;The joke is a survey of professional competence&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;近似可按用途及誤差要求判斷是否合適，並非某職業永不需要準確。課堂笑話是教學誇張，不能當作工程師或物理學家能力的真實統計。&quot;,&quot;key_en&quot;:&quot;Use precision appropriate to the task and its error requirements.&quot;,&quot;source_pages&quot;:[3],&quot;source_note&quot;:&quot;Lecture 1 PDF 3&quot;,&quot;id&quot;:&quot;L1-019&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Scientific tools&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student calls the Hubble telescope a scientific theory. Which correction is best?&quot;,&quot;options&quot;:[&quot;It is only a natural phenomenon&quot;,&quot;It cannot contribute to science because humans built it&quot;,&quot;It is the same category as cosmology&quot;,&quot;It is a technological instrument that can support scientific investigation&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;望遠鏡是人造觀測工具，可支援科學研究，但不是一套解釋自然的理論。題目要分清工具、研究學科、自然現象與研究對象等不同類別。&quot;,&quot;key_en&quot;:&quot;A scientific instrument is not itself a theory.&quot;,&quot;source_pages&quot;:[4],&quot;source_note&quot;:&quot;Lecture 1 PDF 4&quot;,&quot;id&quot;:&quot;L1-020&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Objects of study&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which statement best distinguishes a virus from virology as a scientific activity?&quot;,&quot;options&quot;:[&quot;A virus is a research method&quot;,&quot;A virus is manufactured by every scientist&quot;,&quot;A virus can be an object studied using scientific methods&quot;,&quot;A virus is automatically a pseudoscientific claim&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;病毒可以是自然界研究對象；科學活動是用可檢查的方法研究它。對象本身不等於方法或學科，亦不能因生物有害便把相關研究叫偽科學。&quot;,&quot;key_en&quot;:&quot;Distinguish an object of investigation from the process of investigating it.&quot;,&quot;source_pages&quot;:[4],&quot;source_note&quot;:&quot;Lecture 1 PDF 4&quot;,&quot;id&quot;:&quot;L1-021&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Technology before formal theory&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A community develops effective stone cutting tools before a formal theory of materials. What does this show?&quot;,&quot;options&quot;:[&quot;Useful technology can develop through experience before a formal scientific explanation&quot;,&quot;Scientific explanations can never improve the tools&quot;,&quot;Technology must violate natural laws&quot;,&quot;Experience is completely unrelated to knowledge&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;技術可由經驗累積先發展，後來再由科學解釋及改良。這不表示工具沒有經驗知識，或能違反自然規律；因此不能說所有科技必先有完整理論。&quot;,&quot;key_en&quot;:&quot;Practical techniques can precede formal scientific explanations.&quot;,&quot;source_pages&quot;:[11,12],&quot;source_note&quot;:&quot;Lecture 1 PDF 11, 12&quot;,&quot;id&quot;:&quot;L1-022&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Dual use&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Nuclear knowledge contributes to both power generation and weapons. Which STS lesson does this best illustrate?&quot;,&quot;options&quot;:[&quot;The same knowledge can support uses with very different social consequences&quot;,&quot;Technology is defined only by beneficial outcomes&quot;,&quot;Consequences cannot be discussed once a device works&quot;,&quot;A scientific principle has only one possible use&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;相同知識可支援不同用途及後果，所以科技評估需考慮目的、風險與社會選擇。能做到某件事不會自動決定應否採用，也不是只有有益工具才算科技。&quot;,&quot;key_en&quot;:&quot;Knowledge and technical capability can have different uses and consequences.&quot;,&quot;source_pages&quot;:[11,13],&quot;source_note&quot;:&quot;Lecture 1 PDF 11, 13&quot;,&quot;id&quot;:&quot;L1-023&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Meaning of technology&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which item is a counterexample to the claim that technology must be electronic?&quot;,&quot;options&quot;:[&quot;The question of whether the universe has limits&quot;,&quot;A hypothesis about gravity&quot;,&quot;A natural virus&quot;,&quot;A stone knife designed for cutting&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;石刀是為達成切割目的而製作的工具，屬科技例子，並不需要電子元件。自然物、研究問題及假設則不單因被提及就變成人造技術工具。&quot;,&quot;key_en&quot;:&quot;Technology includes simple designed tools, not only electronics.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 1 PDF 11&quot;,&quot;id&quot;:&quot;L1-024&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Two-way support&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A scientific discovery helps improve a sensor, and the improved sensor reveals new data for scientists. What relationship is illustrated?&quot;,&quot;options&quot;:[&quot;Science and technology are completely isolated&quot;,&quot;Science ended when the sensor was built&quot;,&quot;Only technology can influence science&quot;,&quot;Science and technology can support each other in both directions&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;科學知識可以改良工具，工具又可產生新資料支援研究，展示雙向作用。把科學科技只畫成單向應用，會漏掉儀器及技術對知識發展的貢獻。&quot;,&quot;key_en&quot;:&quot;Science and technology can form a feedback relationship.&quot;,&quot;source_pages&quot;:[12],&quot;source_note&quot;:&quot;Lecture 1 PDF 12&quot;,&quot;id&quot;:&quot;L1-025&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Primary aims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which project most clearly has a primarily applied design goal?&quot;,&quot;options&quot;:[&quot;Investigate how light interacts with matter&quot;,&quot;Ask whether an existing natural model fits new observations&quot;,&quot;Build a power system that meets stated performance and safety requirements&quot;,&quot;Describe a new particle’s properties&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;建立符合性能與安全要求的系統，主要是實際設計目標。其餘較著重理解或檢驗自然；實際工作仍可混合基礎研究與工程，並非互不相干。&quot;,&quot;key_en&quot;:&quot;An applied design goal specifies a practical outcome and constraints.&quot;,&quot;source_pages&quot;:[2,12],&quot;source_note&quot;:&quot;Lecture 1 PDF 2, 12&quot;,&quot;id&quot;:&quot;L1-026&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Society shapes research&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Public funding prioritizes research on a locally serious environmental problem. Which relationship is most directly shown?&quot;,&quot;options&quot;:[&quot;A popular concern removes the need for evidence&quot;,&quot;Social priorities can influence research directions&quot;,&quot;The funded hypothesis is automatically true&quot;,&quot;Research has no relationship to public needs&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;社會需要及資助安排可影響哪些問題獲研究，屬STS的互動。不過選題得到支持，不等於研究假設已正確，仍需以方法及證據評估結果。&quot;,&quot;key_en&quot;:&quot;Social priorities can shape research without determining scientific truth.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 1 PDF 13&quot;,&quot;id&quot;:&quot;L1-027&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Technology and demand&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A popular online platform increases demand for faster phones and networks. What is the best description?&quot;,&quot;options&quot;:[&quot;The platform proves that all innovations benefit everyone&quot;,&quot;Society can only receive technology passively&quot;,&quot;Technology use can reshape demand for further technological development&quot;,&quot;Demand alone validates every technical claim&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;平台使用改變需求，需求又推動硬件與網絡發展，展示科技社會互相塑造。需求或流行程度本身並不證明所有效果有益，亦不代替技術證據。&quot;,&quot;key_en&quot;:&quot;Social use can feed back into technological development.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 1 PDF 13&quot;,&quot;id&quot;:&quot;L1-028&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Can and should&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A device is technically feasible, but its introduction raises privacy and fairness concerns. Which conclusion follows?&quot;,&quot;options&quot;:[&quot;Feasibility settles whether it should be used&quot;,&quot;Whether it can work and whether it should be adopted are distinct questions&quot;,&quot;Ethical concerns show the device cannot function&quot;,&quot;Only engineers may discuss its social effects&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;可行性問題是能否做到；採用決定亦牽涉權利、公平及風險等價值。技術成功不會單獨完成應否使用的論證，社會討論亦不只屬工程師。&quot;,&quot;key_en&quot;:&quot;Technical feasibility does not by itself settle desirability.&quot;,&quot;source_pages&quot;:[13,14],&quot;source_note&quot;:&quot;Lecture 1 PDF 13, 14&quot;,&quot;id&quot;:&quot;L1-029&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Images and evidence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A lecture slide contains a multiverse cartoon. What does its presence establish?&quot;,&quot;options&quot;:[&quot;The image is being used to raise a discussion topic&quot;,&quot;Every depicted universe has been experimentally observed&quot;,&quot;The lecturer has proved that technology has no limits&quot;,&quot;The cartoon is a quantitative dataset&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;圖片可作討論引子，但不是實驗資料或存在證明。應分清教材用來提出問題的圖像，與支持科學主張所需的觀測及推理，不能由出現圖片就推斷已證實。&quot;,&quot;key_en&quot;:&quot;A discussion image is not automatically evidence for its depicted claim.&quot;,&quot;source_pages&quot;:[14],&quot;source_note&quot;:&quot;Lecture 1 PDF 14&quot;,&quot;id&quot;:&quot;L1-030&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Highlighted versus listed&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which invention is listed on page 15 but is not one of its four yellow-highlighted items?&quot;,&quot;options&quot;:[&quot;Paper making&quot;,&quot;Magnetic compass&quot;,&quot;Block printing&quot;,&quot;Mechanical clock&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;第15頁共有七項，機械鐘有列出但不在黃色四項之內。這題考辨認清單與高亮範圍，不能把整頁每個例子都當作同一組四項。&quot;,&quot;key_en&quot;:&quot;Being listed on a slide is different from being highlighted within it.&quot;,&quot;source_pages&quot;:[15],&quot;source_note&quot;:&quot;Lecture 1 PDF 15&quot;,&quot;id&quot;:&quot;L1-031&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Printing terms&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which statement correctly keeps the two printing terms used on pages 15 and 16 distinct?&quot;,&quot;options&quot;:[&quot;Both English terms name the magnetic compass&quot;,&quot;Movable-type printing is the highlighted term on page 15&quot;,&quot;The slides contain no printing-related invention&quot;,&quot;Block printing is the page-15 highlighted term; movable-type printing appears in the extension list&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;原頁把雕版印刷放在第15頁黃色重點，活字印刷在第16頁延伸清單。兩個名稱不能隨意替換，亦不應補出原頁未提供的完整年代或人物。&quot;,&quot;key_en&quot;:&quot;Preserve the slide’s distinction between block and movable-type printing.&quot;,&quot;source_pages&quot;:[15,16],&quot;source_note&quot;:&quot;Lecture 1 PDF 15, 16&quot;,&quot;id&quot;:&quot;L1-032&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Innovation examples&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which pair consists of examples from the extension list of Chinese innovations on page 16?&quot;,&quot;options&quot;:[&quot;A virus and a photon&quot;,&quot;Canal locks and watertight ship compartments&quot;,&quot;Hypothesis and conclusion&quot;,&quot;Quantum mechanics and cosmology&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;運河閘門及水密船艙屬第16頁的技術創新例子；其他選項是研究領域、自然對象或方法詞彙。分類要看內容及用途，而不是只背英文名詞。&quot;,&quot;key_en&quot;:&quot;Classify an example by what it represents in the lecture.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 1 PDF 16&quot;,&quot;id&quot;:&quot;L1-033&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Historical claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A slide says innovations spread from East to West but gives no detailed dates. Which use of the slide is justified?&quot;,&quot;options&quot;:[&quot;Treat every image as a complete historical archive&quot;,&quot;Conclude that no later society made further improvements&quot;,&quot;Invent exact arrival dates for every technology&quot;,&quot;Summarize the stated diffusion while keeping missing chronology unspecified&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;可概括投影片所說的傳播方向，但沒有日期及完整歷史便不補造。技術傳播的簡介亦不表示之後沒有改良，作答要保留教材證據的範圍。&quot;,&quot;key_en&quot;:&quot;Do not turn a broad historical summary into unsupported precise chronology.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 1 PDF 16&quot;,&quot;id&quot;:&quot;L1-034&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Revisable models&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An atomic model is replaced after new evidence reveals features it did not explain. Which view best fits the lecture?&quot;,&quot;options&quot;:[&quot;Scientific knowledge can develop through testing and improved models&quot;,&quot;Scientific change means evidence is irrelevant&quot;,&quot;No model can ever be useful unless final&quot;,&quot;Every earlier measurement must therefore have been fraudulent&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;模型可因新資料而修訂，舊模型亦可能在某些範圍仍有用途。變更不等於所有舊資料造假，也不表示模型必須永遠不變才值得使用。&quot;,&quot;key_en&quot;:&quot;Scientific models can be useful and still open to revision.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 1 PDF 10&quot;,&quot;id&quot;:&quot;L1-035&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Meaning of theory&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student says a scientific theory is merely an unsupported guess. Which correction is most appropriate?&quot;,&quot;options&quot;:[&quot;Theories cannot generate testable predictions&quot;,&quot;Every theory is an unquestionable fact&quot;,&quot;The word theory in science can refer to an evidence-supported explanation&quot;,&quot;A theory becomes reliable solely through popularity&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;科學理論可指有證據支持的解釋，並非日常語境的隨便猜測。但有支持亦不等於不可質疑；流行程度與科學證據是不同的判斷依據。&quot;,&quot;key_en&quot;:&quot;A scientific theory can be well supported without being beyond revision.&quot;,&quot;source_pages&quot;:[5,10],&quot;source_note&quot;:&quot;Lecture 1 PDF 5, 10&quot;,&quot;id&quot;:&quot;L1-036&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Limits and values&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A study estimates the environmental effects of a technology. Does that estimate alone decide the fairest policy?&quot;,&quot;options&quot;:[&quot;No, empirical information informs a decision that may also involve values&quot;,&quot;Yes, provided the researcher is famous&quot;,&quot;No, so environmental evidence should be ignored&quot;,&quot;Yes, measured quantities automatically determine all values&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;研究可提供重要事實，但公平政策亦涉及如何分配風險與利益等價值。這不表示證據沒有用，而是不能把事實估計當作已完成全部價值選擇。&quot;,&quot;key_en&quot;:&quot;Empirical findings can inform policy without resolving every value judgment.&quot;,&quot;source_pages&quot;:[13,14],&quot;source_note&quot;:&quot;Lecture 1 PDF 13, 14&quot;,&quot;id&quot;:&quot;L1-037&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Mixed activities&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A team studies why a material cuts effectively and then designs a safer knife. Which description is best?&quot;,&quot;options&quot;:[&quot;Using a knife makes all questions unscientific&quot;,&quot;Safety requirements prevent the use of scientific knowledge&quot;,&quot;The project may include both scientific investigation and technological design&quot;,&quot;Only one of the two activities can exist in a project&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;同一項目可包含理解材料的科學問題及達成安全用途的設計問題。兩者目的可區分但會互相支持，不應把項目硬分成只能科學或只能科技。&quot;,&quot;key_en&quot;:&quot;One project can combine inquiry and design while retaining their different aims.&quot;,&quot;source_pages&quot;:[2,11,17],&quot;source_note&quot;:&quot;Lecture 1 PDF 2, 11, 17&quot;,&quot;id&quot;:&quot;L1-038&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Operational outcomes&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student wants to study whether music helps learning. Which change makes the proposed outcome clearer?&quot;,&quot;options&quot;:[&quot;Describe music as powerful without measuring anything&quot;,&quot;Define learning as the number of specified items recalled on the same test&quot;,&quot;Replace all results with whether the student likes music&quot;,&quot;Ask each group a different unscored question&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;把學習界定為共同測驗中的可量度表現，能令比較較清楚。喜好或抽象形容詞不能代替研究結果，不同題目亦會令組間比較難解釋。&quot;,&quot;key_en&quot;:&quot;Define an outcome in a way that can be measured and compared.&quot;,&quot;source_pages&quot;:[8],&quot;source_note&quot;:&quot;Lecture 1 PDF 8&quot;,&quot;id&quot;:&quot;L1-039&quot;},{&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Preliminary patterns&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A pilot observation suggests an interesting pattern. Which next action best continues scientific inquiry?&quot;,&quot;options&quot;:[&quot;Announce a universal law immediately&quot;,&quot;Ignore the pattern because pilot data are never useful&quot;,&quot;Choose only later participants expected to confirm it&quot;,&quot;Use it to develop a testable question and plan a suitable investigation&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;先導觀察可啟發研究問題，再提出假設及合適測試。初步模式不是普遍定律，也不應透過挑選有利參與者來強行確認；研究要容許結果改變原先想法。&quot;,&quot;key_en&quot;:&quot;Use preliminary observations to guide a fair test, not to bypass it.&quot;,&quot;source_pages&quot;:[6,8],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8&quot;,&quot;id&quot;:&quot;L1-040&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Understandable world&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Researchers investigate why a recurring natural pattern occurs instead of treating it as beyond possible explanation. Which scientific-worldview principle is most directly illustrated?&quot;,&quot;options&quot;:[&quot;Technology never has side effects&quot;,&quot;The World Is Understandable&quot;,&quot;Scientific knowledge can never change&quot;,&quot;Science answers every moral question&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;研究者假定自然現象可透過探究尋找規律，對應世界可理解。這並不承諾已知道所有答案，亦不表示每個細節都可精準預測，不能混成知識永不改變。&quot;,&quot;key_en&quot;:&quot;Seeking explanations assumes that natural patterns can be investigated.&quot;,&quot;source_pages&quot;:[5,6],&quot;source_note&quot;:&quot;Lecture 2 PDF 5, 6&quot;,&quot;id&quot;:&quot;L2-001&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Revisability&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;New observations challenge a widely accepted model, and scientists develop a better explanation. Which principle is most directly shown?&quot;,&quot;options&quot;:[&quot;Scientific authority replaces evidence&quot;,&quot;Scientific Knowledge Is Durable means no revision is allowed&quot;,&quot;Scientific Ideas Are Subject To Change&quot;,&quot;Scientific inquiry excludes imagination&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;新證據可促使科學解釋修訂，對應觀念可改變。修訂不是承認所有知識都無用，也不是用權威取代證據；改進模型應交代為何更符合觀察。&quot;,&quot;key_en&quot;:&quot;Scientific ideas can be revised in light of evidence.&quot;,&quot;source_pages&quot;:[6,8,9],&quot;source_note&quot;:&quot;Lecture 2 PDF 6, 8, 9&quot;,&quot;id&quot;:&quot;L2-002&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Durable knowledge&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A revised explanation appears, but an older model remains effective within its well-tested range. Which interpretation is best?&quot;,&quot;options&quot;:[&quot;A model is scientific only if it is never used&quot;,&quot;Revision makes every previous application worthless&quot;,&quot;Durability requires certainty about every future case&quot;,&quot;Knowledge can be durable while its limits become clearer&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;科學知識可在已驗證範圍長期有效，同時容許更廣模型或限制出現。持久與可修訂不是矛盾，不能將改良理論理解成所有舊用途都立即失效。&quot;,&quot;key_en&quot;:&quot;Durable usefulness can coexist with revision and a limited domain.&quot;,&quot;source_pages&quot;:[6],&quot;source_note&quot;:&quot;Lecture 2 PDF 6&quot;,&quot;id&quot;:&quot;L2-003&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Limits of science&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A study estimates the consequences of a policy, but citizens still disagree about which values should take priority. Which principle is relevant?&quot;,&quot;options&quot;:[&quot;Scientists can settle every value choice by professional status&quot;,&quot;Science Cannot Provide Complete Answers to All Questions&quot;,&quot;The oldest opinion automatically wins&quot;,&quot;Scientific results are irrelevant to any public issue&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;科學可以提供後果及風險資料，但不會單獨決定所有價值排序。資料仍然重要，只是不能把專家身份或某項測量當成已解決全部公平及政策取捨。&quot;,&quot;key_en&quot;:&quot;Science informs decisions without resolving every value question by itself.&quot;,&quot;source_pages&quot;:[6,21],&quot;source_note&quot;:&quot;Lecture 2 PDF 6, 21&quot;,&quot;id&quot;:&quot;L2-004&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Three aspects of science&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A journal invites specialists to critique a manuscript before publication. Which aspect of Nature of Science is most directly involved?&quot;,&quot;options&quot;:[&quot;Only the design of a consumer product&quot;,&quot;Only the operation of a thermostat&quot;,&quot;Only the belief that the world is understandable&quot;,&quot;Scientific enterprise&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;同行檢查是科學社群共同運作的機制，最直接對應scientific enterprise。研究同時也需要方法與證據，但題目指定的社群制度不能只答世界觀或科技控制。&quot;,&quot;key_en&quot;:&quot;Peer criticism is part of the scientific enterprise.&quot;,&quot;source_pages&quot;:[5,13],&quot;source_note&quot;:&quot;Lecture 2 PDF 5, 13&quot;,&quot;id&quot;:&quot;L2-005&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Evidence&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A claim is supported mainly by the presenter’s confidence. What would most directly strengthen its scientific assessment?&quot;,&quot;options&quot;:[&quot;More impressive clothing&quot;,&quot;A larger promotional slogan&quot;,&quot;Relevant observations and methods that others can inspect&quot;,&quot;An instruction not to question the speaker&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;科學判斷需要相關而可檢查的證據與方法，不是看表達是否自信。服飾、宣傳或禁止提問都不能增加主張的證據支持，仍要問資料如何產生及分析。&quot;,&quot;key_en&quot;:&quot;Scientific claims require inspectable evidence rather than confidence alone.&quot;,&quot;source_pages&quot;:[11,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 16&quot;,&quot;id&quot;:&quot;L2-006&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Logic and imagination&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A scientist invents a possible explanation and then works out how to test it. What role does imagination play?&quot;,&quot;options&quot;:[&quot;It permits any desired conclusion&quot;,&quot;It makes testing unnecessary&quot;,&quot;It can generate ideas that still require logical and empirical checks&quot;,&quot;It is forbidden whenever science is involved&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;想像可幫助提出新解釋及研究方法，但仍需邏輯與證據檢查。容許創意不等於所有想法都獲證實；科學亦不會因需要證據就禁止提出新構想。&quot;,&quot;key_en&quot;:&quot;Creativity generates possibilities; evidence and reasoning assess them.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 2 PDF 11&quot;,&quot;id&quot;:&quot;L2-007&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Explanation and prediction&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A proposed model explains existing observations but repeatedly fails a clear prediction under suitable conditions. What is the best next response?&quot;,&quot;options&quot;:[&quot;Treat explanation alone as permanent confirmation&quot;,&quot;Ignore the prediction because prediction is not part of inquiry&quot;,&quot;Replace the measured result with the expected result&quot;,&quot;Examine the model, test conditions and alternative explanations&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;解釋與預測都屬探究重點。預測失敗需檢查模型、程序及其他解釋，不能為保留主張改數據，亦不宜因能說明舊觀察就認定永遠正確。&quot;,&quot;key_en&quot;:&quot;Models should be assessed against both explanations and testable predictions.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 2 PDF 11&quot;,&quot;id&quot;:&quot;L2-008&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Avoiding bias&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A researcher specifies the outcome measure before seeing which group performs better. What problem is this most directly intended to reduce?&quot;,&quot;options&quot;:[&quot;Choosing a favourable measure after inspecting the result&quot;,&quot;The existence of alternative hypotheses&quot;,&quot;The need to collect data&quot;,&quot;Every possible source of uncertainty&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;事前界定指標，可減少看到結果後才挑有利量度的偏向。這不會消除所有不確定性或代替收集資料，但有助公平評估原先研究問題。&quot;,&quot;key_en&quot;:&quot;Predefined measures can reduce selective outcome reporting.&quot;,&quot;source_pages&quot;:[11,24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 24, 25&quot;,&quot;id&quot;:&quot;L2-009&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Evidence over authority&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An influential scientist rejects a finding without considering the supporting data. Which response best fits the lecture?&quot;,&quot;options&quot;:[&quot;Evaluate the evidence rather than treating status as the final authority&quot;,&quot;Replace peer review with a popularity vote&quot;,&quot;Accept every rejected finding as a breakthrough&quot;,&quot;The finding must be false because the scientist is influential&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;科學不以權威作最終判準，應檢查證據與推理。這亦不表示所有被拒絕的主張必定正確；支持或反對都要提出可評估理由，而非只比名望。&quot;,&quot;key_en&quot;:&quot;Scientific authority remains accountable to evidence.&quot;,&quot;source_pages&quot;:[14,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 14, 16&quot;,&quot;id&quot;:&quot;L2-010&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Changing astronomical models&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;What is the most careful lesson from comparing the geocentric and heliocentric models in the slides?&quot;,&quot;options&quot;:[&quot;Models of natural systems can change as evidence and explanations improve&quot;,&quot;The Sun is now known to be the centre of the entire universe&quot;,&quot;A model becomes correct when it is old&quot;,&quot;Historical diagrams remove the need for observation&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;兩頁展示自然解釋模型可改變，重點是觀測與解釋能力。日心模型並不是今天認為太陽居整個宇宙中心，也不能以古老程度決定模型是否正確。&quot;,&quot;key_en&quot;:&quot;Historical model changes illustrate revision, not a new universal centre.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 2 PDF 8, 9&quot;,&quot;id&quot;:&quot;L2-011&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Perspective and context&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two people read a symbol as six and nine from opposite directions. What should a scientific discussion do before deciding that both interpretations are equally correct?&quot;,&quot;options&quot;:[&quot;Choose the more confident observer&quot;,&quot;Declare that every scientific question is only personal opinion&quot;,&quot;Check relevant context, including the intended orientation&quot;,&quot;Assume no evidence could resolve any disagreement&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;視角可影響理解，但仍可查原本方向、作者意思及其他背景。這幅漫畫不證明所有問題都沒有可查答案，也不令主觀確信成為證據的替代品。&quot;,&quot;key_en&quot;:&quot;Perspective matters, but relevant context may resolve a disagreement.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 2 PDF 10&quot;,&quot;id&quot;:&quot;L2-012&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Carbon comparison&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student wants to compare the carbon impact of two fruits. Which approach best reflects the inquiry principles in the lecture?&quot;,&quot;options&quot;:[&quot;Choose the answer from the colour of the fruit&quot;,&quot;Compare relevant data using a defined and consistent boundary&quot;,&quot;Assume the fruit with the shorter name is lower-carbon&quot;,&quot;Count only a stage favourable to the preferred fruit&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;比較需要界定計算範圍及相關資料，例如生產、運輸或儲存是否一致。只挑有利階段會造成偏差；投影片沒有完整數據，不能單靠水果名稱下結論。&quot;,&quot;key_en&quot;:&quot;Environmental comparisons require relevant evidence and consistent boundaries.&quot;,&quot;source_pages&quot;:[11,12],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 12&quot;,&quot;id&quot;:&quot;L2-013&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Peer review limitations&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A paper has passed peer review. Which statement is most accurate?&quot;,&quot;options&quot;:[&quot;It cannot be challenged by later evidence&quot;,&quot;Its social consequences have automatically been approved&quot;,&quot;No mistake can remain in it&quot;,&quot;It has undergone a checking process, but its claims remain open to scrutiny&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;同行評議是社群檢查機制，可以協助發現問題，但不保證每項發表永不出錯。方法、結果及解釋仍可被其他研究檢查，亦不會自動決定社會應否採用。&quot;,&quot;key_en&quot;:&quot;Peer review supports scrutiny rather than guaranteeing infallibility.&quot;,&quot;source_pages&quot;:[13,14],&quot;source_note&quot;:&quot;Lecture 2 PDF 13, 14&quot;,&quot;id&quot;:&quot;L2-014&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Burden of proof&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An inventor argues that rejection by experts proves the invention is revolutionary and correct. What is the main flaw?&quot;,&quot;options&quot;:[&quot;Being rejected is not positive evidence that the claim works&quot;,&quot;Experts never make mistakes&quot;,&quot;An inventor may never challenge accepted views&quot;,&quot;A novel idea can never be correct&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;被質疑或拒絕本身不證明正確或錯誤。提出新主張者仍有舉證責任，需要可檢查方法、資料與可重做結果，不能把批評直接變成成功證明。&quot;,&quot;key_en&quot;:&quot;Rejection is not a substitute for evidence supporting a claim.&quot;,&quot;source_pages&quot;:[14],&quot;source_note&quot;:&quot;Lecture 2 PDF 14&quot;,&quot;id&quot;:&quot;L2-015&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Scientific community&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which activity best challenges the movie stereotype of science as a lone genius working beyond all criticism?&quot;,&quot;options&quot;:[&quot;A researcher bans all external checking&quot;,&quot;Researchers share methods and critique one another’s work&quot;,&quot;A fictional scientist has a dramatic laboratory&quot;,&quot;One individual declares ethical rules unnecessary&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;科學社群常透過合作、分享及批評運作，與電影的孤立天才形象不同。這不保證每位研究者都合乎倫理，但不能用戲劇情節代替實際社群機制。&quot;,&quot;key_en&quot;:&quot;Science commonly involves collaborative and critical community processes.&quot;,&quot;source_pages&quot;:[13,15],&quot;source_note&quot;:&quot;Lecture 2 PDF 13, 15&quot;,&quot;id&quot;:&quot;L2-016&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Human judgement&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Researchers recognize that expectations can influence observation and interpretation. Which response is best?&quot;,&quot;options&quot;:[&quot;Use transparent methods and checks to identify and reduce bias&quot;,&quot;Treat each preferred interpretation as equally supported&quot;,&quot;Assume professional training removes every human influence&quot;,&quot;Abandon evidence because objectivity is impossible&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;認識人會受期望與經驗影響，應促使採用透明程序及偏差檢查，而非放棄證據。科學有人類判斷，不代表所有解釋都有相同支持，也不保證專業者零偏見。&quot;,&quot;key_en&quot;:&quot;Recognizing human influence motivates checks rather than abandoning evidence.&quot;,&quot;source_pages&quot;:[11,13,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 13, 16&quot;,&quot;id&quot;:&quot;L2-017&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Theory and law&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;A student says that enough supporting evidence will turn a scientific theory into a law. What is the best correction?&quot;,&quot;options&quot;:[&quot;Theories and laws have different roles rather than being successive ranks&quot;,&quot;Scientific laws cannot describe natural relationships&quot;,&quot;Laws are explanations and theories are always guesses&quot;,&quot;Every theory is already a law with another name&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;NSTA閱讀分清理論的解釋角色與定律對關係的描述，兩者不是由低升高的等級。增加支持可強化理論，並不會自動令它變成另一種類別。&quot;,&quot;key_en&quot;:&quot;Theories do not become laws merely by accumulating support.&quot;,&quot;source_pages&quot;:[6,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 6, 16; NSTA Nature of Science supplementary reading&quot;,&quot;id&quot;:&quot;L2-018&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Observation and inference&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A weather station records current temperature, and a forecaster predicts tomorrow’s conditions. Which distinction is most appropriate?&quot;,&quot;options&quot;:[&quot;The forecast is a measuring instrument&quot;,&quot;The temperature record is an observation; the forecast is an inference from information&quot;,&quot;A prediction can never use observations&quot;,&quot;Both are direct observations of tomorrow&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;當前溫度是量得的觀察，對明日情況的預報則由資料與模型推論。兩者可互相連結，但不能把未來尚未發生的狀況稱為已直接觀察的事實。&quot;,&quot;key_en&quot;:&quot;Distinguish recorded observations from conclusions or predictions drawn from them.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 2 PDF 11; NSTA Nature of Science supplementary reading&quot;,&quot;id&quot;:&quot;L2-019&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Naturalistic explanation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A proposed explanation relies on a supernatural cause that is protected from every possible empirical test. Why is this problematic within scientific inquiry?&quot;,&quot;options&quot;:[&quot;It is too short to be scientific&quot;,&quot;The proposal is written in an unfamiliar language&quot;,&quot;Its stated mechanism cannot be assessed using the proposed empirical methods&quot;,&quot;Science has already proved every supernatural belief false&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;問題是該解釋是否容許自然界證據檢查，並不是已證明所有超自然信念都假。科學方法的適用界線，與對任何信仰作全面真假判決是不同問題。&quot;,&quot;key_en&quot;:&quot;Scientific explanations must be open to empirical assessment.&quot;,&quot;source_pages&quot;:[11,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 16; NSTA Nature of Science supplementary reading&quot;,&quot;id&quot;:&quot;L2-020&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Technology supports science&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A new imaging instrument enables researchers to obtain observations previously inaccessible. Which relationship does this illustrate?&quot;,&quot;options&quot;:[&quot;Technology must wait until every scientific question is solved&quot;,&quot;Scientific investigation never uses designed systems&quot;,&quot;Technology can contribute to scientific knowledge&quot;,&quot;Only scientific knowledge can affect technology, never the reverse&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;新儀器可開啟原本難以觀察的資料，顯示科技亦能貢獻科學。科學與科技不是只有理論單向應用的關係，工具發展可以改變可研究的問題。&quot;,&quot;key_en&quot;:&quot;Technology can expand what scientists are able to investigate.&quot;,&quot;source_pages&quot;:[17,18],&quot;source_note&quot;:&quot;Lecture 2 PDF 17, 18&quot;,&quot;id&quot;:&quot;L2-021&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Appert example&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Why does the lecture discuss food preservation before its later scientific explanation?&quot;,&quot;options&quot;:[&quot;To show that practical methods can precede formal explanations&quot;,&quot;To show that preserved food follows no natural processes&quot;,&quot;To prove that experience never informs design&quot;,&quot;To show that scientific understanding cannot improve technology&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;Appert例子用來指出經驗技術可先於正式科學解釋。這不是說方法違反自然規律，亦不是否定後來科學可幫助理解、改良及評估保存技術。&quot;,&quot;key_en&quot;:&quot;An effective technique may arise before its scientific explanation is developed.&quot;,&quot;source_pages&quot;:[19],&quot;source_note&quot;:&quot;Lecture 2 PDF 19&quot;,&quot;id&quot;:&quot;L2-022&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Design constraints&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A team must design a device within a budget, weight limit and safety requirement. Which technology principle is most directly involved?&quot;,&quot;options&quot;:[&quot;All technological choices are unconstrained&quot;,&quot;The world is already completely understood&quot;,&quot;Design under constraint&quot;,&quot;A scientific theory has become a law&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;預算、重量及安全要求限定了可行方案，對應design under constraint。設計不是只追求單一最高性能；需要在限制下作合理取捨，並檢查是否達標。&quot;,&quot;key_en&quot;:&quot;Designs must satisfy relevant constraints rather than optimize without limits.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 2 PDF 20&quot;,&quot;id&quot;:&quot;L2-023&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Control systems&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A thermostat measures temperature and adjusts heating in response. Which listed technology characteristic is most directly illustrated?&quot;,&quot;options&quot;:[&quot;Technology has no human input anywhere&quot;,&quot;Technologies involve control&quot;,&quot;Every side effect is a failure&quot;,&quot;Scientific ideas must never change&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;量度結果用來調節系統操作，是控制的例子。它不同於副作用或系統失效；有控制機制亦不代表系統永遠不會故障，仍須看設計及條件。&quot;,&quot;key_en&quot;:&quot;Control links information about a system to adjustments of its operation.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 2 PDF 20&quot;,&quot;id&quot;:&quot;L2-024&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Side effects&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A device performs its intended communication function, but its normal use also causes an unwanted distraction. What distinction is most useful?&quot;,&quot;options&quot;:[&quot;Side effects and failure must always mean the same thing&quot;,&quot;A working device cannot affect users beyond its stated purpose&quot;,&quot;An additional consequence can be a side effect even if the main function works&quot;,&quot;Any unwanted effect proves no intended function occurred&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;科技正常運作仍可能帶來額外後果，因此副作用不一定等同主功能失效。評估科技時要看預定功能以外的影響，而不是只問開機是否成功。&quot;,&quot;key_en&quot;:&quot;Side effects and failure are related but distinct categories.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 2 PDF 20&quot;,&quot;id&quot;:&quot;L2-025&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;System failure&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A cooling system cannot maintain the specified temperature under its rated conditions. Which description best fits?&quot;,&quot;options&quot;:[&quot;Proof that every cooling principle is false&quot;,&quot;Only a moral disagreement&quot;,&quot;Failure to achieve an expected system function&quot;,&quot;An example of a system with no design goal&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;在指定使用條件下未達預期功能，是系統失效的例子。這不會自動推翻所有相關科學原理；仍需檢查元件、控制、使用條件及整體設計。&quot;,&quot;key_en&quot;:&quot;A system can fail when it does not deliver its specified function.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 2 PDF 20&quot;,&quot;id&quot;:&quot;L2-026&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Social constraints&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A technically possible monitoring system is restricted because of privacy concerns. Which principle is most relevant?&quot;,&quot;options&quot;:[&quot;A restricted device must be mechanically impossible&quot;,&quot;Technical possibility removes every public concern&quot;,&quot;Social rules can change measured evidence into any preferred result&quot;,&quot;Society may constrain how technology is developed or used&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;社會可以因私隱或其他考慮限制科技使用，這與裝置在技術上能否做到不同。限制亦不代表資料可任意改變；科技決策結合事實、權利及社會安排。&quot;,&quot;key_en&quot;:&quot;Social choices can constrain technology without making it technically impossible.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 2 PDF 21&quot;,&quot;id&quot;:&quot;L2-027&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Complex decisions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two designs differ in cost, safety and environmental consequences. Which approach best fits the lecture’s account of technological decisions?&quot;,&quot;options&quot;:[&quot;Treat one successful laboratory test as approval of every consequence&quot;,&quot;Consider the relevant trade-offs and affected groups&quot;,&quot;Select whichever design has the longest technical name&quot;,&quot;Ignore all constraints because the device is new&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;科技選擇可能同時涉及成本、安全及不同受影響者，須比較相關取捨。新穎、名稱或單一測試結果都不能代替對整體用途與後果的分析。&quot;,&quot;key_en&quot;:&quot;Technological decisions often require several kinds of evidence and value judgment.&quot;,&quot;source_pages&quot;:[18,21],&quot;source_note&quot;:&quot;Lecture 2 PDF 18, 21&quot;,&quot;id&quot;:&quot;L2-028&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Human presence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An automated system runs without a person pressing each button. Why does this not establish that humans are absent from technology?&quot;,&quot;options&quot;:[&quot;Humans cannot set goals for an automated system&quot;,&quot;Automated systems are natural organisms&quot;,&quot;People may still define goals, design controls and decide how outputs are used&quot;,&quot;Automation means no design decisions were made&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;自動運作不表示沒有人的目標與選擇；設計、控制設定及使用輸出仍有人參與。題目要分清即時操作與整個科技系統的人類角色，不能只看是否逐次按鈕。&quot;,&quot;key_en&quot;:&quot;Automation does not remove human choices from the wider system.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 2 PDF 21&quot;,&quot;id&quot;:&quot;L2-029&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Engineering values&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A design maximizes speed but violates a safety constraint. Why is speed alone an insufficient success criterion?&quot;,&quot;options&quot;:[&quot;A faster result always cancels every other requirement&quot;,&quot;Safety never concerns engineering&quot;,&quot;Only the colour of the device matters&quot;,&quot;Engineering can involve practical values and multiple requirements&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;工程結合科學探究與實際要求，成功不能只看單一速度。若有安全限制，方案亦需符合；這說明技術表現與設計取捨要按完整任務評估。&quot;,&quot;key_en&quot;:&quot;Engineering success is judged against the full set of relevant requirements.&quot;,&quot;source_pages&quot;:[18,20],&quot;source_note&quot;:&quot;Lecture 2 PDF 18, 20&quot;,&quot;id&quot;:&quot;L2-030&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Checking an AI proposal&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An AI supplies an elegant study plan and several references. What should the student do before accepting its claims?&quot;,&quot;options&quot;:[&quot;Choose the answer with the most confident wording&quot;,&quot;Invent results to complete the plan&quot;,&quot;Assume fluency establishes accuracy&quot;,&quot;Verify the sources and assess whether the design tests the question fairly&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;AI可協助產生方案，但來源是否存在、是否支持主張及設計是否公平仍要核對。流暢或有引用不等於老師已驗證，更不能為完成計劃虛構數據。&quot;,&quot;key_en&quot;:&quot;An AI-generated proposal still requires source and design verification.&quot;,&quot;source_pages&quot;:[24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 24, 25&quot;,&quot;id&quot;:&quot;L2-031&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Number of research steps&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two AI proposals list seven and five steps respectively. Which criterion is more useful than choosing the longer list?&quot;,&quot;options&quot;:[&quot;Whether the author uses more section headings&quot;,&quot;Whether a fair design, suitable measures and justified analysis address the question&quot;,&quot;Whether the proposal repeats the title more often&quot;,&quot;Whether the expected conclusion matches the student’s preference&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;步驟數不直接決定科學品質，較重要是問題、變量、分組、量度及分析是否相配。較短方案可能包含必要控制；較長文字亦可能只有漂亮標題。&quot;,&quot;key_en&quot;:&quot;Evaluate the substance of a design rather than the number of headings.&quot;,&quot;source_pages&quot;:[25],&quot;source_note&quot;:&quot;Lecture 2 PDF 25&quot;,&quot;id&quot;:&quot;L2-032&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Competing hypotheses&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two proposals predict opposite outcomes for online teaching. Which statement is best?&quot;,&quot;options&quot;:[&quot;Either can be a starting hypothesis if it has a rationale and can face a fair test&quot;,&quot;Only the prediction the student likes is scientific&quot;,&quot;Opposite predictions can never be tested&quot;,&quot;The proposal with more references must be correct before testing&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;相反假設可各自有待檢驗的理由，關鍵是能否公平測試與接受結果。個人偏好或引用數量不是預先決定真假的方法，應檢查來源、機制及研究設計。&quot;,&quot;key_en&quot;:&quot;A hypothesis is evaluated through its rationale and testing, not preferred outcomes.&quot;,&quot;source_pages&quot;:[24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 24, 25&quot;,&quot;id&quot;:&quot;L2-033&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Teaching-mode comparison&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A team compares face-to-face, online and hybrid classes using completely different final tests. What is the most direct difficulty?&quot;,&quot;options&quot;:[&quot;An online group must always perform worse&quot;,&quot;Differences in the measures may undermine the comparison of learning outcomes&quot;,&quot;Teaching modes cannot be a research topic&quot;,&quot;More than two groups are never allowed&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;不同測驗可能令分數差異反映量度不同，而不只是教學模式。題目有三組本身不構成問題，亦不能預設某組必定較差；需先建立可比的結果指標。&quot;,&quot;key_en&quot;:&quot;Comparable outcome measures are important when comparing teaching modes.&quot;,&quot;source_pages&quot;:[24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 24, 25&quot;,&quot;id&quot;:&quot;L2-034&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Research ethics&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A proposed classroom study would expose identifiable student results without an appropriate plan for permission or privacy. Which response is best?&quot;,&quot;options&quot;:[&quot;Publish names first and decide later&quot;,&quot;Treat ethical planning as part of designing acceptable research&quot;,&quot;Ignore the issue if the hypothesis is interesting&quot;,&quot;Assume an AI-generated plan automatically has permission&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;研究設計亦要考慮參與者權益及資料使用，不能因問題有趣或由AI產生便假設已有許可。具體安排應按研究情境評估，而不是先公開再補理由。&quot;,&quot;key_en&quot;:&quot;Research quality includes appropriate treatment of participants and their information.&quot;,&quot;source_pages&quot;:[13,24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 13, 24, 25&quot;,&quot;id&quot;:&quot;L2-035&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Citation relevance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A cited article exists, but it studied a different population and did not report the claimed result. What follows?&quot;,&quot;options&quot;:[&quot;The citation does not by itself justify the specific claim&quot;,&quot;Its existence alone supports the AI’s claim&quot;,&quot;A reference list makes interpretation unnecessary&quot;,&quot;The study must be fabricated because it is not directly applicable&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;文獻存在不代表AI準確解讀，亦不代表可直接推至另一群體。應查原文結果、對象及研究條件；不相關與造假是不同問題，不能只靠一個引文接受結論。&quot;,&quot;key_en&quot;:&quot;Verify what a source actually supports, not merely that it exists.&quot;,&quot;source_pages&quot;:[24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 24, 25&quot;,&quot;id&quot;:&quot;L2-036&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Research tools&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;A student needs to organize bibliographic records and citations. Which category in the lecture’s tool diagram is most directly relevant?&quot;,&quot;options&quot;:[&quot;A hypothesis cannot use references&quot;,&quot;Only a microscope&quot;,&quot;Only a thermostat&quot;,&quot;Citation-management tools such as Zotero&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;Zotero等例子放在引用管理類別，主要幫助整理書目及引用。工具能協助流程，但不代替閱讀原文、判斷相關性或核實一項研究主張是否正確。&quot;,&quot;key_en&quot;:&quot;Citation tools assist reference organization rather than judging every claim.&quot;,&quot;source_pages&quot;:[26],&quot;source_note&quot;:&quot;Lecture 2 PDF 26&quot;,&quot;id&quot;:&quot;L2-037&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Appearance and credibility&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A speaker puts on a white laboratory coat before making the same unsupported claim. What has changed scientifically?&quot;,&quot;options&quot;:[&quot;The coat has supplied the missing data&quot;,&quot;The hypothesis has become a law&quot;,&quot;Peer review has automatically taken place&quot;,&quot;Only the presentation has changed; the evidence still needs assessment&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;白袍改變外觀，沒有補上數據、測試或同行檢查。課堂圖片正是提醒由外表返回方法與證據，而不是把服飾或專業形象當成可信度的充分證明。&quot;,&quot;key_en&quot;:&quot;Scientific credibility is not established by clothing.&quot;,&quot;source_pages&quot;:[3,4],&quot;source_note&quot;:&quot;Lecture 2 PDF 3, 4&quot;,&quot;id&quot;:&quot;L2-038&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Soybean research example&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a soybean project, analysing gene sequences helps explain traits, while breeding work develops a useful crop. Which distinction is most appropriate?&quot;,&quot;options&quot;:[&quot;Explaining gene–trait relationships is scientific inquiry; developing the crop is a technological application&quot;,&quot;Neither activity can affect food production&quot;,&quot;Sequence analysis is merely clothing-based authority&quot;,&quot;The technology automatically proves every claim about social benefit&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;分析基因與性狀關係主要尋求理解；發展可用作物是技術應用。兩者可以互相支持，再評估對食物與農民的影響；用途存在亦不保證每項效益主張。&quot;,&quot;key_en&quot;:&quot;Separate scientific understanding, technical application and social impact.&quot;,&quot;source_pages&quot;:[28],&quot;source_note&quot;:&quot;Lecture 2 PDF 28&quot;,&quot;id&quot;:&quot;L2-039&quot;},{&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Optical-fibre example&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which statement best separates the science, technology and impact in an optical-fibre communication example?&quot;,&quot;options&quot;:[&quot;The fibre itself is a moral conclusion&quot;,&quot;Social impact is simply another name for the physical theory&quot;,&quot;A useful communication system needs no account of how it works&quot;,&quot;Wave behaviour, a designed transmission system, and effects on communication are different but connected parts&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;波或光傳播原理、實際傳輸系統及人類通訊影響屬不同層次，課堂要求先分清再連起來。不能把科學原理、產品與社會結果全部當成同一概念。&quot;,&quot;key_en&quot;:&quot;Distinguish the physical explanation, engineered system and social consequences.&quot;,&quot;source_pages&quot;:[28],&quot;source_note&quot;:&quot;Lecture 2 PDF 28&quot;,&quot;id&quot;:&quot;L2-040&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Placebo expectations&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A person expects relief after receiving an inactive preparation and later reports feeling better. Which interpretation is most careful?&quot;,&quot;options&quot;:[&quot;The report is necessarily a nocebo effect&quot;,&quot;An expectancy-related placebo effect may contribute, but this report alone does not isolate every cause&quot;,&quot;Every improvement must be caused by expectation alone&quot;,&quot;The preparation has proved its advertised biological mechanism&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;正面期待可能影響反應，但單次改善亦可能涉及自然變化及其他因素。不能把整體安慰劑反應全歸期待，更不能由感覺改善證明產品宣稱的特殊機制。&quot;,&quot;key_en&quot;:&quot;A positive response does not by itself establish a product-specific effect.&quot;,&quot;source_pages&quot;:[18,19],&quot;source_note&quot;:&quot;Lecture 3 PDF 18, 19&quot;,&quot;id&quot;:&quot;L3-001&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Nocebo&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a hypothetical study, more negative expectations increase reported discomfort while the treatment is held constant. Which concept is most directly relevant?&quot;,&quot;options&quot;:[&quot;Nocebo effect&quot;,&quot;Occam’s razor&quot;,&quot;A guaranteed pharmacological overdose&quot;,&quot;Independent assortment&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;負面期待可能引起或加重不適，對應nocebo。這不表示不適一定是假裝，也不能把所有不良反應都說成心理作用；實際個案仍需按證據評估原因。&quot;,&quot;key_en&quot;:&quot;Nocebo concerns adverse responses associated with negative expectations.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 3 PDF 20&quot;,&quot;id&quot;:&quot;L3-002&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Real and imitation crystals&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;The teaching reading reports no difference in sensations between real quartz and plastic-imitation groups. What is the most justified conclusion?&quot;,&quot;options&quot;:[&quot;The two groups are proven exactly equal in every outcome&quot;,&quot;Every possible crystal effect has been disproved forever&quot;,&quot;The reported comparison does not support an added effect of real quartz on the measured sensations&quot;,&quot;All participants must have been deliberately dishonest&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;這個比較未支持真水晶帶來額外的所量度感覺，但未提供分組數據與不確定性。不能把文字的沒有差異，擴大成精確相等、所有效果永不存在或參與者全說謊。&quot;,&quot;key_en&quot;:&quot;A report

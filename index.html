quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A bakery compares an 8 g single-use bag with a 40 g reusable bag. Each reusable bag completes eight trips before disposal in the observed pilot. For 800 trips, assume no losses and ignore washing and manufacturing impacts for the mass calculation. Which conclusion follows?&quot;,&quot;options&quot;:[&quot;Both options use 6.4 kg because they provide the same number of trips.&quot;,&quot;The reusable option uses 32 kg because each of the 800 trips needs a reusable bag.&quot;,&quot;The reusable option uses less packaging mass and therefore must have lower impact in every environmental category.&quot;,&quot;The reusable option uses 4.0 kg versus 6.4 kg of single-use packaging, but that mass comparison alone cannot settle total environmental impact.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;重用選項每 8 次先需要一個袋，800/8＝100 袋，即 4,000 g；單次 800×8＝6,400 g。功能單位係同樣 800 次，唔係相同袋數。少 2.4 kg 只講物料質量，製造、清洗、運輸同處理仍須其他資料。&quot;,&quot;key_en&quot;:&quot;Compare the same number of trips. The mass result does not cover other life-cycle impacts.&quot;,&quot;source_pages&quot;:[17,21,22,23],&quot;source_note&quot;:&quot;Lecture 6 PDF 17, 21, 22, 23 • new practice scenario&quot;},{&quot;id&quot;:&quot;H7-01&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Dihybrid conditional probability&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume independent assortment, complete dominance and equal survival in an RrYy × RrYy cross. A randomly chosen offspring is already known to show at least one dominant phenotype. What is the probability that it shows both?&quot;,&quot;options&quot;:[&quot;9/16&quot;,&quot;3/5&quot;,&quot;3/4&quot;,&quot;2/5&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;兩個顯性同時出現：¾ × ¾ = 9/16。完全冇顯性只得 rryy：¼ × ¼ = 1/16。「已知至少一個顯性」就剔除 rryy，合資格有 15/16，所以 (9/16) ÷ (15/16) = 9/15 = 3/5。9/16 用咗全體分母；3/4 係已知某一個指定性狀顯性時另一個顯性嘅機會；2/5 係呢批入面恰好一個顯性。&quot;,&quot;key_en&quot;:&quot;Calculate the joint event first, then condition on the eligible offspring.&quot;,&quot;source_pages&quot;:[8,9,11],&quot;source_note&quot;:&quot;Lecture 7 PDF 8, 9, 11. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-02&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;X-linked risk across two known sons&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Under a simplified X-linked recessive model, a carrier mother XᴬXᵃ and an unaffected father XᴬY have two children. You are told both children are sons. Assuming independent transmissions, what is the probability that exactly one of the two sons is affected?&quot;,&quot;options&quot;:[&quot;1/4&quot;,&quot;3/8&quot;,&quot;3/4&quot;,&quot;1/2&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;已知兩個都係兒子，每人已經由爸爸收到 Y，所以各有 ½ 機會由媽媽收到 Xᵃ。恰好一個有兩個次序：患病→健康，或健康→患病，所以 ½×½ + ½×½ = ½。¼ 只計咗一個次序；3/8 係未限定兩個都係兒子時，用全體子女每個患病率 ¼，計恰好一個；¾ 係兩個兒子之中至少一人患病。&quot;,&quot;key_en&quot;:&quot;Condition on both sons before counting both orders for exactly one affected child.&quot;,&quot;source_pages&quot;:[37,39],&quot;source_note&quot;:&quot;Lecture 7 PDF 37, 39. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-03&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Conditioning on unaffected offspring&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A carrier mother XᴬXᵃ and an unaffected father XᴬY have a child. Assume a 1/2 probability of a son, independent transmission, and a fully penetrant X-linked recessive condition. You learn only that the child is unaffected. What is the probability the child is a son?&quot;,&quot;options&quot;:[&quot;1/3&quot;,&quot;1/4&quot;,&quot;1/2&quot;,&quot;2/3&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;四個等可能結果：XᴬXᴬ 女、XᴬXᵃ 女、XᴬY 男、XᵃY 男。頭三個健康，最後一個患病。已知健康，只剩三個結果，其中一個係男，所以 1/3。1/4 係全體子女中「健康且係兒子」；1/2 係未知道健康狀態前嘅男孩機會；2/3 係已知健康而係女孩嘅機會。&quot;,&quot;key_en&quot;:&quot;Among three equally likely unaffected genotypes, only one is a son.&quot;,&quot;source_pages&quot;:[37,39],&quot;source_note&quot;:&quot;Lecture 7 PDF 37, 39. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-04&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Heterozygote phenotype and gametes&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a plant population, genotype TT is tall, Tt is intermediate and tt is short under the same growing conditions. Which prediction for a Tt × tt cross is correct under this incomplete-dominance model?&quot;,&quot;options&quot;:[&quot;The Tt parent makes only T gametes, so all offspring are intermediate.&quot;,&quot;The Tt parent makes only t gametes, so all offspring are short.&quot;,&quot;The Tt parent makes T and t gametes, yielding 1/2 intermediate and 1/2 short offspring.&quot;,&quot;The Tt parent makes T and t gametes, yielding 1/2 tall and 1/2 short offspring.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;Tt 個體有 T 同 t，但分離後每個配子只帶其一。Tt 親本傳 T 或 t 各 ½；tt 親本只傳 t，所以後代 Tt、tt 各半。題設係不完全顯性，Tt 為中等高度，並唔係高。B 把中間表型當成只能傳 t，D 則暗中轉用完全顯性。&quot;,&quot;key_en&quot;:&quot;Alleles segregate into gametes, while incomplete dominance determines the heterozygote phenotype.&quot;,&quot;source_pages&quot;:[8,9,10],&quot;source_note&quot;:&quot;Lecture 7 PDF 8, 9, 10. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-05&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Linked loci and the double-recessive class&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A test cross pairs RrYy with rryy. Complete dominance applies at both loci. Out of 200 offspring, 82 show both dominant traits, 80 show neither, 20 show only the R trait and 18 show only the Y trait. Which interpretation best fits these counts?&quot;,&quot;options&quot;:[&quot;The data fit independent assortment because each dominant trait appears in about half the offspring.&quot;,&quot;The four classes must follow 9:3:3:1 because the first parent is heterozygous at both loci.&quot;,&quot;Only the 80 double-recessive offspring can be used to infer a gamete from the heterozygous parent.&quot;,&quot;The joint classes deviate from the 1:1:1:1 test-cross expectation, consistent with RY and ry gametes being more frequent.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;rryy 只畀 ry，所以每個表型直接反映 RrYy 畀咗 RY、ry、Ry 定 rY。假如獨立分配，四類應約各 50，實際 RY、ry 特別多，符合連鎖嘅一個解釋。將兩性狀分開睇，各約一半有顯性，仍然可以掩蓋佢哋一齊出現嘅偏差。9:3:3:1 係獨立嘅雙雜合互交，唔係呢個測交。&quot;,&quot;key_en&quot;:&quot;Marginal frequencies can be near one-half while the joint distribution differs strongly from independence.&quot;,&quot;source_pages&quot;:[8,11],&quot;source_note&quot;:&quot;Lecture 7 PDF 8, 11. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-06&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;ABO deduction and conditioning&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In the simple ABO model, two parents have one child with blood group AB and one child with blood group O. For a further child of these parents, what is the probability of group A given that the child is not group O?&quot;,&quot;options&quot;:[&quot;1/4&quot;,&quot;1/3&quot;,&quot;1/2&quot;,&quot;2/3&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;O 小朋友係 OO，兩位親本各有 O。AB 小朋友要分別收到 A 和 B，於是親本係 AO、BO。四種基因型 AB、AO、BO、OO 原本等可能。已知唔係 O 就剩三種，只有 AO 係 A，所以 1/3。¼ 遺漏條件，½ 則錯當 A、B 只得兩個可能，漏咗 AB。&quot;,&quot;key_en&quot;:&quot;Infer AO × BO first, then restrict the denominator to A, B and AB.&quot;,&quot;source_pages&quot;:[8,13],&quot;source_note&quot;:&quot;Lecture 7 PDF 8, 13. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-07&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Counting centromeres in meiosis&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A species has six chromosomes in a diploid cell. Count chromosomes by centromeres and count each chromatid as one DNA molecule. Immediately after meiosis I and before meiosis II, what does each of the two daughter cells contain?&quot;,&quot;options&quot;:[&quot;3 chromosomes and 3 DNA molecules&quot;,&quot;6 chromosomes and 6 DNA molecules&quot;,&quot;3 chromosomes and 6 DNA molecules&quot;,&quot;6 chromosomes and 12 DNA molecules&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;原本 2n = 6，複製後仍係 6 個染色體，但有 12 條染色單體。減數分裂 I 拆開同源染色體，入每個子細胞嘅 3 個染色體仍各有兩條姐妹染色單體，即 6 條 DNA 分子。到減數分裂 II 姐妹染色單體分開後，典型產物才係 3 個染色體及 3 條 DNA 分子。唔可以將「DNA 複製一倍」等同「染色體數一倍」。&quot;,&quot;key_en&quot;:&quot;Meiosis I halves homologous sets while sister chromatids remain paired.&quot;,&quot;source_pages&quot;:[19,20,21],&quot;source_note&quot;:&quot;Lecture 7 PDF 19, 20, 21. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-08&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Gene expression and measurement limits&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two cell samples contain the same gene sequence. Its mRNA is detected in both samples at similar levels, but its protein is detected only in sample A. Which conclusion is most defensible?&quot;,&quot;options&quot;:[&quot;The measured difference is at the protein level. Translation, protein breakdown or detection limits could account for it.&quot;,&quot;Sample B could not have transcribed the gene because it had no detectable protein.&quot;,&quot;The gene must be absent from sample B because the protein was not detected.&quot;,&quot;Both samples must have made the same amount of protein because their mRNA levels were similar.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;兩份都有該基因和 mRNA，表示 DNA 在場，亦有轉錄產物。只在 A 量到蛋白質，差異可以出喺轉譯效率、蛋白質分解，或者 B 低過檢測下限。唔夠資料確認邊個機制。選項 B 忽略咗已量到嘅 mRNA；D 將 mRNA 濃度同積存蛋白質濃度當成必然一對一。&quot;,&quot;key_en&quot;:&quot;RNA and protein measurements answer different questions. Treat non-detection as a detection-limit result.&quot;,&quot;source_pages&quot;:[20,22,23],&quot;source_note&quot;:&quot;Lecture 7 PDF 20, 22, 23. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-09&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Tumour genetics versus inherited risk&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A study finds DNA variant V in tumour cells from a participant but does not detect V in adequately sampled non-tumour tissue. The tumour cells grow faster in culture than the other cells. Which conclusion is best supported by these findings alone?&quot;,&quot;options&quot;:[&quot;The participant inherited V, and their children must have it.&quot;,&quot;Fast growth proves V is sufficient by itself to cause all tumours.&quot;,&quot;V cannot relate to cancer because it was not found outside the tumour.&quot;,&quot;The pattern is consistent with an acquired tumour-associated variant. The growth comparison does not isolate its causal role.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;V 喺腫瘤樣本見到，但喺非腫瘤組織未見，符合後天體細胞變化呢個解釋。腫瘤同其他細胞仲可能有好多差異，單靠生長較快未能證明 V 單獨致病，亦唔能夠由腫瘤結果推子女必然遺傳。C 倒轉咗，後天變化仍可與癌症有關。&quot;,&quot;key_en&quot;:&quot;A tumour-associated DNA change does not on its own establish inheritance or isolate causation.&quot;,&quot;source_pages&quot;:[39,40,41,49],&quot;source_note&quot;:&quot;Lecture 7 PDF 39, 40, 41, 49. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H7-10&quot;,&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Genetic risk evidence and reproductive autonomy&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An observational study reports a higher rate of a condition among carriers of a variant, but most carriers remain unaffected. Officials propose mandatory restrictions on their reproduction to avoid future harm. Which response best addresses both the evidence and the proposal?&quot;,&quot;options&quot;:[&quot;Treat carrier status as a diagnosis, since a risk difference has already been observed.&quot;,&quot;Explain uncertainty and investigate how well the result applies. Evaluate consent, rights and discrimination separately, including voluntary options.&quot;,&quot;Treat the condition as entirely environmental, since some carriers remain unaffected.&quot;,&quot;Use the association to set a universal threshold, since statistical evidence itself settles whether coercion is fair.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;較高風險可以係關聯，但唔係診斷或者個人命運。仍然要問研究點做、有冇其他因素、對其他人適唔適用。是否限制生育係另一層倫理決定，要講自主、知情同意、歧視，以及較少強制嘅可行選擇。C 將「並非必然」誤成「完全無基因作用」；D 由實證直接跳到價值判斷。&quot;,&quot;key_en&quot;:&quot;Separate risk estimation from the ethical case for restricting a person&#x27;s choices.&quot;,&quot;source_pages&quot;:[12,38,39,49],&quot;source_note&quot;:&quot;Lecture 7 PDF 12, 38, 39, 49. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-01&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Orbital and escape speed at a different radius&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Ignore atmosphere and Earth&#x27;s rotation. Near the surface (distance R from Earth&#x27;s centre), an ideal circular orbit requires about 8.0 km/s. A spacecraft is instead at radius 4R. Circular speed is proportional to 1/√r and local escape speed is √2 times local circular speed. Which pair is closest for circular speed and escape speed at 4R, respectively?&quot;,&quot;options&quot;:[&quot;2.0 km/s and 2.8 km/s&quot;,&quot;4.0 km/s and 5.7 km/s&quot;,&quot;4.0 km/s and 11.3 km/s&quot;,&quot;8.0 km/s and 5.7 km/s&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;半徑從 R 變 4R，圓軌速度除 √4，即 8÷2 = 4.0 km/s。同一位置嘅逃逸速度再乘 √2 × 4 ≈ 5.7 km/s。A 以為速度直接除半徑比例 4；C 將地面數值 11.3 套去高軌；D 切換咗逃逸速度嘅半徑，卻冇切換圓軌速度嘅半徑。&quot;,&quot;key_en&quot;:&quot;Both speeds are local to the same radius and scale as one over the square root of radius.&quot;,&quot;source_pages&quot;:[14,15,16],&quot;source_note&quot;:&quot;Lecture 8 PDF 14, 15, 16. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-02&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;GPS common receiver timing bias&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;At the same instant, two idealised satellite signals have true travel times of 0.070000 s and 0.080000 s. A receiver adds 2 microseconds to each measured time. Using c = 300,000 km/s and ignoring other errors, what happens to each estimated path length and to the difference between them?&quot;,&quot;options&quot;:[&quot;Each is 0.60 km too long. The difference is 3,000 km and unchanged.&quot;,&quot;Each is 0.60 km too long. The difference increases by 1.20 km.&quot;,&quot;One is 0.60 km too short and one 0.60 km too long. The difference increases by 1.20 km.&quot;,&quot;Each is 600 km too long. The difference is 3,000 km and unchanged.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;兩個訊號都有同一時鐘偏差，2 μs = 0.000002 s，各路程虛增 3×10⁵ × 2×10⁻⁶ = 0.60 km。相減時相同偏差抵消，差仍係 0.010000 × 300,000 = 3,000 km。B 將偏差相加而非相減；D 將 μs 轉換錯 1,000 倍。&quot;,&quot;key_en&quot;:&quot;A common additive bias shifts both absolute ranges and cancels from their difference.&quot;,&quot;source_pages&quot;:[26,27],&quot;source_note&quot;:&quot;Lecture 8 PDF 26, 27. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-03&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Orbit and thrust after free fall&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a circularly orbiting capsule, a freely floating tool initially stays beside a floor mark. The capsule then briefly fires thrusters so the floor accelerates towards the tool, with negligible air drag. Why can the tool strike the floor even though gravity continues to act on both?&quot;,&quot;options&quot;:[&quot;Gravity switches back on as soon as the thrusters fire.&quot;,&quot;Firing thrusters gives the tool the same acceleration through the air as the cabin, so the floor cannot approach it.&quot;,&quot;Before firing, both shared orbital free fall. During firing, the capsule receives an extra non-gravitational acceleration that the free tool does not share.&quot;,&quot;The capsule&#x27;s mass increases enough during firing to make its internal gravity dominate Earth&#x27;s gravity.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;原本工具同艙一起繞地球自由落體，地球引力一直存在；佢哋相對位置近乎不變。推進器直接改變艙嘅運動，未接觸嘅工具冇同樣額外推力，所以地板可以追上工具。A 誤以為太空浮起係引力關閉；C 就正確交代咗地板同工具加速度點解唔同。&quot;,&quot;key_en&quot;:&quot;Apparent weight can change when the cabin accelerates relative to an initially free-falling object.&quot;,&quot;source_pages&quot;:[14,16,30,31],&quot;source_note&quot;:&quot;Lecture 8 PDF 14, 16, 30, 31. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-04&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Geostationary relay versus high-latitude coverage&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Agency A needs a satellite relay that a fixed ground dish can point at throughout the day. Agency B needs repeated detailed imaging near 80° north. Which orbital pairing best addresses those different requirements?&quot;,&quot;options&quot;:[&quot;A: any orbit lasting one sidereal day. B: one geostationary relay over the equator.&quot;,&quot;A: one near-polar low orbit. B: one geostationary relay over the equator.&quot;,&quot;A: a low equatorial orbit. B: any high circular orbit, regardless of inclination.&quot;,&quot;A: a visible geostationary relay. B: a suitable near-polar imaging orbit, with revisit capability checked.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;固定碟要衛星喺天空近似定點，揀可見嘅 geostationary：赤道、圓形、同地球自轉同方向同周期。一日周期本身只等於同步，斜軌仍然會郁。高緯度重複詳細成像通常要合適近極軌道，同時睇實際覆蓋、影像分辨率及重訪時間。&quot;,&quot;key_en&quot;:&quot;Stationary geometry solves constant pointing. Inclination and revisit time are decisive for high-latitude imaging.&quot;,&quot;source_pages&quot;:[23,24,25,26],&quot;source_note&quot;:&quot;Lecture 8 PDF 23, 24, 25, 26. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-05&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;ISS oxygen and carbon dioxide&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two compartments have normal oxygen readings. In compartment A, carbon dioxide rises steadily while occupancy is unchanged, and in compartment B carbon dioxide stays stable. Which is the strongest immediate inference from these observations?&quot;,&quot;options&quot;:[&quot;Normal oxygen shows the air is safe in both compartments.&quot;,&quot;Oxygen supply and carbon dioxide removal are separate functions. Check the sensor, airflow and removal system before inferring a specific fault.&quot;,&quot;The oxygen generator in A must have failed, even though the oxygen reading is normal.&quot;,&quot;Microgravity prevents carbon dioxide from being removed, so the reading for B must be wrong.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;正常 O₂ 唔代表 CO₂ 都正常。ISS 維生要供氧，亦要另行移除乘員呼出嘅 CO₂。A 呈上升要檢查感測、通風混合或除碳能力，未可以只靠趨勢肯定係某部機壞。B 有穩定數值，亦顯示「微重力必然無法除碳」唔係題目支持嘅結論。&quot;,&quot;key_en&quot;:&quot;Track gas supply and removal independently, and distinguish a measured trend from its cause.&quot;,&quot;source_pages&quot;:[30,31],&quot;source_note&quot;:&quot;Lecture 8 PDF 30, 31. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-06&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Mission table and overlapping station stays&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A simplified mission table lists days on a continuous timeline. Crew A launches on day 1, docks on day 3, departs the station on day 103 and lands on day 105. Crew B launches on day 98, docks on day 100, departs on day 190 and lands on day 193. How long are both crews on the station simultaneously, and how long is Crew A&#x27;s full flight?&quot;,&quot;options&quot;:[&quot;5 days and 100 days&quot;,&quot;7 days and 104 days&quot;,&quot;3 days and 104 days&quot;,&quot;3 days and 100 days&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;留站時間用對接至離站，兩組重疊係 Crew B 到站第 100 日到 Crew A 離站第 103 日，相差 3 日。全程飛行用發射至落地，Crew A 係 105 − 1 = 104 日。100 日係 Crew A 留站，唔係全程；將 B 發射當到站會將重疊高估。&quot;,&quot;key_en&quot;:&quot;Intersect the docking-to-departure intervals and separately subtract launch from landing.&quot;,&quot;source_pages&quot;:[32,33,34],&quot;source_note&quot;:&quot;Lecture 8 PDF 32, 33, 34. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-07&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Debris collision energy and population risk&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Relative to object A, debris fragment B has one quarter the mass but three times the relative collision speed. Use kinetic energy E = 1/2 mv² as a simplified impact-energy indicator. Which comparison is valid?&quot;,&quot;options&quot;:[&quot;B has 2.25 times A&#x27;s kinetic energy in this model. Actual mission risk also depends on encounter probability and vulnerable components.&quot;,&quot;B has 0.75 times A&#x27;s kinetic energy because relative speed is multiplied once.&quot;,&quot;B has nine times A&#x27;s kinetic energy because relative speed is the only relevant variable.&quot;,&quot;B has 2.25 times A&#x27;s kinetic energy, so it must be 2.25 times as likely to collide.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;能量比 = (¼) × 3² = 9/4 = 2.25。相對速度要平方，質量比例亦要計。碰撞後大概可造成幾大能量同撞到嘅機率係兩樣嘢；軌道路徑、高度、碎片數量、航天器防護都影響風險。&quot;,&quot;key_en&quot;:&quot;Impact energy combines mass and squared speed. Collision exposure is a separate quantity.&quot;,&quot;source_pages&quot;:[22,36],&quot;source_note&quot;:&quot;Lecture 8 PDF 22, 36. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-08&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Mars samples and contamination control&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An orbiter maps a Martian mineral associated with past water. A rover finds similar mineral at three exposed sites, and a returned sample yields a chemical signal also detectable in a blank container carried through the same handling process. What is the best next inference?&quot;,&quot;options&quot;:[&quot;Agreement about the mineral establishes that the returned chemical signal was produced by Martian organisms.&quot;,&quot;The blank invalidates all orbiter and rover evidence for past water.&quot;,&quot;Any chemical signal from the sample is proof of life once the mineral map has been replicated.&quot;,&quot;The independent mineral observations support choosing sites to investigate past environments. The chemical signal needs comparison against handling contamination and non-biological sources.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;軌道器同探測車結果支持有水歷史嘅研究方向。樣本同空白容器都有化學訊號，污染或處理過程嘅來源就未排除；即使確定訊號來自火星，也要對比非生命來源。B 把樣本測試嘅限制延伸到一個獨立礦物觀察，A/C 將「與過往水相關」跳到有生命。&quot;,&quot;key_en&quot;:&quot;Keep site evidence, possible contamination and the origin of a chemical signal as separate claims.&quot;,&quot;source_pages&quot;:[38,43,44,46],&quot;source_note&quot;:&quot;Lecture 8 PDF 38, 43, 44, 46. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-09&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Stellar flux and habitability&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A star emits one quarter of the Sun&#x27;s luminosity. An exoplanet orbits it at 0.50 times Earth&#x27;s distance from the Sun. Assume incoming flux is proportional to luminosity divided by distance squared. What can this comparison establish?&quot;,&quot;options&quot;:[&quot;It receives one quarter of Earth&#x27;s flux, which rules out surface liquid water.&quot;,&quot;It receives about the same flux as Earth under the stated model. Atmospheric conditions and other evidence are still needed to assess habitability.&quot;,&quot;It receives about the same flux as Earth, so it must have a water ocean and life.&quot;,&quot;It receives twice Earth&#x27;s flux, which fixes its surface temperature without atmospheric data.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;通量比例 = 0.25 ÷ 0.50² = 1，所以同地球收到相近輻射能，但只建立入射能量呢一個比較。大氣、反照率、壓力等影響地表環境。地表能否有液態水亦唔係已經有水或生命嘅證明。A 忘咗距離較近；C 把一項相似當足夠證據。&quot;,&quot;key_en&quot;:&quot;Equal stellar flux does not by itself determine surface water, atmospheric conditions or life.&quot;,&quot;source_pages&quot;:[50,51,53],&quot;source_note&quot;:&quot;Lecture 8 PDF 50, 51, 53. New transfer exercise.&quot;},{&quot;id&quot;:&quot;H8-10&quot;,&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Mission staging and opportunity cost&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A programme&#x27;s first objective is to learn whether a new crewed habitat can operate reliably, detect failures early and permit emergency return. A later objective is to examine two Martian sites for traces of ancient water. With a limited budget, which plan best fits these objectives?&quot;,&quot;options&quot;:[&quot;Begin with a crewed Mars landing because doing both objectives on one mission proves lower total risk.&quot;,&quot;Use only a lunar test and count its results as direct measurements of the Martian sites.&quot;,&quot;Test habitat reliability with a closer staged mission and use suitable Mars robotic measurements for the sites. Assess which risks and results transfer before committing to a crewed Mars flight.&quot;,&quot;Send a Mars orbiter and count successful mineral mapping as a full test of long-duration crew life support.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;兩個目標要分開配工具。近地或月球分階段測維生可檢查維修同緊急返回，降低第一次就去火星嘅壓力。火星就用適合嘅無人探測去研究指定地點。近處成功有價值，但仍要補火星長時間飛行、資源、輻射或救援嘅差別。A 把合併目標等同低風險；D 冇量到載人維生。&quot;,&quot;key_en&quot;:&quot;Match each method to the evidence the objective requires and test whether pilot results transfer.&quot;,&quot;source_pages&quot;:[36,37,44,46,48,49],&quot;source_note&quot;:&quot;Lecture 8 PDF 36, 37, 44, 46, 48, 49. New transfer exercise.&quot;}];

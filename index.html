ed lack of difference has a limited evidential scope.&quot;,&quot;source_pages&quot;:[15,18,19],&quot;source_note&quot;:&quot;Moodle healing effects of crystal.docx; Lecture 3 PDF 15, 18–19&quot;,&quot;id&quot;:&quot;L3-003&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Crystal-case arithmetic&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In the crystal reading, 6 of 80 volunteers reported none of the listed sensations. What percentage reported at least one sensation?&quot;,&quot;options&quot;:[&quot;74%&quot;,&quot;80%&quot;,&quot;7.5%&quot;,&quot;92.5%&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;有感覺者為80−6＝74人，74÷80×100＝92.5%。這是至少一種主觀感受的比例，不是疾病治癒率，亦不能由總數推出每一材料組的個別結果。&quot;,&quot;key_en&quot;:&quot;A sensation-reporting percentage is not a clinical cure rate.&quot;,&quot;source_pages&quot;:[15,18,19],&quot;source_note&quot;:&quot;Moodle healing effects of crystal.docx; arithmetic derived from 80 and 6&quot;,&quot;id&quot;:&quot;L3-004&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Belief and causation&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;The reading reports that prior believers were twice as likely as sceptics to report a sensation. What follows?&quot;,&quot;options&quot;:[&quot;Randomly assigning beliefs has been documented&quot;,&quot;The finding proves a quartz-specific energy mechanism&quot;,&quot;Believers and sceptics must each contain exactly 40 participants&quot;,&quot;The association alone does not prove that belief caused the response&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;既有信念與反應有關聯，不等於信念在研究中被隨機操弄，也不單獨證明因果。各40是材料組的推算，文中沒有提供相信者與懷疑者的人數。&quot;,&quot;key_en&quot;:&quot;Pre-existing belief associations are not automatically causal evidence.&quot;,&quot;source_pages&quot;:[15,19],&quot;source_note&quot;:&quot;Moodle healing effects of crystal.docx; Lecture 3 PDF 15, 19&quot;,&quot;id&quot;:&quot;L3-005&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Occam conditions&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two explanations fit the relevant evidence and make the same predictions. Under Occam’s razor, which is preferable other things being equal?&quot;,&quot;options&quot;:[&quot;The explanation requiring fewer unnecessary assumptions&quot;,&quot;The explanation with the shortest sentence regardless of its assumptions&quot;,&quot;The explanation preferred by the largest audience&quot;,&quot;The explanation involving the most surprising invisible agents&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;在證據與預測相當等條件下，剃刀偏好較少不必要假設的解釋。簡單性不是字數、驚奇程度或流行度，亦不能由此宣稱較簡單者已必然證實。&quot;,&quot;key_en&quot;:&quot;Compare unnecessary assumptions when evidential performance is comparable.&quot;,&quot;source_pages&quot;:[21,22,23],&quot;source_note&quot;:&quot;Lecture 3 PDF 21, 22, 23&quot;,&quot;id&quot;:&quot;L3-006&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;False versus pseudoscientific&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A testable hypothesis fails a fair experiment and its author revises it. Which statement is best?&quot;,&quot;options&quot;:[&quot;Scientific hypotheses are never allowed to be wrong&quot;,&quot;Revision proves that testing was unnecessary&quot;,&quot;A false hypothesis can still be part of scientific inquiry&quot;,&quot;Failure automatically makes the whole activity pseudoscience&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;假設可以被檢驗後不獲支持，研究者按結果修訂仍屬科學探究。偽科學問題在於以科學面貌呈現卻迴避適當檢查，不能只用最後是否猜對作分界。&quot;,&quot;key_en&quot;:&quot;A hypothesis can be wrong without the inquiry being pseudoscientific.&quot;,&quot;source_pages&quot;:[2,17],&quot;source_note&quot;:&quot;Lecture 3 PDF 2, 17&quot;,&quot;id&quot;:&quot;L3-007&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Cherry picking&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A company advertises ten positive testimonials while concealing all contrary test results. Which warning sign is most directly illustrated?&quot;,&quot;options&quot;:[&quot;Cherry picking&quot;,&quot;Complete evidence reporting&quot;,&quot;Replication&quot;,&quot;Open criticism&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;只挑支持主張的資料並隱藏反面證據，是cherry picking。科學評估需要看完整相關證據；有幾個正面故事並不能消除其餘資料或代替公平比較。&quot;,&quot;key_en&quot;:&quot;Selective reporting can distort the apparent support for a claim.&quot;,&quot;source_pages&quot;:[5,17],&quot;source_note&quot;:&quot;Lecture 3 PDF 5, 17&quot;,&quot;id&quot;:&quot;L3-008&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Energy accounting&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A device runs without burning fuel. Which question is most important before accepting a claim that it produces energy from nothing?&quot;,&quot;options&quot;:[&quot;Does a sales video contain dramatic music?&quot;,&quot;Are all energy inputs, outputs and stored sources accounted for?&quot;,&quot;Has any person offered to sell it?&quot;,&quot;Is its name written in a scientific font?&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;不燃燒燃料不等於沒有能量輸入，裝置可能利用光、風、電池或儲存能量。應檢查完整系統與量度；宣傳外觀、有人出售或看不到輸入都不是無中生有的證明。&quot;,&quot;key_en&quot;:&quot;Fuel-less is not the same as input-free.&quot;,&quot;source_pages&quot;:[8,9,11],&quot;source_note&quot;:&quot;Lecture 3 PDF 8, 9, 11&quot;,&quot;id&quot;:&quot;L3-009&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Vitamin O claims&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An advertisement uses the words natural and healthy, precise dosing instructions and customer stories. What is still needed to assess its claimed health effects scientifically?&quot;,&quot;options&quot;:[&quot;Appropriate evidence testing the specific claim&quot;,&quot;A guarantee that natural means effective&quot;,&quot;A more expensive label&quot;,&quot;A vote by people who liked the advertisement&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;天然形象、精確格式及用家見證都不能代替針對功效的檢驗。要分開成分、宣稱機制與結果，不能因名稱或滴數很具體，就認為健康效果已獲證實。&quot;,&quot;key_en&quot;:&quot;Scientific-looking presentation is not a substitute for efficacy evidence.&quot;,&quot;source_pages&quot;:[5,6],&quot;source_note&quot;:&quot;Lecture 3 PDF 5, 6&quot;,&quot;id&quot;:&quot;L3-010&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Unreported methods&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which description goes beyond what the supplied crystal reading actually documents?&quot;,&quot;options&quot;:[&quot;Volunteers handled real or imitation objects&quot;,&quot;Participants received positive suggestions&quot;,&quot;Some participants reported none of the listed sensations&quot;,&quot;The study definitely used randomized allocation and full double blinding&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;原閱讀沒有清楚交代隨機分配及完整雙盲程序。假物組以為拿真水晶不足以建立所有盲法；應把已述事實、未交代細節及可建議的改良分開。&quot;,&quot;key_en&quot;:&quot;Do not invent study methods omitted from the description.&quot;,&quot;source_pages&quot;:[15,19],&quot;source_note&quot;:&quot;Moodle healing effects of crystal.docx; supplementary scientific-method analysis&quot;,&quot;id&quot;:&quot;L3-011&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Positive versus negative expectations&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Does the crystal reading by itself demonstrate a nocebo condition?&quot;,&quot;options&quot;:[&quot;Yes, because any self-report must represent harm&quot;,&quot;No; the described suggestions are positive and no negative-expectation condition is specified&quot;,&quot;Yes, because prior believers existed&quot;,&quot;Yes, because every fake object necessarily produces nocebo&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;教材描述正面提示，沒有安排負面期待條件，因此不能當作已示範nocebo。假物、主觀報告或心理因素本身都不是反安慰劑的定義，要看期待方向及結果。&quot;,&quot;key_en&quot;:&quot;An imitation-object condition is not automatically a nocebo condition.&quot;,&quot;source_pages&quot;:[18,19,20],&quot;source_note&quot;:&quot;Moodle healing effects of crystal.docx; Lecture 3 PDF 18–20&quot;,&quot;id&quot;:&quot;L3-012&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Commercial existence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A seller argues that an energy device must work because it is sold commercially. What is the best response?&quot;,&quot;options&quot;:[&quot;Every commercial device is fraudulent&quot;,&quot;Advertising removes the need to measure energy&quot;,&quot;Lack of adoption by another company alone proves the device impossible&quot;,&quot;Commercial availability is not a substitute for testing the claimed performance&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;有商品出售不等於宣稱已通過科學檢驗；同樣地，別家公司未採用也不是單獨的最終證明。應追問量度、能源來源及重做結果，避免以市場現象取代證據。&quot;,&quot;key_en&quot;:&quot;A product’s presence on the market does not establish its claimed mechanism.&quot;,&quot;source_pages&quot;:[9,10],&quot;source_note&quot;:&quot;Lecture 3 PDF 9, 10&quot;,&quot;id&quot;:&quot;L3-013&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Plant electricity&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Why is electricity obtained through a traceable photosynthesis-related pathway different from a claim of energy appearing from nothing?&quot;,&quot;options&quot;:[&quot;Any green-coloured device must be correct&quot;,&quot;The proposed pathway identifies an energy source and conversion process&quot;,&quot;Plants make measurements unnecessary&quot;,&quot;Photosynthesis is merely another word for perpetual motion&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;可追查的能源及轉換路徑，與聲稱完全沒有來源是不同命題。仍要量度實際效能，不能因植物或綠色標籤就保證所有商業主張，但也不能把兩種說法混同。&quot;,&quot;key_en&quot;:&quot;Assess the source and transformation of energy, not just the device’s label.&quot;,&quot;source_pages&quot;:[8,12],&quot;source_note&quot;:&quot;Lecture 3 PDF 8, 12&quot;,&quot;id&quot;:&quot;L3-014&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Astrology versus observation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which approach most closely matches the astrology example discussed in the lecture?&quot;,&quot;options&quot;:[&quot;Testing a material with a defined comparison group&quot;,&quot;Recording the position of a planet through a telescope&quot;,&quot;Measuring an animal’s observable response under specified conditions&quot;,&quot;Using birth time and planetary positions to forecast an individual’s career without adequate fair testing&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;占星例子把出生時間與天體位置連到個人命運主張。觀測天體或動物行為本身並不是占星或心靈傳訊；分類要看具體主張與測試，而非只看名詞相似。&quot;,&quot;key_en&quot;:&quot;Distinguish an empirical observation from an unsupported personal-fate claim.&quot;,&quot;source_pages&quot;:[13,14],&quot;source_note&quot;:&quot;Lecture 3 PDF 13, 14&quot;,&quot;id&quot;:&quot;L3-015&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Water-memory images&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A promoter shows selected beautiful water-crystal photographs as proof of a memory mechanism. Which information is most needed?&quot;,&quot;options&quot;:[&quot;Whether the claim contains the word energy&quot;,&quot;Whether the promoter likes the proposed explanation&quot;,&quot;How samples, image selection, measurement and comparison were controlled&quot;,&quot;Whether the photographs look attractive&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;漂亮影像未交代樣本與選圖方式，也不自動建立水記憶機制。需要公平比較、量度及遮蔽等資訊；視覺吸引力或科學字眼不能取代研究設計與證據。&quot;,&quot;key_en&quot;:&quot;Images require an appropriate method and comparison before supporting a mechanism.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 3 PDF 7&quot;,&quot;id&quot;:&quot;L3-016&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Diagnostic warning signs&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An early study has not yet undergone peer review. Which assessment is most careful?&quot;,&quot;options&quot;:[&quot;That fact alone is insufficient to classify it as pseudoscience; assess its methods and openness to checking&quot;,&quot;It no longer needs replication once posted online&quot;,&quot;Every unpublished study is automatically pseudoscience&quot;,&quot;It must be correct because nobody has criticised it&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;缺乏同行評議是一項需留意的背景，但不能單憑此點就判為偽科學。應整體檢查方法、證據、修訂及重做態度，並避免反過來把未受批評當成正確證明。&quot;,&quot;key_en&quot;:&quot;Use warning signs as part of an evidence-based assessment, not a single-label shortcut.&quot;,&quot;source_pages&quot;:[17],&quot;source_note&quot;:&quot;Lecture 3 PDF 17&quot;,&quot;id&quot;:&quot;L3-017&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Responding to criticism&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A group responds to every methodological criticism by claiming all critics are conspiring against it. Which response would better fit scientific inquiry?&quot;,&quot;options&quot;:[&quot;Treat disagreement as proof of a discovery&quot;,&quot;Refuse to disclose any methods&quot;,&quot;Address the specific criticism with evidence and allow independent checking&quot;,&quot;Count attacks on critics as additional data&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;科學回應應針對方法或證據問題，容許獨立檢查，而不是把所有批評都變成陰謀。這不表示任何批評必定合理，但需用理由逐項處理，不能用身份攻擊代替。&quot;,&quot;key_en&quot;:&quot;Engage with substantive criticism rather than using it as automatic confirmation.&quot;,&quot;source_pages&quot;:[17],&quot;source_note&quot;:&quot;Lecture 3 PDF 17&quot;,&quot;id&quot;:&quot;L3-018&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Visual resemblance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An ancient symbol resembles a modern bomb. Which conclusion is justified by resemblance alone?&quot;,&quot;options&quot;:[&quot;Ancient people certainly possessed modern bombs&quot;,&quot;An extraterrestrial source is proven&quot;,&quot;The resemblance is a starting observation requiring historical context and independent evidence&quot;,&quot;The symbol must have been created after modern photography&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;外形相似可以引出問題，但未證明年代、用途或製作者具備現代技術。應查原物脈絡及獨立證據，不能由一幅圈圖直接跳到炸彈或外星介入的結論。&quot;,&quot;key_en&quot;:&quot;Visual similarity alone does not establish historical identity or causation.&quot;,&quot;source_pages&quot;:[25],&quot;source_note&quot;:&quot;Lecture 3 PDF 25&quot;,&quot;id&quot;:&quot;L3-019&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Evidence and simplicity&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A simpler explanation conflicts with strong relevant evidence, while a more complex one fits it. What should an investigator do?&quot;,&quot;options&quot;:[&quot;Reject all explanations because they differ in complexity&quot;,&quot;Treat sentence length as the only criterion&quot;,&quot;Choose the simpler account because Occam always overrides evidence&quot;,&quot;Assess evidential fit rather than mechanically applying simplicity&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;剃刀不能凌駕證據，亦不是最簡單故事永遠正確的保證。應先評估解釋是否符合相關資料；相同預測及其他條件相近時，較少不必要假設才有比較意義。&quot;,&quot;key_en&quot;:&quot;Occam’s razor does not license ignoring conflicting evidence.&quot;,&quot;source_pages&quot;:[21,23,24],&quot;source_note&quot;:&quot;Lecture 3 PDF 21, 23, 24&quot;,&quot;id&quot;:&quot;L3-020&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Can and should&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A technology can technically alter an organism. Which further question is ethical rather than merely a feasibility question?&quot;,&quot;options&quot;:[&quot;Whether using it is justified given the affected parties, reasons and risks&quot;,&quot;Whether the equipment can perform the physical operation&quot;,&quot;Whether the proposed chemical step can occur&quot;,&quot;Whether the instrument has enough electrical power&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;技術上能做到can，不會自動回答應否做should。倫理評估須考慮受影響者、理由、風險及限制；可行性資料仍重要但不完整。&quot;,&quot;key_en&quot;:&quot;Technical feasibility does not by itself establish ethical justification.&quot;,&quot;source_pages&quot;:[29,30],&quot;source_note&quot;:&quot;Lecture 3 PDF 29, 30&quot;,&quot;id&quot;:&quot;L3-021&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Voting and justification&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A class majority votes to approve a controversial experiment. What follows from the vote alone?&quot;,&quot;options&quot;:[&quot;Every minority concern has been disproved.&quot;,&quot;It records the class’s expressed preference, not proof that the experiment is ethically justified.&quot;,&quot;All relevant evidence and rights have already been considered.&quot;,&quot;The experiment is automatically scientifically valid.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;投票反映立場分布，不能代替證據、權利及理由分析。多數支持不是科學或倫理上的證明，反方仍可有重要論據。&quot;,&quot;key_en&quot;:&quot;A vote records preferences rather than settling an ethical argument.&quot;,&quot;source_pages&quot;:[31,32],&quot;source_note&quot;:&quot;Lecture 3 PDF 31, 32&quot;,&quot;id&quot;:&quot;L3-022&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Ethical dilemma&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A monk values honesty but is asked by an armed pursuer about a person hiding from danger. What most clearly makes this an ethical dilemma?&quot;,&quot;options&quot;:[&quot;The existence of a dilemma proves that any response is equally good.&quot;,&quot;The monk has no relevant obligations at all.&quot;,&quot;A commitment to truthfulness may conflict with protecting a person from serious harm.&quot;,&quot;Only a factual calculation of distance is involved.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;情境同時牽涉誠實與保護生命等責任，形成需要論證的衝突。辨認dilemma不等於放棄判斷或說所有答案一樣好。&quot;,&quot;key_en&quot;:&quot;An ethical dilemma involves competing morally significant considerations.&quot;,&quot;source_pages&quot;:[34],&quot;source_note&quot;:&quot;Lecture 3 PDF 34&quot;,&quot;id&quot;:&quot;L3-023&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Consequentialist reasoning&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which reason most clearly uses consequentialist reasoning to compare two policies?&quot;,&quot;options&quot;:[&quot;Choose solely because a rule forbids the alternative regardless of its outcomes.&quot;,&quot;Choose the option expected to produce the best relevant balance of benefits and harms.&quot;,&quot;Choose solely because the policy name sounds traditional.&quot;,&quot;Choose without considering any affected party.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;結果論按行動後果比較可行選項。要交代相關效益、傷害、對象及不確定性；不是只以名稱或傳統代替結果評估。&quot;,&quot;key_en&quot;:&quot;Consequentialist arguments assess actions through their relevant outcomes.&quot;,&quot;source_pages&quot;:[44,45],&quot;source_note&quot;:&quot;Lecture 3 PDF 44, 45&quot;,&quot;id&quot;:&quot;L3-024&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Duty and rights&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which reason most clearly appeals to a duty or rights constraint rather than only aggregate benefits?&quot;,&quot;options&quot;:[&quot;Only the investigator’s financial return matters.&quot;,&quot;The procedure wins the largest number of votes, so that alone settles it.&quot;,&quot;People should not be subjected to a research procedure without valid consent merely to increase total benefit.&quot;,&quot;The procedure produces more total gains than losses, so that alone settles it.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;同意與權利可對行動設限制，不單靠總效益決定。這不表示義務論只看好動機；仍要說清責任、權利及可能衝突。&quot;,&quot;key_en&quot;:&quot;A duty-based argument can constrain actions even when benefits are proposed.&quot;,&quot;source_pages&quot;:[46],&quot;source_note&quot;:&quot;Lecture 3 PDF 46&quot;,&quot;id&quot;:&quot;L3-025&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Ethical egoism&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In the lecture’s classification of consequence-focused orientations, which argument most clearly centres ethical egoism?&quot;,&quot;options&quot;:[&quot;Select the option because it best serves the decision-maker’s own interests.&quot;,&quot;Select solely to benefit others despite a personal disadvantage.&quot;,&quot;Select solely to maximize the welfare of everyone affected.&quot;,&quot;Select by an unrelated coin toss without evaluating interests.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;利己取向著重行動者自身利益，與考慮整體福利或以他人利益為重不同。此題辨認理由類型，並非要求贊成該立場。&quot;,&quot;key_en&quot;:&quot;Egoism gives priority to the agent’s own interests.&quot;,&quot;source_pages&quot;:[45],&quot;source_note&quot;:&quot;Lecture 3 PDF 45&quot;,&quot;id&quot;:&quot;L3-026&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Utilitarianism&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which statement best distinguishes a utilitarian assessment from a simple majority vote?&quot;,&quot;options&quot;:[&quot;It treats every majority preference as automatically morally correct.&quot;,&quot;It examines overall welfare, including the magnitude of harms and benefits, rather than counting preferences alone.&quot;,&quot;It considers only benefits to the decision-maker.&quot;,&quot;It ignores anyone in a minority.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;功利分析不只數有幾多人支持，亦要看福利、傷害大小及分配等資料。多數票可能忽略少數人的重大損失，不能直接等同總體最佳結果。&quot;,&quot;key_en&quot;:&quot;Overall welfare is not measured merely by the number of supporters.&quot;,&quot;source_pages&quot;:[45],&quot;source_note&quot;:&quot;Lecture 3 PDF 45&quot;,&quot;id&quot;:&quot;L3-027&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Altruistic orientation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which motive most closely matches the lecture’s altruistic orientation?&quot;,&quot;options&quot;:[&quot;Rejecting all consideration of consequences&quot;,&quot;Considering only one’s own profit&quot;,&quot;Assuming that every selfish choice helps others automatically&quot;,&quot;Giving priority to benefits for others even when this creates a personal disadvantage&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;利他取向以他人利益為主要考慮，可與個人利益不同。這是依理由分類，不表示任何犧牲自己的行動都必定有好後果。&quot;,&quot;key_en&quot;:&quot;Altruistic reasoning centres others’ interests.&quot;,&quot;source_pages&quot;:[45],&quot;source_note&quot;:&quot;Lecture 3 PDF 45&quot;,&quot;id&quot;:&quot;L3-028&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Same decision different reasons&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two people oppose the same study: one predicts more harm than benefit, while the other says it violates a participant’s rights. What is the best interpretation?&quot;,&quot;options&quot;:[&quot;Their reasons cannot be compared or evaluated.&quot;,&quot;They must use exactly the same principle because they agree.&quot;,&quot;The same conclusion can be supported by different ethical frameworks.&quot;,&quot;Only their final yes-or-no answers matter.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;最後立場相同，不代表推理一樣。前者按結果，後者按權利或義務；答題要辨認真正理由，不能只看贊成或反對貼標籤。&quot;,&quot;key_en&quot;:&quot;Identify an ethical framework from the reason, not only the final decision.&quot;,&quot;source_pages&quot;:[44,46],&quot;source_note&quot;:&quot;Lecture 3 PDF 44, 46&quot;,&quot;id&quot;:&quot;L3-029&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Research consent&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A researcher claims a beneficial goal makes it unnecessary to discuss participation with a capable volunteer. Which ethical concern is most direct?&quot;,&quot;options&quot;:[&quot;Whether the study title is short enough&quot;,&quot;The colour of the research equipment&quot;,&quot;Whether every participant has the same favourite subject&quot;,&quot;The volunteer’s autonomy and valid informed consent&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;有益目標不會自動消除參與者自主與有效同意問題。要分開預期利益和研究過程是否尊重受試者，而不是只看目的好不好。&quot;,&quot;key_en&quot;:&quot;A beneficial aim does not automatically replace consent requirements.&quot;,&quot;source_pages&quot;:[40,46],&quot;source_note&quot;:&quot;Lecture 3 PDF 40, 46&quot;,&quot;id&quot;:&quot;L3-030&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Historical and current judgments&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student criticizes the consent arrangements of a historical vaccine experiment and concludes that all present vaccines must be ineffective. What is the main reasoning error?&quot;,&quot;options&quot;:[&quot;Current efficacy automatically justifies every historical procedure.&quot;,&quot;Consent and scientific evidence always mean exactly the same thing.&quot;,&quot;Historical research can never raise ethical questions.&quot;,&quot;Ethical criticism of one historical procedure does not establish the efficacy of every present product.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;歷史實驗的倫理與現代產品效能是不同層次，需各自證據。不能由一項同意安排問題，直接推翻所有後來產品，反過來也不能自動合理化歷史。&quot;,&quot;key_en&quot;:&quot;Assess research ethics and product efficacy using the evidence relevant to each question.&quot;,&quot;source_pages&quot;:[40],&quot;source_note&quot;:&quot;Lecture 3 PDF 40&quot;,&quot;id&quot;:&quot;L3-031&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Robo Roach evaluation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An educational device controls a cockroach’s movement. Which information most strengthens a reasoned ethical evaluation?&quot;,&quot;options&quot;:[&quot;The learning value, animal impacts, necessity and available alternatives&quot;,&quot;Only whether the device is entertaining&quot;,&quot;Only whether some people dislike cockroaches&quot;,&quot;Only whether the packaging uses scientific language&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;RoboRoach案例要求grounds：教育目的、動物受影響及替代方案等。喜惡或娛樂性不是完整論證，合法殺害某動物亦不能單獨決定所有用途。&quot;,&quot;key_en&quot;:&quot;Evaluate purpose, harms, necessity and alternatives rather than emotional labels alone.&quot;,&quot;source_pages&quot;:[35,36],&quot;source_note&quot;:&quot;Lecture 3 PDF 35, 36&quot;,&quot;id&quot;:&quot;L3-032&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Law and ethics&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A company says its practice is ethically justified solely because no law currently prohibits it. What is the best response?&quot;,&quot;options&quot;:[&quot;Anything not prohibited must benefit everyone.&quot;,&quot;The absence of a ban proves the practice has no risks.&quot;,&quot;Legality alone does not complete an ethical justification.&quot;,&quot;Laws and ethical arguments are always identical.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;合法與倫理正當有關但不相同；法律可能只訂部分底線。仍要討論影響、權利、公平及理由，不能由無禁令推出無風險。&quot;,&quot;key_en&quot;:&quot;Legal permission and ethical justification are distinct assessments.&quot;,&quot;source_pages&quot;:[30,47],&quot;source_note&quot;:&quot;Lecture 3 PDF 30, 47&quot;,&quot;id&quot;:&quot;L3-033&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;GM food ethics&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which approach best supports evaluating a specific GM crop ethically?&quot;,&quot;options&quot;:[&quot;Identify the trait and use, examine relevant evidence, and assess benefits, risks and affected parties.&quot;,&quot;Ignore all alternatives because one technology exists.&quot;,&quot;Assume all GM products have identical risks and benefits.&quot;,&quot;Decide only from the words natural or artificial.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;GM不是單一有相同結果的產品。應先界定性狀、用途與證據，再分析效益、風險、選擇權及替代方案，避免只靠天然／人工標籤。&quot;,&quot;key_en&quot;:&quot;Evaluate the particular modification and context rather than the category alone.&quot;,&quot;source_pages&quot;:[38],&quot;source_note&quot;:&quot;Lecture 3 PDF 38&quot;,&quot;id&quot;:&quot;L3-034&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Cloning versus gene editing&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which distinction should be preserved in ethical discussion?&quot;,&quot;options&quot;:[&quot;Producing a genetic copy and deliberately altering a DNA sequence are different technical aims.&quot;,&quot;An ethical debate eliminates the need to define the technology.&quot;,&quot;Cloning and every form of gene editing are exactly the same operation.&quot;,&quot;Any discussion of cloning proves a current human procedure is safe.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;複製與改變DNA序列是不同技術目標。先定義技術才可準確分析風險、同意及用途；不能用同一標籤取代實際方法。&quot;,&quot;key_en&quot;:&quot;Define the technical intervention before evaluating it ethically.&quot;,&quot;source_pages&quot;:[39],&quot;source_note&quot;:&quot;Lecture 3 PDF 39&quot;,&quot;id&quot;:&quot;L3-035&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Heritable intervention&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A proposed genetic intervention could affect future generations. Which issue is especially relevant to its ethical assessment?&quot;,&quot;options&quot;:[&quot;Proof that every genetic intervention has the same risk&quot;,&quot;A guarantee that future people will have identical preferences&quot;,&quot;Long-term and heritable consequences for people who cannot presently participate in the decision&quot;,&quot;Only the attractiveness of the scientist’s presentation&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;可遺傳影響把考慮範圍延伸至未來個體，涉及不確定性、同意與監督。這不等於所有基因介入都相同，仍需界定實際方法及證據。&quot;,&quot;key_en&quot;:&quot;Potentially heritable effects raise intergenerational ethical questions.&quot;,&quot;source_pages&quot;:[39],&quot;source_note&quot;:&quot;Lecture 3 PDF 39&quot;,&quot;id&quot;:&quot;L3-036&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Clarifying terminology&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A discussion prompt asks whether someone should choose a spontaneous abortion. What should be clarified first?&quot;,&quot;options&quot;:[&quot;Which answer has the most supporters before defining the issue&quot;,&quot;Whether the intended topic is spontaneous pregnancy loss or an induced termination, because the terms differ&quot;,&quot;That the two terms necessarily mean the same choice&quot;,&quot;That every genetic difference has an identical outcome&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;spontaneous abortion字面是自然流產，與選擇進行的終止妊娠不同。先釐清題意再論證，不能因講義用詞含糊便建立錯誤前提。&quot;,&quot;key_en&quot;:&quot;Clarify ambiguous terms before applying ethical arguments.&quot;,&quot;source_pages&quot;:[41],&quot;source_note&quot;:&quot;Lecture 3 PDF 41&quot;,&quot;id&quot;:&quot;L3-037&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;End-of-life discussion&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A class discusses whether a particular end-of-life practice should be permitted. Which missing detail most directly affects a careful ethical analysis?&quot;,&quot;options&quot;:[&quot;Whether one dramatic image can settle every case&quot;,&quot;Whether the topic title is printed in capital letters&quot;,&quot;Whether all end-of-life decisions are assumed identical&quot;,&quot;Whether the person’s choice is voluntary and informed, and what the actual practice involves&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;自主、能力、壓力及具體做法會影響分析，不能把不同臨終選擇一概而論。此題是課堂倫理推理，不是判定任何個人做法或現行法律。&quot;,&quot;key_en&quot;:&quot;Ethical analysis requires the relevant facts and distinctions of the specific case.&quot;,&quot;source_pages&quot;:[42],&quot;source_note&quot;:&quot;Lecture 3 PDF 42&quot;,&quot;id&quot;:&quot;L3-038&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Counterarguments&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which response best follows the lecture’s guidance for a strong ethical argument?&quot;,&quot;options&quot;:[&quot;Choose the midpoint of every disagreement automatically.&quot;,&quot;State a reasoned position, identify crucial details, and address a serious counterargument.&quot;,&quot;Repeat personal preference without reasons.&quot;,&quot;Pretend that no opposing argument exists.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;老師要求有理由的立場、關鍵細節及回應反方，而不是只說喜惡。超越黑白亦不等於每次必須取中間，結論可有明確原則和條件。&quot;,&quot;key_en&quot;:&quot;A strong argument engages with evidence, reasons and opposing considerations.&quot;,&quot;source_pages&quot;:[48],&quot;source_note&quot;:&quot;Lecture 3 PDF 48&quot;,&quot;id&quot;:&quot;L3-039&quot;},{&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Codes and instruments&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Why should principles, codes of conduct and legal instruments be distinguished?&quot;,&quot;options&quot;:[&quot;A voluntary code is always identical to a criminal statute.&quot;,&quot;They can have different purposes, audiences and enforcement arrangements.&quot;,&quot;The name of an instrument alone resolves all ethical conflicts.&quot;,&quot;Every principle automatically carries the same legal penalty.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;原則、行為守則與法律工具的對象、用途及執行方式可不同。不能見到一份書面規範，就假設它有相同法律效力或已解決所有爭議。&quot;,&quot;key_en&quot;:&quot;Identify the scope and function of a norm rather than treating all written rules as identical.&quot;,&quot;source_pages&quot;:[47],&quot;source_note&quot;:&quot;Lecture 3 PDF 47&quot;,&quot;id&quot;:&quot;L3-040&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Binary place value&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;What is the decimal value of the binary number 11001?&quot;,&quot;options&quot;:[&quot;24&quot;,&quot;11001&quot;,&quot;19&quot;,&quot;25&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;位值為16、8、4、2、1，故11001代表16+8+1=25。二進制各位用二的冪次，不能把整串直接讀成十進制數字。&quot;,&quot;key_en&quot;:&quot;Add the place values corresponding to the 1 bits.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 4 PDF 7&quot;,&quot;id&quot;:&quot;L4-001&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Decimal to binary&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Which binary number represents decimal 13?&quot;,&quot;options&quot;:[&quot;1001&quot;,&quot;1110&quot;,&quot;1011&quot;,&quot;1101&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;13=8+4+1，所以位元是1101。1011是11；換算時先定義位值，再逐位檢查，不能只記數字外觀。&quot;,&quot;key_en&quot;:&quot;Decimal 13 equals 8 + 4 + 1.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 4 PDF 7&quot;,&quot;id&quot;:&quot;L4-002&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Bit patterns&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A sensor stores each reading using exactly 5 bits. How many different bit patterns are available?&quot;,&quot;options&quot;:[&quot;31&quot;,&quot;32&quot;,&quot;25&quot;,&quot;10&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;五個位元各有兩種狀態，共2⁵=32種組合。31是五位無符號數的最大值，並非組合數；零亦佔一個模式。&quot;,&quot;key_en&quot;:&quot;Five bits provide 2 to the power of 5 distinct patterns.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 4 PDF 7&quot;,&quot;id&quot;:&quot;L4-003&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Unsigned maximum&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;What is the largest unsigned integer that can be represented with 5 bits?&quot;,&quot;options&quot;:[&quot;31&quot;,&quot;32&quot;,&quot;5&quot;,&quot;16&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;11111=16+8+4+2+1=31。五位有32種組合，但數值從0開始，所以最大值為2⁵−1。&quot;,&quot;key_en&quot;:&quot;The maximum unsigned value is one less than the number of patterns.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 4 PDF 7&quot;,&quot;id&quot;:&quot;L4-004&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Encoding capacity&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A code must distinguish 82 symbols using a fixed number of bits per symbol. What is the minimum number of bits required?&quot;,&quot;options&quot;:[&quot;6&quot;,&quot;82&quot;,&quot;7&quot;,&quot;8&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;六位只有64種模式，不足區分82種；七位有128種，已足夠。題目問最低需要幾位，並非一定用完整八位元儲存單位。&quot;,&quot;key_en&quot;:&quot;Choose the smallest n for which 2 to the power of n is at least 82.&quot;,&quot;source_pages&quot;:[7,8],&quot;source_note&quot;:&quot;Lecture 4 PDF 7, 8&quot;,&quot;id&quot;:&quot;L4-005&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;GB and GiB&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A drive contains exactly 100,000,000,000 bytes. Using 1 GiB = 1024³ bytes, approximately how many GiB is this?&quot;,&quot;options&quot;:[&quot;97.66 GiB&quot;,&quot;107.37 GiB&quot;,&quot;100 GiB&quot;,&quot;93.13 GiB&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;把總bytes除以1024³，得到約93.13GiB。十進制100GB與二進制單位的數值不同；不是約七個GB的資料突然消失。&quot;,&quot;key_en&quot;:&quot;Divide the byte count by 1024 cubed to obtain GiB.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 4 PDF 9&quot;,&quot;id&quot;:&quot;L4-006&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Unit conversion levels&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student calculates 100 × 1000 / 1024 and claims this converts 100 decimal GB into GiB. What is the main error?&quot;,&quot;options&quot;:[&quot;The calculation should use eight prefix levels.&quot;,&quot;GB and GiB differ only because of file corruption.&quot;,&quot;The base conversion must account for three prefix levels.&quot;,&quot;The result should always be larger than 100.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;GB到bytes涉及1000³，GiB到bytes涉及1024³，因此比例要取三次方。單乘一次只處理一級，不能產生約93.13的答案。&quot;,&quot;key_en&quot;:&quot;GB-to-GiB conversion uses the ratio (1000/1024) cubed.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 4 PDF 9&quot;,&quot;id&quot;:&quot;L4-007&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Bytes and bits&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Using decimal units, how many bits are in a 2 MB file?&quot;,&quot;options&quot;:[&quot;16,000,000 bits&quot;,&quot;2,000,000 bits&quot;,&quot;2,048 bits&quot;,&quot;250,000 bits&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;題目指定十進制，2MB是2,000,000bytes；每byte有8bits，故共有16,000,000bits。先處理前綴，再處理bytes與bits。&quot;,&quot;key_en&quot;:&quot;One byte contains eight bits.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 4 PDF 9&quot;,&quot;id&quot;:&quot;L4-008&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;AND gate&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A warning is activated only when sensor A AND sensor B both output 1. Which input pair activates it?&quot;,&quot;options&quot;:[&quot;A = 0, B = 0&quot;,&quot;A = 0, B = 1&quot;,&quot;A = 1, B = 0&quot;,&quot;A = 1, B = 1&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;AND要求兩個輸入同時為1才輸出1。只滿足其中一個條件的10或01不夠；這與OR至少一個成立不同。&quot;,&quot;key_en&quot;:&quot;AND outputs 1 only when both inputs are 1.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 4 PDF 20&quot;,&quot;id&quot;:&quot;L4-009&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;OR gate&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An alarm uses an inclusive OR gate. What is its output when both inputs are 1?&quot;,&quot;options&quot;:[&quot;1&quot;,&quot;It alternates between 0 and 1.&quot;,&quot;It cannot accept two 1 inputs.&quot;,&quot;0&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;本課OR是包含式或，至少一個輸入1就輸出1，包括11。把11輸出0的是XOR規則，不能混作普通OR。&quot;,&quot;key_en&quot;:&quot;Inclusive OR remains true when both inputs are true.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 4 PDF 20&quot;,&quot;id&quot;:&quot;L4-010&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Volatile memory&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student edits a document but does not save it. Power suddenly fails. Which explanation best accounts for losing recent changes?&quot;,&quot;options&quot;:[&quot;All SSD storage requires power to retain every saved file.&quot;,&quot;The monitor erased the document.&quot;,&quot;The unsaved changes were held in volatile RAM.&quot;,&quot;The keyboard permanently stored the changes.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;未儲存修改通常仍在運作記憶體RAM，斷電便可能失去。這不等於磁碟上之前已儲存的版本也必然消失。&quot;,&quot;key_en&quot;:&quot;RAM is volatile; saving transfers changes to persistent storage.&quot;,&quot;source_pages&quot;:[5,12],&quot;source_note&quot;:&quot;Lecture 4 PDF 5, 12&quot;,&quot;id&quot;:&quot;L4-011&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Hardware and software&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which pair correctly matches hardware with software?&quot;,&quot;options&quot;:[&quot;A saved program becomes hardware whenever it runs.&quot;,&quot;A keyboard is hardware; a word-processing program is software.&quot;,&quot;A spreadsheet formula is hardware; RAM is software.&quot;,&quot;An operating system is hardware; a screen is software.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;硬件是實體部件；軟件是程式與指令。程式儲存在實體裝置內，不會因此變成硬件，RAM本身仍是硬件。&quot;,&quot;key_en&quot;:&quot;Software consists of programs, while hardware consists of physical components.&quot;,&quot;source_pages&quot;:[5,6],&quot;source_note&quot;:&quot;Lecture 4 PDF 5, 6&quot;,&quot;id&quot;:&quot;L4-012&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Clock cycles&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In a simplified model, a task requires 20 clock cycles and the clock rate is 5 cycles per second. How long does the task take?&quot;,&quot;options&quot;:[&quot;4 seconds&quot;,&quot;0.25 seconds&quot;,&quot;100 seconds&quot;,&quot;25 seconds&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;時間=所需cycles÷每秒cycles，20÷5=4秒。不能把兩者相乘；這只是題目指定的簡化模型，不代表所有指令耗同樣週期。&quot;,&quot;key_en&quot;:&quot;Execution time in this model equals cycles divided by cycles per second.&quot;,&quot;source_pages&quot;:[18],&quot;source_note&quot;:&quot;Lecture 4 PDF 18&quot;,&quot;id&quot;:&quot;L4-013&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;CPU comparisons&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two processors have different architectures. One has a higher GHz rating. What is the most defensible conclusion?&quot;,&quot;options&quot;:[&quot;Both processors must have identical memory capacity.&quot;,&quot;GHz alone is insufficient to determine which is faster for a specified task.&quot;,&quot;The higher-GHz processor must finish every task first.&quot;,&quot;The lower-GHz processor cannot perform arithmetic.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;時脈只是一項指標；架構、每週期工作、核心及任務都影響表現。不同架構不能單靠GHz判定所有工作誰較快。&quot;,&quot;key_en&quot;:&quot;Compare task performance rather than clock rate alone.&quot;,&quot;source_pages&quot;:[18],&quot;source_note&quot;:&quot;Lecture 4 PDF 18&quot;,&quot;id&quot;:&quot;L4-014&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;HDD operation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which feature distinguishes a conventional HDD from an SSD?&quot;,&quot;options&quot;:[&quot;An SSD stores every file inside the CPU registers.&quot;,&quot;An HDD stores data only while power is on.&quot;,&quot;An HDD uses moving read/write heads and rotating magnetic platters.&quot;,&quot;An SSD must rotate faster than an HDD.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;HDD有磁碟片與讀寫頭，存取涉及機械移動；SSD沒有這些轉動部件。兩者都可作持久儲存，不能與RAM的易失性混淆。&quot;,&quot;key_en&quot;:&quot;HDD access includes mechanical movement; SSD access does not use rotating platters.&quot;,&quot;source_pages&quot;:[13,17],&quot;source_note&quot;:&quot;Lecture 4 PDF 13, 17&quot;,&quot;id&quot;:&quot;L4-015&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Choosing storage&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A laptop will be carried frequently and exposed to vibration. Which reason most directly supports choosing an SSD over a conventional HDD?&quot;,&quot;options&quot;:[&quot;An SSD requires no controller or electricity.&quot;,&quot;An SSD has no moving platter-and-head mechanism.&quot;,&quot;An SSD can never fail or lose data.&quot;,&quot;An SSD always has unlimited write endurance.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;沒有轉動部件是流動使用時較耐震的相關理由，但不表示SSD永不故障、無寫入壽命限制或不需要電力。選項的絕對說法是陷阱。&quot;,&quot;key_en&quot;:&quot;Storage suitability depends on the use case and realistic limitations.&quot;,&quot;source_pages&quot;:[17],&quot;source_note&quot;:&quot;Lecture 4 PDF 17&quot;,&quot;id&quot;:&quot;L4-016&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Saving a file&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;After editing a file in RAM, a student clicks Save. Which data movement best describes the relevant operation?&quot;,&quot;options&quot;:[&quot;Persistent storage must be erased before RAM can work.&quot;,&quot;All data are converted into analogue sound.&quot;,&quot;The keyboard copies the entire CPU into the monitor.&quot;,&quot;Changes are written from working memory to persistent storage.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;Save把運作中的修改寫到持久儲存；平時開檔是相反方向讀入RAM。關閉視窗本身不能代替確認已儲存。&quot;,&quot;key_en&quot;:&quot;Saving preserves working changes on a storage device.&quot;,&quot;source_pages&quot;:[12],&quot;source_note&quot;:&quot;Lecture 4 PDF 12&quot;,&quot;id&quot;:&quot;L4-017&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Storage hierarchy&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which set belongs most directly to primary working storage in the lecture hierarchy?&quot;,&quot;options&quot;:[&quot;Cloud subscriptions, passwords and webpages&quot;,&quot;HDD platters, optical discs and magnetic tapes only&quot;,&quot;Printed books, DVDs and USB drives&quot;,&quot;Registers, cache and RAM&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;Registers、cache及RAM較直接支援正在執行的工作。HDD、光碟等主要用於持久或離線儲存，不能只按體積分類。&quot;,&quot;key_en&quot;:&quot;Storage hierarchy distinguishes immediate working access from longer-term storage.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 4 PDF 11&quot;,&quot;id&quot;:&quot;L4-018&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Multitasking&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A single processing resource rapidly alternates between two programs. Which description is most accurate?&quot;,&quot;options&quot;:[&quot;Two programs prove that two physical CPUs are present.&quot;,&quot;The programs must run in genuinely parallel hardware at every instant.&quot;,&quot;The computer has stopped using a clock.&quot;,&quot;Task switching can create the appearance of simultaneous activity.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;快速切換可形成同時運作的觀感，不代表每一瞬間都由不同硬件平行執行。真正平行處理還要看可用資源與任務分配。&quot;,&quot;key_en&quot;:&quot;Concurrency through switching is different from simultaneous parallel execution.&quot;,&quot;source_pages&quot;:[19],&quot;source_note&quot;:&quot;Lecture 4 PDF 19&quot;,&quot;id&quot;:&quot;L4-019&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Input and output&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a voice assistant, which pair correctly identifies an input and an output?&quot;,&quot;options&quot;:[&quot;Stored software as input device; RAM as loudspeaker&quot;,&quot;Battery casing as input; CPU instructions as output only&quot;,&quot;Microphone signal as input; synthesized speech as output&quot;,&quot;Speaker sound as input; microphone recording as output&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;咪高峰收取外界聲音訊號，揚聲器播出合成聲音。應按資料流方向辨認，而不是只按裝置是否接觸使用者。&quot;,&quot;key_en&quot;:&quot;Input acquires information; output presents processed results.&quot;,&quot;source_pages&quot;:[5,23],&quot;source_note&quot;:&quot;Lecture 4 PDF 5, 23&quot;,&quot;id&quot;:&quot;L4-020&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Character encoding&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student says every character in every language must occupy exactly one byte. Which response is best?&quot;,&quot;options&quot;:[&quot;A byte has a different number of bits in every language.&quot;,&quot;All characters must occupy exactly eight bytes.&quot;,&quot;Character size depends on the encoding; one byte per character is not universal.&quot;,&quot;Encoding is unnecessary because bit patterns have natural meanings.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;byte通常是8bits，但一個字元所需bytes取決於編碼。課堂一byte一字元是簡化例子，不能推廣到所有語言與Unicode表示。&quot;,&quot;key_en&quot;:&quot;A byte is a storage unit, not a universal one-character rule.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 4 PDF 8, 9&quot;,&quot;id&quot;:&quot;L4-021&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Physical representation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;What general principle is illustrated by holes in punched cards and magnetic orientations on disks?&quot;,&quot;options&quot;:[&quot;Binary numbers require only magnetic materials.&quot;,&quot;A bit must always be a visible printed digit.&quot;,&quot;Every two-state system is automatically an intelligent agent.&quot;,&quot;Different physical states can represent logical bit values.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;0與1是邏輯符號，可由有孔／無孔、磁方向等可辨狀態表示。表示方法不等於數值本身，更不自動產生人工智能。&quot;,&quot;key_en&quot;:&quot;Binary information can be implemented with different physical state systems.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 4 PDF 10&quot;,&quot;id&quot;:&quot;L4-022&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Half adder&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;For a half adder adding binary 1 and 1 with no carry-in, what are the sum and carry outputs?&quot;,&quot;options&quot;:[&quot;Sum 0, carry 1&quot;,&quot;Sum 0, carry 0&quot;,&quot;Sum 1, carry 1&quot;,&quot;Sum 1, carry 0&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;二進制1+1=10，因此低位sum是0、進位carry是1。這裡問兩個輸出位，不能把十進制2當成單一位元輸出。&quot;,&quot;key_en&quot;:&quot;A half adder represents 1 + 1 using a sum bit and a carry bit.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 4 PDF 21&quot;,&quot;id&quot;:&quot;L4-023&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Internet of Things&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A connected temperature sensor sends readings to a building-control system. Which feature most directly makes this an Internet of Things example?&quot;,&quot;options&quot;:[&quot;The device must generate artistic images.&quot;,&quot;A physical device exchanges data through a network.&quot;,&quot;The sensor must possess human consciousness.&quot;,&quot;Every calculation must be performed without software.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;IoT強調實體裝置的連接與資料交換，不要求人類般意識或生成式AI。連網亦引入安全及私隱等考慮，並非只有便利。&quot;,&quot;key_en&quot;:&quot;IoT connects physical devices and their data with networked services.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 4 PDF 24&quot;,&quot;id&quot;:&quot;L4-024&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Large-scale collaboration&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A volunteer project asks people to donate unused computer processing time. Which resource is primarily contributed?&quot;,&quot;options&quot;:[&quot;Computational capacity&quot;,&quot;A guaranteed scientific discovery&quot;,&quot;Ownership of all their personal files&quot;,&quot;Cash funding only&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;這類分散式計算主要募集運算資源；與群眾募資的金錢、知識型協作的內容不同。參與本身也不保證研究必定成功。&quot;,&quot;key_en&quot;:&quot;Mass collaboration can collect computation, funding or knowledge as distinct resources.&quot;,&quot;source_pages&quot;:[26],&quot;source_note&quot;:&quot;Lecture 4 PDF 26&quot;,&quot;id&quot;:&quot;L4-025&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Simulation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A weather model predicts a storm path. Which interpretation is scientifically appropriate?&quot;,&quot;options&quot;:[&quot;The simulation produces a model-based prediction that should be checked against observations.&quot;,&quot;Disagreement with observations can never challenge the model.&quot;,&quot;A simulated storm is the same physical storm in miniature.&quot;,&quot;Running on a computer makes the prediction certain.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;模擬根據模型與輸入資料重現或預測行為，仍需觀察核對。電腦運算不會把模型假設變成必然正確的自然定律。&quot;,&quot;key_en&quot;:&quot;Simulation outputs depend on models, inputs and validation.&quot;,&quot;source_pages&quot;:[3,23],&quot;source_note&quot;:&quot;Lecture 4 PDF 3, 23&quot;,&quot;id&quot;:&quot;L4-026&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Machine learning&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A spam filter adjusts its predictions after learning patterns from labelled examples. Which feature most clearly illustrates machine learning?&quot;,&quot;options&quot;:[&quot;It contains no software or numerical operations.&quot;,&quot;Its predictive behaviour is learned from data.&quot;,&quot;It is guaranteed to understand every message as a human does.&quot;,&quot;It must be installed in a humanoid body.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;從例子資料學習預測規律是ML的核心描述。它仍依賴程式與運算，也不要求機械人身體或全面人類理解。&quot;,&quot;key_en&quot;:&quot;Learning from data is different from merely having physical hardware.&quot;,&quot;source_pages&quot;:[29],&quot;source_note&quot;:&quot;Lecture 4 PDF 29&quot;,&quot;id&quot;:&quot;L4-027&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;AI and robotics&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which example best shows why AI and robotics are not identical categories?&quot;,&quot;options&quot;:[&quot;A text chatbot can perform an AI task without a physical robot body.&quot;,&quot;All AI systems are mechanical arms.&quot;,&quot;Every robot must possess general human intelligence.&quot;,&quot;A robot cannot use computer software.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;AI可在純軟件環境處理語言；robotics涉及實體裝置與動作。兩者可結合，但不能把所有AI都稱為人形機械人。&quot;,&quot;key_en&quot;:&quot;Artificial intelligence and physical robotics can overlap without being identical.&quot;,&quot;source_pages&quot;:[28,29,33],&quot;source_note&quot;:&quot;Lecture 4 PDF 28, 29, 33&quot;,&quot;id&quot;:&quot;L4-028&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;AlphaGo&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;What does AlphaGo defeating a top human Go player most directly demonstrate?&quot;,&quot;options&quot;:[&quot;That AlphaGo primarily plays chess rather than Go&quot;,&quot;Victory in every possible intellectual task&quot;,&quot;High performance in the specific task of playing Go&quot;,&quot;Proof of human-like consciousness&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;AlphaGo例子屬圍棋Go的特定任務表現。不能由勝棋直接推出意識、全面通用智能或所有工作能力；亦不要把Go寫成國際象棋。&quot;,&quot;key_en&quot;:&quot;Success at a specialized task does not establish general intelligence.&quot;,&quot;source_pages&quot;:[32],&quot;source_note&quot;:&quot;Lecture 4 PDF 32&quot;,&quot;id&quot;:&quot;L4-029&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;AI evaluation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A face-recognition system performs well overall but poorly for one population group. Which next step best addresses the concern?&quot;,&quot;options&quot;:[&quot;Assume every incorrect match proves deliberate deception.&quot;,&quot;Publish a claim that accuracy is identical for everyone.&quot;,&quot;Examine group-specific errors and the data and deployment conditions.&quot;,&quot;Ignore the group because the overall score is high.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;平均分可掩蓋不同群體的錯誤，應檢查分組表現、資料與使用情境。整體高分不能代替公平性、私隱及個別風險評估。&quot;,&quot;key_en&quot;:&quot;Aggregate accuracy can conceal important differences in errors.&quot;,&quot;source_pages&quot;:[31,41],&quot;source_note&quot;:&quot;Lecture 4 PDF 31, 41&quot;,&quot;id&quot;:&quot;L4-030&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Recognition and generation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which task is recognition rather than generation?&quot;,&quot;options&quot;:[&quot;Comparing an incoming face image with stored identities&quot;,&quot;Writing a new poem from a prompt&quot;,&quot;Producing a synthetic landscape picture&quot;,&quot;Creating a new imaginary face image&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;辨識是判斷輸入對應哪個身份或類別；生成是產生新內容。兩者都可能用AI，但目的及評估指標不同。&quot;,&quot;key_en&quot;:&quot;Recognizing an input differs from generating a new output.&quot;,&quot;source_pages&quot;:[30,31],&quot;source_note&quot;:&quot;Lecture 4 PDF 30, 31&quot;,&quot;id&quot;:&quot;L4-031&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Deepfakes and evidence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An apparently realistic video makes a surprising claim about a public event. What is the best initial evidence-based response?&quot;,&quot;options&quot;:[&quot;Assume every online video is fabricated.&quot;,&quot;Treat realistic appearance as proof of authenticity.&quot;,&quot;Check its provenance and corroborating reliable sources.&quot;,&quot;Share it immediately because an AI detector gives no explanation.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;影像逼真不代表真實，應查來源、完整脈絡及獨立證據。全盤否定或單靠一個不透明偵測結果，同樣沒有完成查核。&quot;,&quot;key_en&quot;:&quot;Verify provenance and corroboration rather than appearance alone.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 4 PDF 27&quot;,&quot;id&quot;:&quot;L4-032&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Open source&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A developer finds publicly available open-source code. Which assumption should be avoided?&quot;,&quot;options&quot;:[&quot;That the code can be inspected&quot;,&quot;That public availability automatically removes all licence conditions&quot;,&quot;That copyright and reuse permissions are relevant&quot;,&quot;That licensing terms may need to be checked&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;公開可讀不等於沒有版權或使用條件。應讀實際授權；不能把open source一概理解為任何用途都無條件自由使用。&quot;,&quot;key_en&quot;:&quot;Availability and permission are different questions.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 4 PDF 27&quot;,&quot;id&quot;:&quot;L4-033&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Meaningful oversight&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An operator is shown an automated dangerous decision but has no time or authority to stop it. What is the main oversight problem?&quot;,&quot;options&quot;:[&quot;A human on the screen guarantees meaningful control.&quot;,&quot;Automation removes any need for training.&quot;,&quot;A stop mechanism is irrelevant whenever accuracy is high.&quot;,&quot;Human presence does not provide an effective opportunity to intervene.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;有操作員不等於有實質監督；資訊、反應時間及停止權限都重要。不能只按是否有人坐在控制室判斷安全。&quot;,&quot;key_en&quot;:&quot;Meaningful oversight requires usable information, time and authority.&quot;,&quot;source_pages&quot;:[4,45],&quot;source_note&quot;:&quot;Lecture 4 PDF 4, 45&quot;,&quot;id&quot;:&quot;L4-034&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Work and automation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Software automates routine document review, while a professional still checks exceptions and advises clients. Which statement is best supported?&quot;,&quot;options&quot;:[&quot;Some tasks and the division of labour have changed.&quot;,&quot;No skills or training requirements can change.&quot;,&quot;The entire profession has necessarily disappeared.&quot;,&quot;The example proves a date when every job will end.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;任務自動化與整份職位消失不同。案例顯示工作分工可能改變，不能直接推成所有專業人士失業或確定未來時間表。&quot;,&quot;key_en&quot;:&quot;Task replacement does not necessarily mean whole-job elimination.&quot;,&quot;source_pages&quot;:[43,44],&quot;source_note&quot;:&quot;Lecture 4 PDF 43, 44&quot;,&quot;id&quot;:&quot;L4-035&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Automation cost&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A company compares an industrial robot with human labour. Which cost comparison is most informative?&quot;,&quot;options&quot;:[&quot;Only the robot supplier’s slogan&quot;,&quot;Purchase price alone, ignoring every later cost&quot;,&quot;Total costs, including purchase, maintenance, operation and relevant labour, over a defined period&quot;,&quot;Salary alone, assuming the robot is free to run&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;應在同一期間與任務需求下比較總成本，納入維修、運作等。高初置費與持續人工支出不能用單一價目直接判定勝負。&quot;,&quot;key_en&quot;:&quot;Evaluate total costs for a specified use and time period.&quot;,&quot;source_pages&quot;:[42],&quot;source_note&quot;:&quot;Lecture 4 PDF 42&quot;,&quot;id&quot;:&quot;L4-036&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Historical rankings&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A lecture slide shows an old supercomputer ranking. How should it be used?&quot;,&quot;options&quot;:[&quot;As a timeless law about computer performance&quot;,&quot;As proof that a country leads every form of intelligence&quot;,&quot;As guaranteed evidence of the current world leader&quot;,&quot;As a historical comparison with a stated benchmark and date&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;排行榜依賴年份與benchmark；舊圖不能直接答今天排名。特定運算指標亦不等於全面智能或所有科技能力。&quot;,&quot;key_en&quot;:&quot;Rankings are benchmark- and date-dependent evidence.&quot;,&quot;source_pages&quot;:[36],&quot;source_note&quot;:&quot;Lecture 4 PDF 36&quot;,&quot;id&quot;:&quot;L4-037&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Consciousness claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A chatbot produces convincing emotional language. Which conclusion requires additional evidence?&quot;,&quot;options&quot;:[&quot;That its output can be read by a person&quot;,&quot;That it has subjective conscious experience&quot;,&quot;That it produced a sequence of words&quot;,&quot;That language generation is one of its observed behaviours&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;可觀察到語言輸出，但主觀意識屬另一項主張。外在表現與內在經驗不能直接畫等號，老師亦以問題形式討論此議題。&quot;,&quot;key_en&quot;:&quot;Observed performance is not by itself proof of subjective experience.&quot;,&quot;source_pages&quot;:[3,39,49],&quot;source_note&quot;:&quot;Lecture 4 PDF 3, 39, 49&quot;,&quot;id&quot;:&quot;L4-038&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Privacy and purpose&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A school proposes face recognition for entry. Which question most directly examines privacy and control?&quot;,&quot;options&quot;:[&quot;Whether the software logo is attractive&quot;,&quot;Who can access the data, for what purpose, and with what safeguards?&quot;,&quot;Whether every student owns a phone&quot;,&quot;Whether the camera looks modern&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;私隱與控制要看資料收集目的、權限、保存及保障。設備外觀或是否先進，不能代替對使用者權利及濫用風險的分析。&quot;,&quot;key_en&quot;:&quot;Evaluate data access, purpose and safeguards when assessing surveillance.&quot;,&quot;source_pages&quot;:[27,31,46],&quot;source_note&quot;:&quot;Lecture 4 PDF 27, 31, 46&quot;,&quot;id&quot;:&quot;L4-039&quot;},{&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Forecasts and assumptions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A graph projects rapid computing growth into future decades. What is the most defensible interpretation?&quot;,&quot;options&quot;:[&quot;The graph removes all uncertainty about society.&quot;,&quot;It is a conditional extrapolation whose assumptions and metric should be examined.&quot;,&quot;Every marked future event is already an observed fact.&quot;,&quot;Extrapolation guarantees human-like intelligence at a fixed date.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;外推圖結合已有趨勢與假設，未來標記不是已發生事實。還要問衡量的是運算量、成本或其他指標，不能直接等同意識或社會結果。&quot;,&quot;key_en&quot;:&quot;A projection is conditional on its assumptions and chosen measure.&quot;,&quot;source_pages&quot;:[40,48],&quot;source_note&quot;:&quot;Lecture 4 PDF 40, 48&quot;,&quot;id&quot;:&quot;L4-040&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nanometre in metres&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Which value equals 1 nanometre?&quot;,&quot;options&quot;:[&quot;10⁹ metres&quot;,&quot;10⁻⁶ metre&quot;,&quot;10⁻³ metre&quot;,&quot;10⁻⁹ metre&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;nano表示十億分之一，1nm=10⁻⁹m。10⁻⁶m是微米，不能把nano與micro混用；數值必須連單位一起讀。&quot;,&quot;key_en&quot;:&quot;One nanometre is one billionth of a metre.&quot;,&quot;source_pages&quot;:[4],&quot;source_note&quot;:&quot;Lecture 6 PDF 4&quot;,&quot;id&quot;:&quot;L6-001&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nanometre in centimetres&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Because 1 metre = 100 centimetres, what is 1 nanometre in centimetres?&quot;,&quot;options&quot;:[&quot;10⁻⁷ cm&quot;,&quot;10⁷ cm&quot;,&quot;10⁻⁹ cm&quot;,&quot;10⁻¹¹ cm&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;1nm=10⁻⁹m，再乘100cm/m，得到10⁻⁷cm。單位由m改cm，數值不能仍然照抄負九次方。&quot;,&quot;key_en&quot;:&quot;Convert both the numerical factor and the unit.&quot;,&quot;source_pages&quot;:[4],&quot;source_note&quot;:&quot;Lecture 6 PDF 4&quot;,&quot;id&quot;:&quot;L6-002&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Comparing nanoscale sizes&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Which is larger: a 50 nm structure or a 2 µm structure?&quot;,&quot;options&quot;:[&quot;The 50 nm structure, because 50 is greater than 2&quot;,&quot;It is impossible to compare different units after conversion&quot;,&quot;The 2 µm structure, because it is 2000 nm&quot;,&quot;They are equal because both are microscopic&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;1µm=1000nm，因此2µm=2000nm，比50nm大。應先統一單位，不要直接比較前方兩個數字。&quot;,&quot;key_en&quot;:&quot;Use a common unit before comparing sizes.&quot;,&quot;source_pages&quot;:[4,5],&quot;source_note&quot;:&quot;Lecture 6 PDF 4, 5&quot;,&quot;id&quot;:&quot;L6-003&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;OTC meaning&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;What does over-the-counter medicine mean in the lecture?&quot;,&quot;options&quot;:[&quot;Medicine whose ingredients need not appear on a label&quot;,&quot;Medicine that cannot cause adverse effects&quot;,&quot;Medicine suitable for every person and every illness&quot;,&quot;Medicine available without a doctor’s prescription, subject to appropriate selection and directions&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;OTC描述取得方式，不代表任何人任何情況都安全。仍需看成分、劑量、警告與適用界線，不能把毋須處方當成毋須判斷。&quot;,&quot;key_en&quot;:&quot;Non-prescription access does not mean absence of risk.&quot;,&quot;source_pages&quot;:[19],&quot;source_note&quot;:&quot;Lecture 6 PDF 19&quot;,&quot;id&quot;:&quot;L6-004&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Duplicate ingredients&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A cold remedy lists paracetamol, while a pain reliever lists acetaminophen. What should a student recognize in this label-reading scenario?&quot;,&quot;options&quot;:[&quot;The names refer to the same active ingredient, creating a duplicate-ingredient concern.&quot;,&quot;Different product purposes guarantee no overlap.&quot;,&quot;Different names guarantee unrelated ingredients.&quot;,&quot;The colours of the packets determine whether they can overlap.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;paracetamol與acetaminophen是同一成分的名稱。不同品牌或用途不排除重複成分；讀標籤要比較每項active ingredient及用量。&quot;,&quot;key_en&quot;:&quot;Different products can contain the same active ingredient.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 6 PDF 20&quot;,&quot;id&quot;:&quot;L6-005&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Dosing interval&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a fictional label-reading exercise, directions say to wait at least 6 hours between doses. A dose was taken at 08:00. Why does taking another at 12:00 not follow those directions?&quot;,&quot;options&quot;:[&quot;Four hours is longer than six hours.&quot;,&quot;Only 4 hours have passed.&quot;,&quot;The interval no longer matters if symptoms remain.&quot;,&quot;Any daily maximum automatically cancels an interval instruction.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;08:00至12:00只過四小時，未滿題目指定六小時。總量與間隔是不同限制；本題只按虛構標籤判讀，並非實際藥物時間表。&quot;,&quot;key_en&quot;:&quot;Dose limits and spacing instructions must both be respected.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 6 PDF 20&quot;,&quot;id&quot;:&quot;L6-006&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Medicine units&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;What is 500 mg expressed in grams?&quot;,&quot;options&quot;:[&quot;5 g&quot;,&quot;0.5 g&quot;,&quot;0.05 g&quot;,&quot;50 g&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;1000mg=1g，所以500mg=0.5g。這只是單位換算，不能單憑成分質量推導某人的適用劑量或服用間隔。&quot;,&quot;key_en&quot;:&quot;Divide milligrams by 1000 to obtain grams.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 6 PDF 20&quot;,&quot;id&quot;:&quot;L6-007&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Addition polymerization&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;In the lecture’s ethene-to-polyethene example, what characterizes addition polymerization?&quot;,&quot;options&quot;:[&quot;The polymer is formed only by freezing water.&quot;,&quot;No chemical bonds change when the monomers join.&quot;,&quot;Every joining event must release a water molecule.&quot;,&quot;Monomers link as the carbon–carbon double bonds participate, without a small-molecule by-product in this example.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;乙烯加成涉及C=C參與連接，該例不產生小分子副產物。不要把所有聚合都說成必須放出水，亦不是單純物理結冰。&quot;,&quot;key_en&quot;:&quot;The stated ethene addition example forms a polymer without a small-molecule by-product.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 6 PDF 24&quot;,&quot;id&quot;:&quot;L6-008&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Condensation polymerization&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which statement best describes the lecture’s condensation-polymerization model?&quot;,&quot;options&quot;:[&quot;All possible condensation reactions must release oxygen gas.&quot;,&quot;Suitable functional groups react to form links while releasing small molecules such as water.&quot;,&quot;Only large crystals are condensed into smaller crystals.&quot;,&quot;Every monomer remains chemically separate.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;縮合由合適官能團反應形成連接，常伴小分子釋出；水是例子，不是所有情況唯一副產物。condensation不是這裡指物理凝結。&quot;,&quot;key_en&quot;:&quot;Condensation links monomers with the release of small molecules in the stated model.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 6 PDF 24&quot;,&quot;id&quot;:&quot;L6-009&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Comparing polymerizations&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student says only addition polymerization joins monomers; condensation does not. What is the best correction?&quot;,&quot;options&quot;:[&quot;Condensation is always just mechanical cutting.&quot;,&quot;Neither process links monomers.&quot;,&quot;All polymers must have identical chemical structures.&quot;,&quot;Both can form polymers by linking monomers; compare their reaction features and by-products.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;兩者都可把單體連成高分子，不能用「是否連接單體」作唯一分別。要看反應基團、連接方式及小分子副產物等條件。&quot;,&quot;key_en&quot;:&quot;Both processes can build polymers, but their chemistry differs.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 6 PDF 24&quot;,&quot;id&quot;:&quot;L6-010&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Surface-area scaling&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A cube is cut into 1000 equal smaller cubes, all separated so every new face is exposed. By what factor does the total surface area increase?&quot;,&quot;options&quot;:[&quot;1000&quot;,&quot;10&quot;,&quot;100&quot;,&quot;It remains unchanged.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;1000=10³，故每個小立方體邊長為原來十分之一。總表面積是1000×(1/10)²=10倍；總體積仍不變，前提是新面可接觸。&quot;,&quot;key_en&quot;:&quot;Separating smaller pieces can increase accessible area without increasing total volume.&quot;,&quot;source_pages&quot;:[3,6],&quot;source_note&quot;:&quot;Lecture 6 PDF 3, 6; existing Lecture6 Word surface-area supplement&quot;,&quot;id&quot;:&quot;L6-011&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Surface-to-volume ratio&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;For cubes, surface-area-to-volume ratio equals 6 divided by side length. How does a 10 nm cube compare with a 100 nm cube?&quot;,&quot;options&quot;:[&quot;It has the same ratio.&quot;,&quot;It has one tenth the ratio.&quot;,&quot;It has 1000 times the ratio.&quot;,&quot;It has 10 times the surface-area-to-volume ratio.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;比值與邊長成反比，100÷10=10，所以小立方體的表面積／體積比大十倍。不要把體積按三次方縮小直接當成比值變化。&quot;,&quot;key_en&quot;:&quot;For similar cubes, surface-area-to-volume ratio increases as size decreases.&quot;,&quot;source_pages&quot;:[3,6],&quot;source_note&quot;:&quot;Lecture 6 PDF 3, 6; existing Lecture6 Word surface-area supplement&quot;,&quot;id&quot;:&quot;L6-012&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Accessible surface&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Nanoparticles clump tightly together. Why might their usable surface area be lower than the simple separated-particle calculation predicts?&quot;,&quot;options&quot;:[&quot;The particles must stop obeying conservation of mass.&quot;,&quot;Their atoms automatically disappear.&quot;,&quot;Clumping guarantees every internal face becomes more accessible.&quot;,&quot;Some surfaces are in contact and are less accessible to the surroundings.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;理想計算假設每個新面都可接觸周圍。聚集時接觸面可能被遮蔽，因此幾何面積與實際可作用面積要分清。&quot;,&quot;key_en&quot;:&quot;Accessible surface depends on aggregation as well as particle size.&quot;,&quot;source_pages&quot;:[3,6],&quot;source_note&quot;:&quot;Lecture 6 PDF 3, 6; existing Lecture6 Word surface-area supplement&quot;,&quot;id&quot;:&quot;L6-013&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nano claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A product is advertised as nano and therefore better in every possible property. What is the best scientific response?&quot;,&quot;options&quot;:[&quot;Ask which structure, measured property, comparison and use conditions support the claim.&quot;,&quot;Accept the claim b

ecause nano is a guarantee of superiority.&quot;,&quot;Reject all nanoscale materials without testing.&quot;,&quot;Assume smaller size eliminates every safety and cost issue.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;納米結構可能改變性能，但不保證所有性能皆較好。應把具體結構連到量度、比較與用途，亦保留成本、安全及環境取捨。&quot;,&quot;key_en&quot;:&quot;A nanoscale label does not replace property-specific evidence.&quot;,&quot;source_pages&quot;:[3,6,17],&quot;source_note&quot;:&quot;Lecture 6 PDF 3, 6, 17&quot;,&quot;id&quot;:&quot;L6-014&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Carbon structures&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which distinction should be maintained when reading the nanomaterial examples?&quot;,&quot;options&quot;:[&quot;Carbon nanotubes are ordinary macroscopic drinking straws.&quot;,&quot;C60 is simply another spelling of every carbon nanotube.&quot;,&quot;All carbon materials have the same shape and properties.&quot;,&quot;A C60 fullerene molecule and a carbon nanotube are different structures.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;C60分子與管狀碳納米結構不是同一物件。化學元素相同也不代表結構或性能完全相同，應以形態與鍵結情況分辨。&quot;,&quot;key_en&quot;:&quot;Structure matters even when materials contain the same element.&quot;,&quot;source_pages&quot;:[6,8],&quot;source_note&quot;:&quot;Lecture 6 PDF 6, 8&quot;,&quot;id&quot;:&quot;L6-015&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nanowire dimensions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Using the convention that a 1D nanomaterial extends along one long direction while two transverse dimensions are nanoscale, which example fits best?&quot;,&quot;options&quot;:[&quot;A long, thin nanowire&quot;,&quot;An isolated roughly spherical quantum dot&quot;,&quot;A bulk block with no nanoscale dimension&quot;,&quot;A thin film extending in two large directions&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;題目已交代維度約定：長方向延伸、兩個橫向尺寸為納米，對應nanowire。要先辨認採用哪一種數法，不能只數名稱中的數字。&quot;,&quot;key_en&quot;:&quot;State the dimensional convention before classifying the structure.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 6 PDF 9&quot;,&quot;id&quot;:&quot;L6-016&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Thin-film dimensions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Under the convention that 2D materials extend in two directions but have nanoscale thickness, which structure is a 2D example?&quot;,&quot;options&quot;:[&quot;A bulk cube with no nanoscale feature&quot;,&quot;A very thin film with a large length and width&quot;,&quot;A long wire with two nanoscale cross-sectional dimensions&quot;,&quot;A single small particle with all three dimensions confined&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;薄膜在平面兩方向延伸，厚度受限，符合題目指定的2D約定。納米分類有不同表述，答題須依已說明的定義。&quot;,&quot;key_en&quot;:&quot;A thin film can be two-dimensional in its extended directions.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 6 PDF 9&quot;,&quot;id&quot;:&quot;L6-017&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nanoparticle dimensions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A convention labels structures with all three spatial dimensions confined to the nanoscale as 0D. Which example best fits?&quot;,&quot;options&quot;:[&quot;A room-sized solid block&quot;,&quot;A long macroscopic cable&quot;,&quot;An approximately spherical quantum dot&quot;,&quot;A large-area thin coating&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;若三個方向都局限納米尺度，按此約定可稱0D，如量子點。不要把「三方向都小」誤讀成必定叫3D，約定已在題目指定。&quot;,&quot;key_en&quot;:&quot;Classification labels depend on which directions are confined or extended.&quot;,&quot;source_pages&quot;:[9],&quot;source_note&quot;:&quot;Lecture 6 PDF 9&quot;,&quot;id&quot;:&quot;L6-018&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Nanotube properties&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An engineer considers nanotubes for a lightweight conducting component. Which evaluation is most appropriate?&quot;,&quot;options&quot;:[&quot;Check the relevant mechanical and electrical properties for the actual structure and manufacturing conditions.&quot;,&quot;Assume every nanotube has infinite strength and zero resistance.&quot;,&quot;Choose only by the word nano on the packaging.&quot;,&quot;Ignore defects because nanoscale objects cannot contain them.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;強度及導電是可能的應用理由，仍受結構、缺陷及製作方式影響。課堂性能方向不能擴寫成每條管都無限強或完全無電阻。&quot;,&quot;key_en&quot;:&quot;Useful applications require properties that are verified for the actual material.&quot;,&quot;source_pages&quot;:[8],&quot;source_note&quot;:&quot;Lecture 6 PDF 8&quot;,&quot;id&quot;:&quot;L6-019&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Applications and evidence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A slide lists targeted drug delivery as a nanotechnology application. What does that list alone establish?&quot;,&quot;options&quot;:[&quot;Every nanoscale carrier is approved for every disease.&quot;,&quot;It identifies an application area, not proof that every proposed product is clinically effective.&quot;,&quot;No testing is needed once a product is nanoscale.&quot;,&quot;All biological effects are beneficial.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;應用清單指出研究或使用方向，不等於所有產品已被臨床證實。仍要分清具體介入、證據階段、效益及風險，不能由插圖代替資料。&quot;,&quot;key_en&quot;:&quot;An application category is not evidence for every specific implementation.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 6 PDF 10&quot;,&quot;id&quot;:&quot;L6-020&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Logarithmic scales&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;On a logarithmic size diagram, neighbouring labelled ticks differ by a factor of 10. What does equal spacing indicate?&quot;,&quot;options&quot;:[&quot;Equal multiplicative ratios&quot;,&quot;Equal additions of 1 nm&quot;,&quot;Equal numbers of objects&quot;,&quot;Identical physical properties&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;對數軸等距代表固定倍數變化，不是每格加一樣多納米。讀圖要看刻度及單位，不能按紙上距離直接作線性大小判斷。&quot;,&quot;key_en&quot;:&quot;A logarithmic scale represents multiplicative rather than fixed additive steps.&quot;,&quot;source_pages&quot;:[5],&quot;source_note&quot;:&quot;Lecture 6 PDF 5&quot;,&quot;id&quot;:&quot;L6-021&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Scale ratio&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Using the diagram’s values, a structure is 5 nm wide and an atom is approximately 0.1 nm across. What is their size ratio?&quot;,&quot;options&quot;:[&quot;5&quot;,&quot;0.5&quot;,&quot;50&quot;,&quot;5000&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;兩者單位相同，5÷0.1=50。這是題目給定近似尺寸的比較，不代表所有原子或納米管的大小都固定一樣。&quot;,&quot;key_en&quot;:&quot;Calculate a size ratio using consistent units and stated approximations.&quot;,&quot;source_pages&quot;:[5],&quot;source_note&quot;:&quot;Lecture 6 PDF 5&quot;,&quot;id&quot;:&quot;L6-022&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Conduction&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;One end of a metal spoon is heated and the handle becomes warm without the spoon flowing around. Which heat-transfer mechanism is most directly illustrated?&quot;,&quot;options&quot;:[&quot;No energy transfer&quot;,&quot;Bulk fluid convection&quot;,&quot;Conduction&quot;,&quot;Evaporation only&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;金屬內相鄰部分傳能屬傳導；物體本身不需整體流動。實際情境可有多種傳熱，但此例著重沿湯匙的熱傳導。&quot;,&quot;key_en&quot;:&quot;Conduction transfers energy through a material without bulk fluid motion.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 6 PDF 13&quot;,&quot;id&quot;:&quot;L6-023&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Convection&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Warm water rises and cooler water sinks, forming a circulating flow. Which mechanism does this illustrate?&quot;,&quot;options&quot;:[&quot;Radioactive decay&quot;,&quot;Convection&quot;,&quot;Character encoding&quot;,&quot;Conduction without fluid movement&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;這裡由流體整體移動攜帶熱量，屬對流。它和鄰近粒子傳能的傳導、電磁波傳能的輻射是不同機制。&quot;,&quot;key_en&quot;:&quot;Convection involves heat transfer with bulk fluid movement.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 6 PDF 13&quot;,&quot;id&quot;:&quot;L6-024&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Radiation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Energy travels from the Sun across space to a surface. Which heat-transfer mechanism can account for that transfer through a vacuum?&quot;,&quot;options&quot;:[&quot;Radiation&quot;,&quot;Only the movement of liquid water&quot;,&quot;Ordinary air convection&quot;,&quot;Conduction through a continuous metal bar&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;電磁輻射可跨真空傳遞能量；一般對流需要流體，傳導需要相應物質接觸。不能因空間沒有空氣就說完全不能傳熱。&quot;,&quot;key_en&quot;:&quot;Thermal radiation does not require a material medium.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 6 PDF 13&quot;,&quot;id&quot;:&quot;L6-025&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Radiative cooling&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which combination best describes the passive radiative-cooling coating discussed in the lecture?&quot;,&quot;options&quot;:[&quot;Absorbing all sunlight while preventing every thermal emission&quot;,&quot;Cooling solely by compressing a refrigerant with a motor&quot;,&quot;Reducing absorbed sunlight while emitting thermal radiation&quot;,&quot;Producing cold without any energy exchange&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;案例結合反射太陽光與熱輻射放能。被動是塗層不需主動供電，不等於沒有能量轉移，也不是壓縮式冷氣機的同一原理。&quot;,&quot;key_en&quot;:&quot;Passive radiative cooling combines solar reflection with thermal emission.&quot;,&quot;source_pages&quot;:[14],&quot;source_note&quot;:&quot;Lecture 6 PDF 14&quot;,&quot;id&quot;:&quot;L6-026&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Passive does not mean no energy&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A coating works without its own electrical power supply. Which claim would go beyond that observation?&quot;,&quot;options&quot;:[&quot;The coating may exchange energy with its surroundings.&quot;,&quot;The whole building must therefore consume zero energy.&quot;,&quot;Its performance can depend on environmental conditions.&quot;,&quot;Its purpose may include reducing cooling demand.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;塗層本身不需供電，不能推出整幢樓零耗能。仍有其他設備負荷及環境條件，應界定評估系統範圍與量度指標。&quot;,&quot;key_en&quot;:&quot;A component-level energy claim does not automatically apply to an entire building.&quot;,&quot;source_pages&quot;:[14],&quot;source_note&quot;:&quot;Lecture 6 PDF 14&quot;,&quot;id&quot;:&quot;L6-027&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Cooling metrics&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A case reports a roof-surface temperature reduction of 30°C. Which conclusion is not justified by that metric alone?&quot;,&quot;options&quot;:[&quot;The meaning of the temperature difference depends on the comparison.&quot;,&quot;Indoor and surface temperatures are different quantities.&quot;,&quot;Indoor air temperature fell by exactly 30°C.&quot;,&quot;The reported measurement concerns a surface.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;屋頂表面降溫不等於室內空氣下降同一幅度；溫差亦不是最終溫度。讀案例必須保留測量位置、基準及指標。&quot;,&quot;key_en&quot;:&quot;Do not substitute indoor temperature for a measured surface-temperature change.&quot;,&quot;source_pages&quot;:[15],&quot;source_note&quot;:&quot;Lecture 6 PDF 15&quot;,&quot;id&quot;:&quot;L6-028&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Energy-saving calculation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In a hypothetical comparison, baseline electricity use is 10,000 kWh and the measured saving is 20%. How much electricity is saved?&quot;,&quot;options&quot;:[&quot;50,000 kWh&quot;,&quot;8000 kWh&quot;,&quot;2000 kWh&quot;,&quot;20 kWh&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;節省量是10,000×20%=2000kWh；8000kWh是剩餘使用量。要分清比例、節省能量與最終耗能，並保留題目的比較基準。&quot;,&quot;key_en&quot;:&quot;Percentage saved and energy remaining are different quantities.&quot;,&quot;source_pages&quot;:[15],&quot;source_note&quot;:&quot;Lecture 6 PDF 15&quot;,&quot;id&quot;:&quot;L6-029&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Cooling textiles&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A shirt wicks moisture and dries quickly. Which statement best interprets this property?&quot;,&quot;options&quot;:[&quot;It can improve moisture management without proving that it lowers the room temperature.&quot;,&quot;It guarantees identical comfort for every wearer.&quot;,&quot;It eliminates every need for sweating.&quot;,&quot;It must function as an electrically powered refrigerator.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;吸濕排汗與快乾涉及水分管理及舒適感，不等於把整個房間冷卻。身體感受還受環境、活動及衣物條件影響。&quot;,&quot;key_en&quot;:&quot;Moisture management is different from actively cooling the surrounding air.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 6 PDF 16&quot;,&quot;id&quot;:&quot;L6-030&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Life-cycle assessment&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A new material performs well during use but creates disposal difficulties. Which assessment is most complete?&quot;,&quot;options&quot;:[&quot;Ignore disposal because the material is technologically advanced.&quot;,&quot;Judge only its strongest advertised property.&quot;,&quot;Consider manufacturing, use, disposal, costs and relevant benefits together.&quot;,&quot;Assume durability automatically eliminates waste.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;材料應連製造、使用及棄置評估；耐用可有好處亦可能增加廢棄處理困難。單一新性能不能代替全生命週期的取捨。&quot;,&quot;key_en&quot;:&quot;Material evaluation should consider benefits and impacts across its life cycle.&quot;,&quot;source_pages&quot;:[17,24],&quot;source_note&quot;:&quot;Lecture 6 PDF 17, 24&quot;,&quot;id&quot;:&quot;L6-031&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Reading ingredient strength&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two products have different brand names. What information most directly helps detect duplicate dosing of the same substance?&quot;,&quot;options&quot;:[&quot;Active ingredient names and the amount in each dose&quot;,&quot;Only the advertising slogan&quot;,&quot;Only the colour of the tablets&quot;,&quot;Only whether the packets have different logos&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;品牌或外觀不同不表示成分不同。比較每劑的active ingredient及strength，才可辨認重複使用；亦要讀其他警告及指示。&quot;,&quot;key_en&quot;:&quot;Compare ingredients and strengths across all products, not just brand names.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 6 PDF 20&quot;,&quot;id&quot;:&quot;L6-032&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Interactions and warnings&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A medicine label warns that it may interact with another product a person uses. In a label-reading exercise, what is the most appropriate response?&quot;,&quot;options&quot;:[&quot;Use packet appearance to decide whether the warning matters.&quot;,&quot;Ignore the warning because no prescription is required.&quot;,&quot;Double the dose to overcome the interaction.&quot;,&quot;Seek suitable professional advice rather than assume the warning is cancelled by OTC availability.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;OTC身分不會取消相互作用警告。這類情境考閱讀標籤及自我照顧界線，不應自行以加量或外觀代替合適專業判斷。&quot;,&quot;key_en&quot;:&quot;OTC access does not remove interaction warnings.&quot;,&quot;source_pages&quot;:[19,20],&quot;source_note&quot;:&quot;Lecture 6 PDF 19, 20&quot;,&quot;id&quot;:&quot;L6-033&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Limits of self-care&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which claim is inconsistent with the lecture’s account of OTC self-care?&quot;,&quot;options&quot;:[&quot;OTC status guarantees that professional advice is never necessary.&quot;,&quot;Side effects and dosing errors remain possible.&quot;,&quot;OTC medicines may help with some common minor problems.&quot;,&quot;Users should consider warnings and directions.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;成藥可處理部分輕微常見問題，但有風險及求助界線。把「可自行購買」擴寫成「永遠不用專業意見」是過度概括。&quot;,&quot;key_en&quot;:&quot;Self-care has limits even when a product is available without prescription.&quot;,&quot;source_pages&quot;:[19],&quot;source_note&quot;:&quot;Lecture 6 PDF 19&quot;,&quot;id&quot;:&quot;L6-034&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Directions and duration&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A fictional product’s practice label limits use to a stated duration and says to seek advice if symptoms persist. Which interpretation follows it?&quot;,&quot;options&quot;:[&quot;Symptoms remaining automatically authorizes unlimited use.&quot;,&quot;Persistent symptoms require attention to the stated advice, not automatic extension or dose escalation.&quot;,&quot;A daily dose limit makes every other instruction irrelevant.&quot;,&quot;Directions concern the brand name but not duration.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;用藥指示包括劑量、間隔及期限，不是只看一個總量。題目若有持續症狀的求助指示，就不能自行把療程無限延長或加量。&quot;,&quot;key_en&quot;:&quot;Read dose, interval, duration and advice conditions together.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 6 PDF 20&quot;,&quot;id&quot;:&quot;L6-035&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Biodegradable claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A bag is labelled biodegradable. What evidence is most relevant before claiming it will rapidly disappear in any natural environment?&quot;,&quot;options&quot;:[&quot;The word biodegradable without any conditions&quot;,&quot;A photograph of a forest on the packet&quot;,&quot;The presence of a green-coloured logo alone&quot;,&quot;The required conditions, test method, timescale and relevant material evidence&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;可分解性需要條件、時間與測試證據。工業處理下的結果不能不加條件地套到海洋、土壤或任何戶外環境。&quot;,&quot;key_en&quot;:&quot;A biodegradability claim must specify the conditions under which it applies.&quot;,&quot;source_pages&quot;:[21,24],&quot;source_note&quot;:&quot;Lecture 6 PDF 21, 24&quot;,&quot;id&quot;:&quot;L6-036&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Policy scope&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A policy summary restricts specified single-use plastic items in certain activities and places. Which reading is most accurate?&quot;,&quot;options&quot;:[&quot;Every plastic object is prohibited everywhere.&quot;,&quot;A restriction on one use proves all recycling is impossible.&quot;,&quot;Check the product, activity, location and applicable date before applying the restriction.&quot;,&quot;Every jurisdiction must have the same rule.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;政策的產品、用途、地域及日期都影響範圍。指定一次性用品的禁限，不能直接推成所有塑膠、所有地方均違規。&quot;,&quot;key_en&quot;:&quot;Policy interpretation requires attention to scope and context.&quot;,&quot;source_pages&quot;:[21,22],&quot;source_note&quot;:&quot;Lecture 6 PDF 21, 22&quot;,&quot;id&quot;:&quot;L6-037&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Targets and compliance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A lecture policy table gives an implementation deadline. What does the deadline alone not establish?&quot;,&quot;options&quot;:[&quot;The date written in the policy summary&quot;,&quot;That timing is one aspect of the policy&quot;,&quot;That the relevant category should be identified&quot;,&quot;The actual compliance rate after that date&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;政策期限是規範的時點，不是達標率的實際調查。要知道執行情況仍需資料，不能把應做日期當成已全部做到的證據。&quot;,&quot;key_en&quot;:&quot;A policy deadline is not an empirical measure of compliance.&quot;,&quot;source_pages&quot;:[22],&quot;source_note&quot;:&quot;Lecture 6 PDF 22&quot;,&quot;id&quot;:&quot;L6-038&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Environmental marketing&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A café calls its packaging eco-friendly but provides no material or testing information. What is the best evaluation?&quot;,&quot;options&quot;:[&quot;Treat eco-friendly as proof of every legal and environmental claim.&quot;,&quot;Ask for evidence about the specific environmental claim and relevant conditions.&quot;,&quot;Assume all packaging has identical impacts.&quot;,&quot;Infer biodegradability from the café’s popularity.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;環保名稱不會自行證明材料、可分解性或合規；要問具體主張、條件及證據。市場人氣亦不能替代測試與適用範圍。&quot;,&quot;key_en&quot;:&quot;Environmental claims need specific evidence, not labels alone.&quot;,&quot;source_pages&quot;:[23],&quot;source_note&quot;:&quot;Lecture 6 PDF 23&quot;,&quot;id&quot;:&quot;L6-039&quot;},{&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Polymer structure and properties&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two polymers have different branching and cross-linking patterns. Why should their properties be measured rather than assumed identical?&quot;,&quot;options&quot;:[&quot;Cross-linking only changes the spelling of a material’s name.&quot;,&quot;The word polymer eliminates the relevance of chemical structure.&quot;,&quot;Structure can influence material behaviour even when both are polymers.&quot;,&quot;All polymers must have the same mechanical properties.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;鏈長、支化及交聯可影響材料表現，因此同叫polymer不代表性質相同。結構與用途的關係需具體比較，不能只靠類別名稱推定。&quot;,&quot;key_en&quot;:&quot;Polymer properties depend on molecular structure and organization.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 6 PDF 24&quot;,&quot;id&quot;:&quot;L6-040&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Eugenics and consent&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A policy proposes preventing a group labelled genetically undesirable from having children without their consent. Which concern is most directly raised?&quot;,&quot;options&quot;:[&quot;Coercion and discrimination in reproductive decisions&quot;,&quot;Whether the policy increases the number of chromosomes&quot;,&quot;Whether all participants have the same blood group&quot;,&quot;Whether the policy uses a modern laboratory&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;重點是強迫、生育自主與歧視，而非技術新舊。優生學把人依所謂理想特徵分類，須問誰訂標準及是否侵犯同意；改用新技術也不會自動解決倫理問題。&quot;,&quot;key_en&quot;:&quot;A technical method does not remove concerns about consent and discrimination.&quot;,&quot;source_pages&quot;:[12],&quot;source_note&quot;:&quot;Lecture 7 PDF 12; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-001&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Gene and allele&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which statement best distinguishes a gene from an allele?&quot;,&quot;options&quot;:[&quot;An allele is always a whole chromosome&quot;,&quot;A gene is a version of an allele&quot;,&quot;An allele is a version of a gene&quot;,&quot;A gene and an allele are both names for a protein&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;Allele是同一基因位置的不同版本；典型二倍體個體從父母各得一個版本。不要把等位基因、整條染色體或最終製成的蛋白質當成相同層次。&quot;,&quot;key_en&quot;:&quot;An allele is an alternative version of a gene.&quot;,&quot;source_pages&quot;:[8,14],&quot;source_note&quot;:&quot;Lecture 7 PDF 8,14; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-002&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Nucleotide structure&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which set of components forms a DNA nucleotide?&quot;,&quot;options&quot;:[&quot;A chromosome, ribosome and protein&quot;,&quot;Three amino acids&quot;,&quot;A phosphate group, deoxyribose sugar and nitrogenous base&quot;,&quot;A protein, an allele and a cell membrane&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;一個DNA核苷酸包含磷酸、脫氧核糖及含氮鹼基。A、T、C、G只指出鹼基種類；鹼基本身並不等於包含糖與磷酸的完整核苷酸。&quot;,&quot;key_en&quot;:&quot;A DNA nucleotide contains phosphate, deoxyribose and a base.&quot;,&quot;source_pages&quot;:[15,16],&quot;source_note&quot;:&quot;Lecture 7 PDF 15,16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-003&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;DNA base pairing&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A DNA model shows an adenine base on one strand. Which base should pair with it on the complementary strand?&quot;,&quot;options&quot;:[&quot;Cytosine&quot;,&quot;Adenine&quot;,&quot;Thymine&quot;,&quot;Guanine&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;DNA互補配對是A–T及G–C。複製時利用舊鏈作模板，按配對規則建立新鏈；不是任意配對，也不要把RNA中的U直接套入DNA雙鏈。&quot;,&quot;key_en&quot;:&quot;In DNA, adenine pairs with thymine.&quot;,&quot;source_pages&quot;:[16,20],&quot;source_note&quot;:&quot;Lecture 7 PDF 16,20; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-004&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Mitosis and meiosis&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A typical diploid human germ cell produces haploid products for reproduction. Which process is involved?&quot;,&quot;options&quot;:[&quot;Mitosis alone&quot;,&quot;Meiosis&quot;,&quot;DNA replication alone&quot;,&quot;Translation&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;配子形成涉及減數分裂，使典型人類染色體組數由二倍體降為單倍體。DNA複製只是先複製遺傳物質，不會單獨產生四個單倍體產物；成熟配子也不是再自行減數分裂。&quot;,&quot;key_en&quot;:&quot;Meiosis produces haploid products used in sexual reproduction.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 7 PDF 21; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-005&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Transcription and translation&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which sequence correctly links the two main stages of protein production?&quot;,&quot;options&quot;:[&quot;Protein is transcribed into DNA, then DNA is translated into RNA&quot;,&quot;RNA is replicated into amino acids without translation&quot;,&quot;DNA is translated directly into a chromosome&quot;,&quot;DNA is transcribed into RNA, then RNA is translated into protein&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;轉錄以DNA資訊製成RNA；翻譯由核糖體按mRNA資訊連接胺基酸成蛋白質。DNA複製、轉錄及翻譯的模板和產物不同，不能只因都涉及遺傳資訊便混為一談。&quot;,&quot;key_en&quot;:&quot;Transcription produces RNA; translation uses RNA information to make protein.&quot;,&quot;source_pages&quot;:[22,23],&quot;source_note&quot;:&quot;Lecture 7 PDF 22,23; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-006&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Mutation and selection&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A DNA change increases an organism’s reproductive success in one environment. Which interpretation is best?&quot;,&quot;options&quot;:[&quot;The organism deliberately created the mutation because it needed it&quot;,&quot;All mutations are beneficial&quot;,&quot;The mutation may be favoured by natural selection in that environment&quot;,&quot;The mutation must be beneficial in every environment&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;突變產生變異，是否有利須看環境；自然選擇影響可遺傳變異跨代的比例。不能把突變說成生物有目的地自我改良，也不能把某環境的優勢推成所有環境都有效。&quot;,&quot;key_en&quot;:&quot;The consequences of a mutation depend on context, and selection acts on heritable variation.&quot;,&quot;source_pages&quot;:[26,27],&quot;source_note&quot;:&quot;Lecture 7 PDF 26,27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-007&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Monohybrid inheritance&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume complete dominance: T is tall and t is short. In a Tt × Tt cross, what is the probability of a short offspring?&quot;,&quot;options&quot;:[&quot;50%&quot;,&quot;100%&quot;,&quot;75%&quot;,&quot;25%&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;兩親本各可提供T或t，四種等機會組合為TT、Tt、Tt、tt，只有tt為矮莖，所以是四分之一。題目已指定完全顯性模型，不能把基因型比例直接當表型比例。&quot;,&quot;key_en&quot;:&quot;Under complete dominance, Tt × Tt gives a 1/4 chance of tt.&quot;,&quot;source_pages&quot;:[9,10],&quot;source_note&quot;:&quot;Lecture 7 PDF 9,10; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-008&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Genotype and phenotype&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two purple-flowered plants have genotypes BB and Bb in a complete-dominance model. Which statement is correct?&quot;,&quot;options&quot;:[&quot;Their genotypes match, but their phenotypes differ&quot;,&quot;Both must produce only B-bearing gametes&quot;,&quot;Their phenotypes match, but their genotypes differ&quot;,&quot;The b allele has disappeared from the heterozygote&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;BB與Bb基因型不同，但在完全顯性模型都可表現紫花。Bb仍保留隱性b，亦可把b傳給後代；顯性表現不代表另一等位基因消失或不能遺傳。&quot;,&quot;key_en&quot;:&quot;Different genotypes can produce the same phenotype under complete dominance.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 7 PDF 8,9; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-009&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Genetic engineering&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A laboratory directly inserts a selected DNA sequence into cells. How does this differ from selecting whole organisms for breeding?&quot;,&quot;options&quot;:[&quot;It is identical to natural selection&quot;,&quot;It directly manipulates genetic material rather than only choosing breeding parents&quot;,&quot;It never changes inherited characteristics&quot;,&quot;It guarantees an ethically acceptable and risk-free product&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;基因工程直接操作遺傳物質；選育則以繁殖親本及後代篩選累積性狀。方法分類與安全、成效及倫理是不同問題，不能因技術較直接就推斷結果必定安全或合理。&quot;,&quot;key_en&quot;:&quot;Genetic engineering manipulates genetic material directly.&quot;,&quot;source_pages&quot;:[12,14,29],&quot;source_note&quot;:&quot;Lecture 7 PDF 12,14,29; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-010&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Biotechnology scope&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A producer uses bacteria to ferment milk into a food product without directly editing DNA. Is this biotechnology?&quot;,&quot;options&quot;:[&quot;No, food production cannot involve biotechnology&quot;,&quot;No, biotechnology always requires a foreign gene&quot;,&quot;Yes, but only if the bacteria become a new species&quot;,&quot;Yes, it uses organisms for a specific production purpose&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;生物科技可利用生物、系統或其衍生物製造產品，範圍不限於基因工程。細菌發酵就是利用生物功能；是否插入外來DNA並不是所有生物科技的共同必要條件。&quot;,&quot;key_en&quot;:&quot;Biotechnology includes using organisms in production without gene editing.&quot;,&quot;source_pages&quot;:[3],&quot;source_note&quot;:&quot;Lecture 7 PDF 3; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-011&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Artificial selection&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;For many generations, a farmer saves seeds only from plants with a desired trait. Which process is most directly illustrated?&quot;,&quot;options&quot;:[&quot;Artificial selection&quot;,&quot;Chromosome replication without reproduction&quot;,&quot;Translation&quot;,&quot;Random mating without selection&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;農民挑選具所需性狀的親本，令該性狀在多代繁殖後較常見，是人工選擇。雜交可提供新的組合，但選擇哪些個體繁殖是另一個環節，不等於直接編輯DNA。&quot;,&quot;key_en&quot;:&quot;Artificial selection changes breeding success according to human preferences.&quot;,&quot;source_pages&quot;:[4,5,6],&quot;source_note&quot;:&quot;Lecture 7 PDF 4,5,6; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-012&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Animal breeding categories&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A learner treats a dog breed and a lion–tiger hybrid as exactly the same biological category. What is the best correction?&quot;,&quot;options&quot;:[&quot;Every dog breed is necessarily a separate species&quot;,&quot;A hybrid can never have health problems&quot;,&quot;Distinguish a breed within a species from a cross between different species&quot;,&quot;All unusual-looking animals are newly engineered hybrids&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;犬種與獅虎跨物種雜交不是相同分類。應先釐清親本及技術，並考慮健康、遺傳風險與動物福利；不能只憑特別外貌，就斷定動物是跨物種或基改產物。&quot;,&quot;key_en&quot;:&quot;Breeds and interspecific hybrids should not be treated as identical categories.&quot;,&quot;source_pages&quot;:[7],&quot;source_note&quot;:&quot;Lecture 7 PDF 7; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-013&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Dominance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;What does dominant mean in the simple complete-dominance model used in the lecture?&quot;,&quot;options&quot;:[&quot;The allele is necessarily more common in the population&quot;,&quot;The allele must prevent mutation&quot;,&quot;The allele is always healthier&quot;,&quot;The allele is expressed in the heterozygote&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;顯性描述異型合子中的表現關係，不代表在群體較常見、比較優越或對健康一定有利。基因版本的頻率、適應性及顯隱性屬不同問題，須分開判斷。&quot;,&quot;key_en&quot;:&quot;Dominance describes expression in a heterozygote, not superiority or frequency.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 7 PDF 8,9; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-014&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Test cross&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume complete dominance. A Tt plant is crossed with a tt plant. What proportion of offspring is expected to be tall?&quot;,&quot;options&quot;:[&quot;25%&quot;,&quot;50%&quot;,&quot;100%&quot;,&quot;75%&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;Tt親本提供T或t，tt親本只提供t，後代為等機會的Tt及tt。完全顯性下只有前者高莖，所以預期一半；不要把Tt互交的3比1比例套到所有交配。&quot;,&quot;key_en&quot;:&quot;Tt × tt gives equal expected proportions of Tt and tt.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 7 PDF 10; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-015&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;First filial generation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In the same complete-dominance model, what genotypes result from TT × tt?&quot;,&quot;options&quot;:[&quot;All Tt&quot;,&quot;Half TT and half tt&quot;,&quot;One-quarter TT, one-half Tt and one-quarter tt&quot;,&quot;All TT&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;TT只提供T，tt只提供t，因此每個組合都為Tt。1比2比1是兩個異型合子互交的預期，而不是純合顯性與純合隱性交配的結果。&quot;,&quot;key_en&quot;:&quot;TT × tt produces Tt offspring under the stated model.&quot;,&quot;source_pages&quot;:[10],&quot;source_note&quot;:&quot;Lecture 7 PDF 10; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-016&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Genotype proportions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;For Tt × Tt, what is the expected proportion of heterozygous offspring?&quot;,&quot;options&quot;:[&quot;1/4&quot;,&quot;1/2&quot;,&quot;3/4&quot;,&quot;1&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;四個等機會格為TT、Tt、Tt、tt，有兩個異型合子，所以為二分之一。表型高莖可包括TT及Tt，但題目問的是heterozygous基因型，不是顯性表型。&quot;,&quot;key_en&quot;:&quot;The heterozygous proportion in Tt × Tt is 1/2.&quot;,&quot;source_pages&quot;:[9,10],&quot;source_note&quot;:&quot;Lecture 7 PDF 9,10; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-017&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;ABO codominance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Use the lecture’s simplified ABO model. An AB parent and an AO parent have a child. What is the probability of blood group A?&quot;,&quot;options&quot;:[&quot;25%&quot;,&quot;0%&quot;,&quot;75%&quot;,&quot;50%&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;AB親本可給A或B，AO親本可給A或O，組合為AA、AO、AB、BO；AA與AO均是A型，合共一半。不要把另一個AO與BO例子的四型各四分之一混進來。&quot;,&quot;key_en&quot;:&quot;In the simplified AB × AO cross, AA and AO together give 50% group A.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 7 PDF 13; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-018&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;ABO recessive genotype&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Under the simplified ABO model, what is the probability of group O from AO × BO?&quot;,&quot;options&quot;:[&quot;75%&quot;,&quot;0%&quot;,&quot;25%&quot;,&quot;50%&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;AO與BO可產生AB、AO、BO、OO四個等機會組合；O型需要OO，因此四分之一。A與B共顯性，O為隱性，不能只看某一親本表型而忽略其等位基因。&quot;,&quot;key_en&quot;:&quot;AO × BO gives a 1/4 chance of OO under the simplified model.&quot;,&quot;source_pages&quot;:[13],&quot;source_note&quot;:&quot;Lecture 7 PDF 13; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-019&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Dihybrid inheritance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume independent assortment and complete dominance at both loci. In RrYy × RrYy, what fraction shows both dominant phenotypes?&quot;,&quot;options&quot;:[&quot;1/2&quot;,&quot;9/16&quot;,&quot;3/16&quot;,&quot;1/16&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;每個性狀表現顯性的機會為四分之三；在獨立分配的指定條件下，兩者同時出現為3/4乘3/4，即9/16。若存在連鎖等情況，不能保證仍有此比例。&quot;,&quot;key_en&quot;:&quot;The 9:3:3:1 expectation requires the stated independent-assortment model.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 7 PDF 11; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-020&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Model assumptions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two genes are strongly linked, yet a student insists their offspring must follow 9:3:3:1. What is the main problem?&quot;,&quot;options&quot;:[&quot;Linked genes cannot be inherited&quot;,&quot;The expected ratio depends on independent assortment, which may not apply&quot;,&quot;All genes always assort independently&quot;,&quot;A 9:3:3:1 ratio measures chromosome length&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;9比3比3比1不是所有兩性狀交配的普遍規律，須有獨立分配、完全顯性等模型條件。基因連鎖會改變配子組合與預期比例，應先檢查條件再套數字。&quot;,&quot;key_en&quot;:&quot;A Mendelian ratio must be applied only when its assumptions fit.&quot;,&quot;source_pages&quot;:[11],&quot;source_note&quot;:&quot;Lecture 7 PDF 11; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-021&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Complementary DNA sequence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A DNA strand contains the sequence ATGCCA. Ignoring direction for this pairing exercise, which sequence is complementary?&quot;,&quot;options&quot;:[&quot;TACGGT&quot;,&quot;ATGCCA&quot;,&quot;TAGCCT&quot;,&quot;UACGGU&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;逐個按A配T、T配A、G配C及C配G，可得TACGGT。本題已說忽略方向，只考配對；含U的選項屬RNA字母，不能當成DNA互補鏈。&quot;,&quot;key_en&quot;:&quot;Apply A–T and G–C pairing consistently to obtain the complementary DNA sequence.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 7 PDF 16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-022&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;DNA length scale&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A diploid cell has about 6 × 10^9 base pairs, each contributing 0.34 × 10^-9 m to DNA length. What approximate total length is obtained?&quot;,&quot;options&quot;:[&quot;0.34 m&quot;,&quot;2.04 m&quot;,&quot;0.00204 m&quot;,&quot;2.04 × 10^9 m&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;把鹼基對數乘每對長度：6×10^9乘0.34×10^-9＝2.04米。十的次方相消；這是把DNA拉直的總長估算，不是細胞核直徑或一條染色體的長度。&quot;,&quot;key_en&quot;:&quot;Multiplying base-pair number by length per pair gives an extended-DNA length estimate.&quot;,&quot;source_pages&quot;:[19],&quot;source_note&quot;:&quot;Lecture 7 PDF 19; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-023&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Chromosomes after replication&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A typical human somatic cell has 46 chromosomes before DNA replication. Immediately after replication, before sister chromatids separate, how many chromosomes are counted by centromeres?&quot;,&quot;options&quot;:[&quot;46&quot;,&quot;92&quot;,&quot;4&quot;,&quot;23&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;DNA複製令每條染色體具有兩條姊妹染色單體；在未分離前，按著絲點仍數46條。不要把DNA量、染色單體數與染色體數視為同一計數。&quot;,&quot;key_en&quot;:&quot;DNA replication doubles chromatids without immediately doubling chromosome number by centromere count.&quot;,&quot;source_pages&quot;:[19,21],&quot;source_note&quot;:&quot;Lecture 7 PDF 19,21; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-024&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Replication and meiotic divisions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which description of one meiotic cycle is correct?&quot;,&quot;options&quot;:[&quot;DNA is replicated again between meiosis I and II&quot;,&quot;Meiosis is a single division without prior DNA replication&quot;,&quot;One DNA replication is followed by two divisions&quot;,&quot;Every product remains diploid in the typical human model&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;減數分裂I前先有一輪DNA複製，之後兩次分裂；I與II之間不再複製。這安排令染色體組數下降，不能因兩次分裂便假設每次之前都另複製一次DNA。&quot;,&quot;key_en&quot;:&quot;One premeiotic replication is followed by two meiotic divisions.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 7 PDF 21; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-025&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;DNA replication mechanism&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A DNA strand opens and is used to guide the construction of a new strand. Which role is being illustrated?&quot;,&quot;options&quot;:[&quot;The existing strand acts as a ribosome&quot;,&quot;The DNA is being translated into amino acids directly&quot;,&quot;A chromosome is being converted into a lipid&quot;,&quot;The existing strand acts as a template for complementary nucleotides&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;舊DNA鏈作模板，新核苷酸按互補規則加入，是DNA複製。核糖體參與翻譯，而非把DNA核苷酸連成新鏈；模板的角色亦不等於最終蛋白質產物。&quot;,&quot;key_en&quot;:&quot;DNA replication uses existing strands as complementary templates.&quot;,&quot;source_pages&quot;:[20],&quot;source_note&quot;:&quot;Lecture 7 PDF 20; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-026&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Translation location and product&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A cell uses ribosomes to link amino acids according to mRNA information. Which process is occurring?&quot;,&quot;options&quot;:[&quot;Translation&quot;,&quot;Chromosomal crossover&quot;,&quot;DNA replication&quot;,&quot;Selective breeding&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;核糖體按mRNA資訊連接胺基酸，形成蛋白質，屬翻譯。轉錄製造RNA，複製製造DNA；三者不能只因都與基因相關便混用名稱。&quot;,&quot;key_en&quot;:&quot;Translation links amino acids using mRNA information.&quot;,&quot;source_pages&quot;:[22,23],&quot;source_note&quot;:&quot;Lecture 7 PDF 22,23; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-027&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Genes and environment&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Identical twins with very similar DNA develop some different traits after different experiences. Which conclusion is best?&quot;,&quot;options&quot;:[&quot;DNA must be irrelevant to every trait&quot;,&quot;Every human trait is determined only by one gene&quot;,&quot;Environmental factors and gene expression can contribute alongside genetic information&quot;,&quot;Identical DNA guarantees identical life histories and outcomes&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;遺傳資訊與環境都可參與性狀形成，不能由雙生子差異推成DNA完全無關。反過來，近乎相同DNA也不保證所有表型與人生結果完全相同，避免基因決定論。&quot;,&quot;key_en&quot;:&quot;Genetic similarity does not eliminate environmental contributions to phenotype.&quot;,&quot;source_pages&quot;:[38],&quot;source_note&quot;:&quot;Lecture 7 PDF 38; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-028&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Induced mutations&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A breeder exposes organisms to a mutagen and then screens many offspring for a useful trait. Why is screening needed?&quot;,&quot;options&quot;:[&quot;Induced changes are not all useful or precisely targeted&quot;,&quot;Every induced mutation produces the desired trait&quot;,&quot;Mutagens only change appearance without changing DNA&quot;,&quot;Selection prevents any mutation from occurring&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;誘發突變提高變化機會，但結果可有害、致死、無明顯作用或偶有用處，之後仍須篩選。不能把誘發較多變異當成精準命令每個個體得到指定有利性狀。&quot;,&quot;key_en&quot;:&quot;Inducing mutations is different from precisely specifying a desirable mutation.&quot;,&quot;source_pages&quot;:[28],&quot;source_note&quot;:&quot;Lecture 7 PDF 28; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-029&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Natural selection example&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Dark moths become more common when predators more easily see pale moths on dark tree trunks. Which explanation best fits natural selection?&quot;,&quot;options&quot;:[&quot;Existing heritable variation differs in survival and reproduction under the new conditions&quot;,&quot;Each moth deliberately changes its colour to match the tree&quot;,&quot;Pollution guarantees every mutation is beneficial&quot;,&quot;The population changes without any differences in reproductive success&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;環境及捕食改變不同已有變異的相對生存與繁殖成功，經多代影響比例。這不是每隻飛蛾因需要而主動變黑，也不是污染必定製造剛好有用的突變。&quot;,&quot;key_en&quot;:&quot;Selection changes the frequency of heritable variants through differential reproductive success.&quot;,&quot;source_pages&quot;:[26,27],&quot;source_note&quot;:&quot;Lecture 7 PDF 26,27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-030&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Restriction enzymes and ligase&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a simplified recombinant-DNA procedure, which pairing of tool and role is correct?&quot;,&quot;options&quot;:[&quot;Both tools eliminate the need for a DNA sequence&quot;,&quot;Both tools are names for whole chromosomes&quot;,&quot;Restriction enzyme cuts DNA; DNA ligase joins DNA fragments&quot;,&quot;DNA ligase cuts DNA; restriction enzyme makes proteins&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;限制酶在特定位置切開DNA，連接酶把片段接合。這是重組DNA的基本分工；不要把切、接與轉錄翻譯的角色互換，亦不要把酵素當成整條染色體。&quot;,&quot;key_en&quot;:&quot;Restriction enzymes cut DNA and ligase joins DNA fragments.&quot;,&quot;source_pages&quot;:[29],&quot;source_note&quot;:&quot;Lecture 7 PDF 29; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-031&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Gene to product to trait&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A fluorescent gene is introduced into a fish and an associated fluorescent protein is produced. Which chain best explains the trait?&quot;,&quot;options&quot;:[&quot;Introduced genetic information influences protein production, producing fluorescence&quot;,&quot;The fluorescent protein is transcribed back into the inserted gene to create the trait.&quot;,&quot;The inserted gene acts directly as the fluorescent protein, so translation is unnecessary.&quot;,&quot;DNA replication alone produces the fluorescent protein without gene expression.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;引入的DNA可經轉錄與翻譯影響螢光蛋白製造，再呈現性狀。DNA、RNA及蛋白質不是同一種物質；複製DNA亦不等於製造蛋白質，要分清複製、表達與可見結果。&quot;,&quot;key_en&quot;:&quot;An introduced gene can affect a trait through expression and protein production.&quot;,&quot;source_pages&quot;:[22,23,29],&quot;source_note&quot;:&quot;Lecture 7 PDF 22,23,29; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-032&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Bt and herbicide resistance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A GM corn variety produces a Cry protein that affects particular insect pests. Which description best fits this trait?&quot;,&quot;options&quot;:[&quot;Resistance to every herbicide&quot;,&quot;Guaranteed immunity to all environmental damage&quot;,&quot;Production of vitamin A itself in all tissues&quot;,&quot;Bt-associated insect resistance&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;Bt玉米的相關Cry蛋白針對特定害蟲，與作物耐受指定除草劑是兩種性狀。不能由一種改造推成所有害蟲、藥劑或環境壓力都能抵抗。&quot;,&quot;key_en&quot;:&quot;Bt insect resistance and herbicide tolerance are different engineered traits.&quot;,&quot;source_pages&quot;:[30,31],&quot;source_note&quot;:&quot;Lecture 7 PDF 30,31; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-033&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Golden rice purpose&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A rice variety is engineered to produce a compound that the human body can convert into vitamin A. What is the main intended application?&quot;,&quot;options&quot;:[&quot;Proof that every GM product is safe&quot;,&quot;Nutritional enhancement&quot;,&quot;Universal resistance to every insect&quot;,&quot;Elimination of all dietary needs&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;黃金米以營養改良為目標，相關產物可轉為維生素A。這個目的不等於所有營養問題已解決，仍要看實際攝取、吸收及替代措施；亦不能外推到所有基改產品。&quot;,&quot;key_en&quot;:&quot;Golden rice illustrates a targeted nutritional trait, not a universal claim about GM products.&quot;,&quot;source_pages&quot;:[32],&quot;source_note&quot;:&quot;Lecture 7 PDF 32; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-034&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Gene flow&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An engineered trait moves from a crop population into neighbouring compatible wild relatives through reproduction. Which environmental issue does this illustrate?&quot;,&quot;options&quot;:[&quot;The disappearance of all genetic variation&quot;,&quot;A guarantee of identical consequences in every ecosystem&quot;,&quot;Translation of DNA into rock&quot;,&quot;Gene flow&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;透過繁殖將等位基因傳到可交配群體，是基因流。其後果須按性狀、受體及環境評估，不能只見到GM標籤就斷定必定災難或完全無需管理。&quot;,&quot;key_en&quot;:&quot;Gene flow concerns movement of genetic variants between reproducing populations.&quot;,&quot;source_pages&quot;:[35],&quot;source_note&quot;:&quot;Lecture 7 PDF 35; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-035&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Evolution of resistance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An insect population becomes less susceptible after repeated exposure to a pest-control strategy. What is the most suitable explanation?&quot;,&quot;options&quot;:[&quot;Heritable resistance variants may be favoured by selection&quot;,&quot;All insects must have become genetically identical&quot;,&quot;The treatment cannot create any selection pressure&quot;,&quot;Each insect learns to redesign its DNA on purpose&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;持續使用策略可改變選擇壓力，令具可遺傳抗性者留下較多後代，抗性比例上升。這涉及群體跨代變化，不能說害蟲有目的地學會修改基因；管理需考慮抗性演化。&quot;,&quot;key_en&quot;:&quot;Repeated control measures can favour heritable resistance variants.&quot;,&quot;source_pages&quot;:[26,35],&quot;source_note&quot;:&quot;Lecture 7 PDF 26,35; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-036&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;X-linked recessive model&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In a simple X-linked recessive model, the mother is X^A X^a and the father is X^A Y. Given that their child is a son, what is the probability that he has the condition?&quot;,&quot;options&quot;:[&quot;0&quot;,&quot;1/2&quot;,&quot;1&quot;,&quot;1/4&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;Given that the child is a son：分母只包括兒子。父方已提供 Y，母方有 1/2 機會提供 X^a，所以答案是 1/2。若題目改問全部子女中「同時是兒子及患病」，在男女各半的模型才計 1/2 × 1/2 = 1/4。&quot;,&quot;key_en&quot;:&quot;In the stated model, sons receive their only X from the mother.&quot;,&quot;source_pages&quot;:[37],&quot;source_note&quot;:&quot;Lecture 7 PDF 37; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-037&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Cancer and inheritance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A text calls cancer a genetic disease. Which interpretation is most accurate?&quot;,&quot;options&quot;:[&quot;Cancer never involves changes acquired during life&quot;,&quot;DNA changes affecting cellular control are involved, but not every case is inherited from parents&quot;,&quot;Every cancer must have been inherited from a parent&quot;,&quot;Genetic means that environment cannot contribute&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;Genetic指出DNA變化參與機制，不等於所有個案都由父母遺傳。複製錯誤及環境相關作用亦可參與；應分清遺傳機制、變化來源與個人風險，不能只靠一個詞判斷。&quot;,&quot;key_en&quot;:&quot;Genetic mechanisms do not imply that every case is inherited.&quot;,&quot;source_pages&quot;:[39,40],&quot;source_note&quot;:&quot;Lecture 7 PDF 39,40; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-038&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Gene therapy evidence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;One gene-therapy intervention benefits a particular condition in a study. Which conclusion is most justified?&quot;,&quot;options&quot;:[&quot;The same method is necessarily suitable for every person&quot;,&quot;All genetic disorders are now cured&quot;,&quot;Any change in gene expression is automatically safe&quot;,&quot;Its benefits and risks must be assessed for that intervention and target condition&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;某項干預的研究結果只適用於相應方法、對象及條件，仍須評估效益與風險。不能由單一成功外推為所有遺傳病皆已治癒，亦不能把基因調節本身當安全保證。&quot;,&quot;key_en&quot;:&quot;Evidence for a specific intervention should not be generalized to every genetic condition.&quot;,&quot;source_pages&quot;:[44],&quot;source_note&quot;:&quot;Lecture 7 PDF 44; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-039&quot;},{&quot;lecture&quot;:7,&quot;topic&quot;:&quot;Product-specific risk judgement&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A consumer says a food must be safe simply because it is labelled natural, while every GM food must be unsafe. What is the strongest scientific response?&quot;,&quot;options&quot;:[&quot;Every GM product has the same composition and risk&quot;,&quot;A marketing label replaces all testing&quot;,&quot;Natural substances cannot have risks&quot;,&quot;Assess the particular product, trait, exposure and evidence rather than the label alone&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;天然或基改是分類標籤，不能單獨決定安全。應對具體產品、改造性狀、食用或環境暴露及證據採一致標準；存在其他食品風險也不自動證明此產品安全。&quot;,&quot;key_en&quot;:&quot;Risk assessment should be specific to the product and use, not inferred from a label alone.&quot;,&quot;source_pages&quot;:[34,35,53],&quot;source_note&quot;:&quot;Lecture 7 PDF 34,35,53; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L7-040&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Orbital free fall&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Astronauts float inside an Earth-orbiting station. What is the best explanation?&quot;,&quot;options&quot;:[&quot;The station and astronauts are falling together while moving around Earth&quot;,&quot;The astronauts are beyond the entire Solar System&quot;,&quot;Earth’s gravity is exactly zero at the station&quot;,&quot;Air pressure cancels all gravitational attraction&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;太空站與人一起受地球引力而持續繞地自由落下，相對支撐作用很小，形成漂浮。微重力不代表沒有引力；引力正是使軌道方向不斷改變的重要作用。&quot;,&quot;key_en&quot;:&quot;Orbital microgravity arises from common free fall, not absence of gravity.&quot;,&quot;source_pages&quot;:[14,15,30],&quot;source_note&quot;:&quot;Lecture 8 PDF 14,15,30; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-001&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Orbit versus escape&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In an ideal near-Earth example, about 8 km/s is an orbital speed while 11.2 km/s is the surface escape speed. Which statement is correct?&quot;,&quot;options&quot;:[&quot;Orbiting Earth does not require reaching the surface escape speed&quot;,&quot;8 km/s means gravity has disappeared&quot;,&quot;11.2 km/s is the escape speed at every location in the Universe&quot;,&quot;Both numbers describe the same motion under identical conditions&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;軌道運動與逃逸的能量條件不同，達到適合水平速度可繞地而不逃離。11.2km/s屬指定地球表面理想模型；高度、天體與參考系改變時，不能無條件沿用同一數值。&quot;,&quot;key_en&quot;:&quot;Orbital and escape speeds describe different conditions and require a specified location.&quot;,&quot;source_pages&quot;:[14,15,16],&quot;source_note&quot;:&quot;Lecture 8 PDF 14,15,16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-002&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Geostationary conditions&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A satellite has a period of one Earth sidereal day, but its orbit is inclined and elliptical. Must it appear fixed in the sky from the ground?&quot;,&quot;options&quot;:[&quot;Yes; satellites with this period stop moving in space&quot;,&quot;Yes; every geosynchronous orbit is geostationary&quot;,&quot;No; matching the period alone is insufficient for a geostationary orbit&quot;,&quot;No; no satellite can maintain a fixed ground longitude&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;同步只要求週期相配；地球靜止還需圓形、赤道面及與地球同向等條件。傾斜或橢圓軌道可令地面所見位置改變，不能把geosynchronous與geostationary完全互換。&quot;,&quot;key_en&quot;:&quot;Geostationary orbit is a special case of geosynchronous orbit.&quot;,&quot;source_pages&quot;:[24,25,26],&quot;source_note&quot;:&quot;Lecture 8 PDF 24,25,26; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-003&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;GPS altitude and radius&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume Earth’s radius is 6,370 km and a GPS satellite’s altitude is 20,200 km. What is its distance from Earth’s centre?&quot;,&quot;options&quot;:[&quot;6,370 km&quot;,&quot;20,200 km&quot;,&quot;26,570 km&quot;,&quot;13,830 km&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;高度由地面起計，地心半徑要加地球半徑：6370+20200=26570km。若題目問離地心距離，不能把常見GPS高度數字直接當答案，亦不是用高度減地球半徑。&quot;,&quot;key_en&quot;:&quot;Orbital radius equals planetary radius plus altitude in this model.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 8 PDF 27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-004&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;ISS purpose&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which task best represents a major purpose of the International Space Station?&quot;,&quot;options&quot;:[&quot;Serving as a permanent colony already established on Mars&quot;,&quot;Studying long-duration space living and conducting experiments in microgravity&quot;,&quot;Removing all need for life-support engineering&quot;,&quot;Proving that international scientific cooperation is impossible&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;ISS是長期研究與生活平台，可研究微重力、人體及設備，為更遠任務累積經驗。它不是火星殖民地；研究條件特殊亦不代表不需供氧、處理水及維持安全。&quot;,&quot;key_en&quot;:&quot;The ISS is an orbital research platform for microgravity and long-duration space experience.&quot;,&quot;source_pages&quot;:[30,31],&quot;source_note&quot;:&quot;Lecture 8 PDF 30,31; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-005&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Chinese programme roles&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which pairing of Chinese space programme and role is most accurate?&quot;,&quot;options&quot;:[&quot;All three are names for the same Mars rover&quot;,&quot;Shenzhou—crewed transport; Tiangong—space station; Chang’e—lunar exploration&quot;,&quot;Shenzhou—lunar samples; Tiangong—genetic testing; Chang’e—GPS phones&quot;,&quot;Chang’e—only Earth weather satellites; Shenzhou—only telescopes&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;神舟主要連到載人運輸與飛行，天宮連到空間站及在軌工作，嫦娥是探月。應分清計劃、飛船、站及探測器，不要見到同屬中國航天便把名稱和任務互換。&quot;,&quot;key_en&quot;:&quot;Programme names should be linked to their distinct mission roles.&quot;,&quot;source_pages&quot;:[32,33,42],&quot;source_note&quot;:&quot;Lecture 8 PDF 32,33,42; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-006&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Water and life evidence&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A Mars rover finds geological evidence consistent with ancient water. What conclusion is best supported?&quot;,&quot;options&quot;:[&quot;Ancient bacteria have necessarily been identified&quot;,&quot;Some past environments may have involved water, but life is not thereby confirmed&quot;,&quot;Humans can breathe unprotected on Mars today&quot;,&quot;Every liquid feature in the Solar System contains water&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;過去水的地質證據可支持研究古代環境及宜居性，但不是生命本身的確證。水、適合某些生命條件及已發現生命是不同證據層次，更不能推出人類可直接在火星生活。&quot;,&quot;key_en&quot;:&quot;Evidence of past water does not by itself establish past or present life.&quot;,&quot;source_pages&quot;:[43,50],&quot;source_note&quot;:&quot;Lecture 8 PDF 43,50; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-007&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Robotic sample return&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An uncrewed probe is designed to bring rock samples back to Earth. Which claim about it is incorrect?&quot;,&quot;options&quot;:[&quot;It can avoid carrying humans and their life support&quot;,&quot;It still faces engineering and failure risks&quot;,&quot;Because it is robotic, it cannot require a return system&quot;,&quot;Its design should follow the scientific objective&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;樣本返回的目標本身就需要相應返程或返回系統。無人可避免部分人員安全及生命維持負擔，但仍有成本、失敗和可靠性問題；不能把robotic推成便宜、無風險及一律不返程。&quot;,&quot;key_en&quot;:&quot;Robotic missions can require return systems when their objective is sample return.&quot;,&quot;source_pages&quot;:[38,42,46],&quot;source_note&quot;:&quot;Lecture 8 PDF 38,42,46; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-008&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Titan surface liquids&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A learner sees Titan’s lakes and rainfall and calls them an Earth-like liquid-water cycle. What correction is needed?&quot;,&quot;options&quot;:[&quot;Titan’s surface liquid cycle involves hydrocarbons such as methane and ethane&quot;,&quot;All lakes anywhere must contain liquid water&quot;,&quot;Titan has already been proved to contain human life&quot;,&quot;A similar landscape proves identical chemistry&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;土衛六表面河湖及降雨涉及甲烷、乙烷等碳氫化合物，不能只按地貌外觀認定為地球水循環。環境相似可引出研究問題，並不證明化學組成相同或已有生命。&quot;,&quot;key_en&quot;:&quot;Similar-looking landforms do not establish identical liquids or life.&quot;,&quot;source_pages&quot;:[40,45],&quot;source_note&quot;:&quot;Lecture 8 PDF 40,45; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-009&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Dwarf-planet classification&quot;,&quot;priority&quot;:&quot;core&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A non-satellite body rounded by its own gravity orbits the Sun but has not cleared its orbital neighbourhood. Under the lecture’s IAU Solar-System definition, which category best fits?&quot;,&quot;options&quot;:[&quot;Dwarf planet&quot;,&quot;Natural satellite&quot;,&quot;Geostationary satellite&quot;,&quot;Star&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;太陽系矮行星須繞太陽、近球形、不是衛星，但未符合行星的軌道鄰域主導條件。單看大小或形狀不足以判為行星；清除鄰域亦不是要求附近完全沒有小天體。&quot;,&quot;key_en&quot;:&quot;Planetary classification requires the full stated criteria, not roundness alone.&quot;,&quot;source_pages&quot;:[3,7,8],&quot;source_note&quot;:&quot;Lecture 8 PDF 3,7,8; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-010&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Light-year as distance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A target is 12 light-years away. Assuming a fixed distance and an immediate light-speed reply, when could Earth receive the reply at the earliest?&quot;,&quot;options&quot;:[&quot;Immediately, because a light-year measures age&quot;,&quot;After 12 seconds&quot;,&quot;About 12 years after sending&quot;,&quot;About 24 years after sending&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;光年是距離單位；固定12光年分隔下，光速訊號單程約12年，立即回覆的往返約24年。這是有條件傳播計算，並不證明對方存在、收到訊號或願意回覆。&quot;,&quot;key_en&quot;:&quot;A light-year is a distance, and an immediate reply still requires a round-trip travel time.&quot;,&quot;source_pages&quot;:[9,10,41],&quot;source_note&quot;:&quot;Lecture 8 PDF 9,10,41; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-011&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Rotation and revolution&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which pairing is correct?&quot;,&quot;options&quot;:[&quot;Rotation—orbiting the Sun; revolution—turning about an axis&quot;,&quot;Both terms are units of distance&quot;,&quot;Rotation—turning about an axis; revolution—orbiting another body&quot;,&quot;Both terms mean the size of a planet&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;Rotation指自轉，revolution指繞另一中心公轉，兩者週期亦不同。原講義個別標示有混用，應按實際運動意思理解；不要由英文位置或圖面排版直接背反。&quot;,&quot;key_en&quot;:&quot;Rotation and revolution describe different motions.&quot;,&quot;source_pages&quot;:[6],&quot;source_note&quot;:&quot;Lecture 8 PDF 6; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-012&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Source of solar energy&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;What process is responsible for the Sun’s long-term energy production?&quot;,&quot;options&quot;:[&quot;Friction with an empty surrounding medium&quot;,&quot;Reflection of Earth’s city lights&quot;,&quot;Ordinary burning of coal in oxygen&quot;,&quot;Nuclear fusion&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;太陽能量來源是核融合，而不是像煤或蠟燭那樣的化學燃燒。電影可用作討論引子，但不能把虛構的太陽熄滅情境當成實際恆星演化預測。&quot;,&quot;key_en&quot;:&quot;The Sun’s energy production is nuclear rather than ordinary chemical combustion.&quot;,&quot;source_pages&quot;:[4,5],&quot;source_note&quot;:&quot;Lecture 8 PDF 4,5; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-013&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Solar evolution&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A film depicts an immediate solar catastrophe. Which response best follows the lecture’s distinction between fiction and stellar evolution?&quot;,&quot;options&quot;:[&quot;Conclude that all stars evolve identically regardless of mass&quot;,&quot;Assume the Sun’s future is determined by the film’s release date&quot;,&quot;Treat every visual effect as a scientific observation&quot;,&quot;Compare the film with the Sun’s actual evolutionary model instead of treating the scene as a forecast&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;電影情節不是天文觀測。應將太陽的能量來源與未來演化模型分開理解，並保留時間尺度和天體條件；不能由一段特效推成即將發生的科學預報。&quot;,&quot;key_en&quot;:&quot;A fictional scenario must be distinguished from evidence-based stellar evolution.&quot;,&quot;source_pages&quot;:[4,5],&quot;source_note&quot;:&quot;Lecture 8 PDF 4,5; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-014&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Cosmic hierarchy&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which ordering correctly places the Solar System within larger structures?&quot;,&quot;options&quot;:[&quot;Milky Way within Earth within the Solar System&quot;,&quot;All three terms refer to the same size of object&quot;,&quot;Universe within the Sun within the Milky Way&quot;,&quot;Solar System within the Milky Way within the Universe&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;太陽系屬銀河系的一部分，銀河系又屬宇宙範圍。太陽、行星系統、星系與宇宙是不同層級，不能見到都有星體便把名稱或尺度當成同一概念。&quot;,&quot;key_en&quot;:&quot;The Solar System, Milky Way and Universe are different levels of cosmic structure.&quot;,&quot;source_pages&quot;:[9,10],&quot;source_note&quot;:&quot;Lecture 8 PDF 9,10; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-015&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Observations and old claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An old slide says no real close-up images of Pluto exist. Which fact shows that the statement needs historical qualification?&quot;,&quot;options&quot;:[&quot;Pluto became a natural satellite when it was reclassified&quot;,&quot;Pluto stopped orbiting the Sun in 2006&quot;,&quot;Every dwarf planet emits its own visible light&quot;,&quot;New Horizons obtained close-up images in 2015&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;新視野號2015年已取得近距離影像，因此舊頁說沒有照片屬當時資料。分類改變並不令冥王星停止繞太陽或變成衛星；要把觀測進展與分類標準分開。&quot;,&quot;key_en&quot;:&quot;Old observational statements should be checked against later mission milestones.&quot;,&quot;source_pages&quot;:[7,8],&quot;source_note&quot;:&quot;Lecture 8 PDF 7,8; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-016&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Speed units&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A simplified low-Earth-orbit speed is 8 km/s. What is this in km/h?&quot;,&quot;options&quot;:[&quot;8,000 km/h&quot;,&quot;2.22 km/h&quot;,&quot;28,800 km/h&quot;,&quot;480 km/h&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;一小時有3600秒，所以8km/s乘3600s/h＝28800km/h。換成每小時走的距離，數值應增加；只乘60會把秒和分鐘的轉換誤當整個換算。&quot;,&quot;key_en&quot;:&quot;Convert km/s to km/h by multiplying by 3,600.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 8 PDF 16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-017&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Path length versus altitude&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Assume a constant orbital speed of 8 km/s and a 90-minute period. The estimated path travelled in one orbit is 43,200 km. What does this number represent?&quot;,&quot;options&quot;:[&quot;Distance travelled along the orbital path&quot;,&quot;Altitude above Earth’s surface&quot;,&quot;A universal escape distance&quot;,&quot;Earth’s radius&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;90分鐘是5400秒，路程約8乘5400＝43200km。它是沿軌道一圈走過的距離，不是離地高度；完整一圈回到原位置時，位移亦不能與路程混為一談。&quot;,&quot;key_en&quot;:&quot;Orbital path length is different from altitude, radius and displacement.&quot;,&quot;source_pages&quot;:[16,24],&quot;source_note&quot;:&quot;Lecture 8 PDF 16,24; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-018&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Escape-speed conditions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student uses 11.2 km/s as the escape speed for every planet at every height. What is the main error?&quot;,&quot;options&quot;:[&quot;Escape speed depends on the body and starting position&quot;,&quot;A body’s mass can never affect escape requirements&quot;,&quot;Escape speed is a unit of distance&quot;,&quot;Escape speed is independent of gravity&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;11.2km/s是地球表面理想模型中的常見近似值。不同天體或高度的引力條件不同，不能不交代位置便套同一數字；實際航行亦須考慮方向、推進與其他條件。&quot;,&quot;key_en&quot;:&quot;An escape-speed value is meaningful only with its gravitational and positional conditions.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 8 PDF 16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-019&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Third cosmic speed reference&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Why should the lecture’s ideal 16.7 km/s third-cosmic-speed figure not be described simply as the universal escape speed from the Sun?&quot;,&quot;options&quot;:[&quot;It proves the Sun has no gravitational attraction&quot;,&quot;It applies identically at every distance from the Sun&quot;,&quot;It is the speed of light&quot;,&quot;It concerns a particular Earth-launch model and reference conditions&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;第三宇宙速度的數值連到由地球出發的理想模型，並利用地球繞日運動等條件。太陽引力場中的局部逃逸速度會隨位置改變；地心與日心參考系亦不能混用。&quot;,&quot;key_en&quot;:&quot;The 16.7 km/s figure is model-specific and is not a universal heliocentric escape speed.&quot;,&quot;source_pages&quot;:[16],&quot;source_note&quot;:&quot;Lecture 8 PDF 16; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-020&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Ground reference frame&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A geostationary satellite appears above the same ground longitude. Does this mean it is motionless in an inertial reference frame?&quot;,&quot;options&quot;:[&quot;No; it still moves along its orbit&quot;,&quot;No; it must travel directly away from Earth&quot;,&quot;Yes; all gravitational forces vanish&quot;,&quot;Yes; geostationary means zero orbital speed&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;地球靜止是相對地面維持方向，衛星仍繞地運動。參考系要講清楚，不能把相對地面固定解讀為在慣性空間停止，亦不是沒有重力或零軌道速度。&quot;,&quot;key_en&quot;:&quot;Geostationary means fixed relative to

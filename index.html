 the rotating ground, not motionless in space.&quot;,&quot;source_pages&quot;:[24,25,26],&quot;source_note&quot;:&quot;Lecture 8 PDF 24,25,26; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-021&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Signal travel distance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;For an ideal GPS signal path, take c=300,000 km/s and travel time 0.080 s. What path length is obtained?&quot;,&quot;options&quot;:[&quot;240 km&quot;,&quot;20,200 km automatically&quot;,&quot;3,750,000 km&quot;,&quot;24,000 km&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;按d＝ct，300000乘0.080＝24000km。這是指定訊號路徑的理想估算，不會因GPS典型高度20200km就把所有傳播距離都設為同一高度；幾何位置仍重要。&quot;,&quot;key_en&quot;:&quot;Signal path length is speed multiplied by travel time.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 8 PDF 27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-022&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Timing error and range&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;At c=300,000 km/s, what ideal range error corresponds to a timing error of 1 microsecond?&quot;,&quot;options&quot;:[&quot;0.3 m&quot;,&quot;3,000,000 m&quot;,&quot;300 m&quot;,&quot;300 km&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;1微秒為10^-6秒，乘300000km/s得0.3km，即300m。這是理想測距誤差，不等於最終定位誤差一定剛好300m，定位還受衛星幾何等因素影響。&quot;,&quot;key_en&quot;:&quot;Small timing errors can produce substantial range errors at light speed.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 8 PDF 27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-023&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;GPS one-way signals&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A phone receives ordinary GPS positioning signals. Which description is most accurate?&quot;,&quot;options&quot;:[&quot;One satellite always determines all position coordinates and clock error alone&quot;,&quot;Internet map downloads and satellite positioning are exactly the same service&quot;,&quot;The phone must first send its location to every GPS satellite&quot;,&quot;Satellites broadcast timing and orbit information that the receiver uses to estimate position&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;普通GPS接收器利用衛星廣播的時間及軌道資料，並不先向每顆衛星上傳位置。下載地圖或即時交通可用網絡，但屬另一項服務；測時與位置求解亦需多個訊號及條件。&quot;,&quot;key_en&quot;:&quot;Ordinary GPS positioning relies on satellite broadcasts received by the device.&quot;,&quot;source_pages&quot;:[27],&quot;source_note&quot;:&quot;Lecture 8 PDF 27; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-024&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Hubble wavelength limits&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Because Hubble is in space, a learner claims it detects every electromagnetic wavelength. What is the best correction?&quot;,&quot;options&quot;:[&quot;Hubble only measures audible sound&quot;,&quot;Every space telescope must detect all wavelengths&quot;,&quot;Ground-based telescopes have no scientific use&quot;,&quot;Its instruments observe particular bands, including ultraviolet, visible and some near-infrared&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;離開大氣可避開部分吸收、雲層與擾動，但儀器仍有波段範圍。Hubble觀測紫外、可見光及部分近紅外等，不能把太空位置當成所有波長都能偵測的保證。&quot;,&quot;key_en&quot;:&quot;A telescope’s location and instrument wavelength coverage are distinct issues.&quot;,&quot;source_pages&quot;:[47],&quot;source_note&quot;:&quot;Lecture 8 PDF 47; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-025&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Space-race chronology&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which sequence is chronologically correct?&quot;,&quot;options&quot;:[&quot;Gagarin → Apollo 11 → Sputnik 1 → Apollo–Soyuz&quot;,&quot;Sputnik 1 → Gagarin’s orbital flight → Apollo 11 landing → Apollo–Soyuz mission&quot;,&quot;Apollo–Soyuz → Gagarin → Sputnik 1 → Apollo 11&quot;,&quot;Apollo 11 → Sputnik 1 → Apollo–Soyuz → Gagarin&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;順序為Sputnik1在1957年、Gagarin在1961年、Apollo11在1969年、Apollo–Soyuz在1975年。先辨認事件，再分清協議、發射、到達及返回等里程碑，不只背一串年份。&quot;,&quot;key_en&quot;:&quot;Historical dates should be attached to the correct events and milestones.&quot;,&quot;source_pages&quot;:[17,18,20,21],&quot;source_note&quot;:&quot;Lecture 8 PDF 17,18,20,21; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-026&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Laika milestone&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;concept&quot;,&quot;stem&quot;:&quot;Which description of Laika’s 1957 milestone is appropriately precise?&quot;,&quot;options&quot;:[&quot;The first human to orbit Earth&quot;,&quot;The first animal to orbit Earth&quot;,&quot;The first living organism ever to leave the atmosphere&quot;,&quot;The first animal returned safely from the Moon&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;Laika的里程碑是第一隻進入地球軌道的動物，不能擴寫成所有意義上的第一隻上太空動物，更不是人類或安全月球返回任務。歷史題要留意first所限定的範圍。&quot;,&quot;key_en&quot;:&quot;Laika’s milestone concerns animal orbital flight, not every earlier form of space flight.&quot;,&quot;source_pages&quot;:[17],&quot;source_note&quot;:&quot;Lecture 8 PDF 17; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-027&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Agreement versus mission&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A learner dates the Apollo–Soyuz flight to 1972 because an agreement was signed then. What correction is needed?&quot;,&quot;options&quot;:[&quot;The mission was the first Apollo lunar landing&quot;,&quot;The agreement was in 1972, while the joint mission flew in 1975&quot;,&quot;Apollo–Soyuz occurred before Sputnik 1&quot;,&quot;An agreement and a successful flight are always the same event&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;1972是合作協議的重要年份，實際聯合飛行及會合在1975。規劃、協議和完成任務不是同一里程碑；閱讀資料時應看年份對應哪個具體行動。&quot;,&quot;key_en&quot;:&quot;An agreement date must not be substituted for the later mission date.&quot;,&quot;source_pages&quot;:[21],&quot;source_note&quot;:&quot;Lecture 8 PDF 21; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-028&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Reuse design and performance&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An old Space Shuttle slide mentions a 100-flight reuse goal. What can be concluded from that statement alone?&quot;,&quot;options&quot;:[&quot;Reusability guarantees low total cost&quot;,&quot;It describes a design goal, not proof that every shuttle flew 100 missions&quot;,&quot;Every shuttle certainly completed exactly 100 flights&quot;,&quot;Maintenance and refurbishment are unnecessary&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;設計或重用目標不能直接當成實際飛行紀錄。可重用亦仍涉及檢查、維修、翻修、可靠性及頻率等成本，不能只見reuse便推成每次必定便宜。&quot;,&quot;key_en&quot;:&quot;A reuse design goal is not an observed flight count or a cost guarantee.&quot;,&quot;source_pages&quot;:[28,29],&quot;source_note&quot;:&quot;Lecture 8 PDF 28,29; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-029&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Spinoffs and causal claims&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Someone argues that GPS is useful, so Apollo must have invented GPS directly and every space programme is cost-effective. What is the main problem?&quot;,&quot;options&quot;:[&quot;Neither the direct-invention claim nor the universal cost conclusion follows from one useful application&quot;,&quot;Any useful technology proves every project has benefits exceeding costs&quot;,&quot;Historical evidence is unnecessary when an application is popular&quot;,&quot;Space-related technologies can never benefit daily life&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;科技有太空背景，不會單獨證明由某一計劃直接發明；一項效益也不能代表所有任務收益高於成本。要查技術發展史、轉移證據、完整成本及替代方案。&quot;,&quot;key_en&quot;:&quot;A useful spinoff does not establish a specific invention history or justify every programme.&quot;,&quot;source_pages&quot;:[21,22,37],&quot;source_note&quot;:&quot;Lecture 8 PDF 21,22,37; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-030&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Shuttle accident phases&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Which comparison correctly distinguishes the two Shuttle accidents discussed in the lecture?&quot;,&quot;options&quot;:[&quot;Challenger and Columbia were names for the same single mission&quot;,&quot;Challenger failed during launch in 1986; Columbia broke up during re-entry in 2003&quot;,&quot;Columbia failed before Sputnik 1 was launched&quot;,&quot;Both accidents were Apollo lunar landings&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;兩宗事故分別涉及發射與再入階段，年份為1986及2003。辨認任務、載具及飛行階段比只把名稱記成太空悲劇更精確；兩者亦不是Apollo登月事故。&quot;,&quot;key_en&quot;:&quot;Different flight phases can involve different engineering risks.&quot;,&quot;source_pages&quot;:[29],&quot;source_note&quot;:&quot;Lecture 8 PDF 29; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-031&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Microgravity flame conditions&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two candle experiments are both in microgravity, but one uses a different imposed airflow. Must the flames have identical shapes?&quot;,&quot;options&quot;:[&quot;No; airflow and other experimental conditions can affect flame shape&quot;,&quot;Yes; every flame in microgravity has one fixed shape&quot;,&quot;No; this proves gravity has returned to Earth’s surface value&quot;,&quot;Yes; airflow cannot affect combustion&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;微重力減弱浮力對流，但形狀還受氣流、燃料及供氧等條件影響。不能把所有太空火焰一律視為同一球形；原頁左右圖條件未清楚，也不能直接宣布老師寫反。&quot;,&quot;key_en&quot;:&quot;Microgravity does not remove the influence of imposed flow on flame behaviour.&quot;,&quot;source_pages&quot;:[30],&quot;source_note&quot;:&quot;Lecture 8 PDF 30; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-032&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Space debris external effects&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A mission leaves fragments in a commonly used orbital region. Why is this more than a cost to that mission alone?&quot;,&quot;options&quot;:[&quot;Every fragment safely becomes drinking water&quot;,&quot;The debris can impose collision risks and management burdens on other operators&quot;,&quot;All fragments automatically become geostationary&quot;,&quot;Debris cannot interact with any later spacecraft&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;太空垃圾可把碰撞風險、追蹤及處理負擔留給其他使用者，涉及共享環境及責任。不能只計發射者本身的費用，就認定任務所有成本都已內部化。&quot;,&quot;key_en&quot;:&quot;Orbital debris can impose risks on other users of the shared environment.&quot;,&quot;source_pages&quot;:[36],&quot;source_note&quot;:&quot;Lecture 8 PDF 36; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-033&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Opportunity cost&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A government compares a space mission with spending on sanitation. Which approach best represents opportunity-cost analysis?&quot;,&quot;options&quot;:[&quot;Compare the benefits and sacrifices of feasible alternative uses of the same resources&quot;,&quot;Assume national pride makes every cost irrelevant&quot;,&quot;Judge only by which proposal has a more dramatic image&quot;,&quot;Assume scientific benefit has no possible public value&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;機會成本關注資源用於此方案後放棄的可行替代用途，需比較公共效益、風險、成本及分配。單靠光榮或貧窮口號，都未完成有證據和價值理由的分析。&quot;,&quot;key_en&quot;:&quot;Opportunity cost concerns the value of the best feasible alternative forgone.&quot;,&quot;source_pages&quot;:[36,37],&quot;source_note&quot;:&quot;Lecture 8 PDF 36,37; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-034&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Mission type&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A vehicle moves across a planetary surface to inspect several sites. Which mission type best describes it?&quot;,&quot;options&quot;:[&quot;Flyby only&quot;,&quot;Geostationary communications satellite&quot;,&quot;Rover&quot;,&quot;Orbiter only&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;Rover可在表面移動，與只繞行的orbiter、一次經過的flyby及固定著陸器不同。應按任務實際功能分類，而不是只因全部無人就把名稱當成一樣。&quot;,&quot;key_en&quot;:&quot;Mission types are distinguished by what they do and where they operate.&quot;,&quot;source_pages&quot;:[38,42,43],&quot;source_note&quot;:&quot;Lecture 8 PDF 38,42,43; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-035&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Plans and verified outcomes&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An old slide lists Chang’e 5 sample return as a plan for 2017. Which statement correctly updates the milestone discussed in the notes?&quot;,&quot;options&quot;:[&quot;The 2017 plan proves the samples returned then&quot;,&quot;Chang’e 5 was an Earth-weather-only project&quot;,&quot;The lunar samples were returned in 2020; the planned date is not the completed-event date&quot;,&quot;No distinction is needed between planning and completion&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;嫦娥五號於2020年完成月球樣本返回；原頁2017反映舊規劃。不能把預定年份直接當成成功成果，也不能只將舊計劃年份向後推便當作核實。&quot;,&quot;key_en&quot;:&quot;A historical plan and a verified mission outcome are different kinds of evidence.&quot;,&quot;source_pages&quot;:[42],&quot;source_note&quot;:&quot;Lecture 8 PDF 42; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-036&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Interstellar boundary&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A Voyager probe crosses the heliopause. What is the safest interpretation?&quot;,&quot;options&quot;:[&quot;It became a geostationary satellite&quot;,&quot;It instantly left the Universe&quot;,&quot;All gravitational influence from the Sun necessarily became exactly zero&quot;,&quot;It crossed an important solar-wind boundary, not necessarily every definition of the entire Solar System&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;日球層頂是太陽風與周圍介質的邊界，與太陽系所有可能邊界不是同一概念。進入星際介質不能推成離開整個宇宙或太陽引力忽然完全消失。&quot;,&quot;key_en&quot;:&quot;Crossing the heliopause should not be equated with crossing every Solar-System boundary.&quot;,&quot;source_pages&quot;:[38,40],&quot;source_note&quot;:&quot;Lecture 8 PDF 38,40; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-037&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Habitable versus inhabited&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An Earth-sized planet lies in a star’s habitable zone. What does that establish by itself?&quot;,&quot;options&quot;:[&quot;An atmosphere identical to Earth’s&quot;,&quot;A useful candidate for further habitability study, not confirmed life or surface liquid water&quot;,&quot;A guarantee that unprotected humans can live there&quot;,&quot;Confirmed intelligent inhabitants&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;宜居帶與地球大小只是部分條件，還需大氣、壓力、溫度及其他資料；宜居不等於已有生命，更不代表人能直接入住。候選環境、潛在條件及確證是不同層次。&quot;,&quot;key_en&quot;:&quot;Earth size and a habitable-zone location are not sufficient evidence of life.&quot;,&quot;source_pages&quot;:[50,51],&quot;source_note&quot;:&quot;Lecture 8 PDF 50,51; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-038&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Fermi question and evidence&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A student says that because no confirmed extraterrestrial civilisation has been detected, none can exist. What is the strongest correction?&quot;,&quot;options&quot;:[&quot;Every proposed alien story is therefore confirmed&quot;,&quot;The number of stars proves a specific civilisation exists&quot;,&quot;Non-detection must be interpreted with search limits and does not by itself prove nonexistence&quot;,&quot;Scientific questions about detection never require observations&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;未找到確定證據，要連到搜尋範圍、時間、距離及可探測性解讀，不能直接推成不存在。反過來，星體很多或某個猜想吸引，也不是已證實有特定文明。&quot;,&quot;key_en&quot;:&quot;Absence of a detection is not automatically proof of universal absence.&quot;,&quot;source_pages&quot;:[41,50,53],&quot;source_note&quot;:&quot;Lecture 8 PDF 41,50,53; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-039&quot;},{&quot;lecture&quot;:8,&quot;topic&quot;:&quot;Flags and national appropriation&quot;,&quot;priority&quot;:&quot;practice&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Using the Outer Space Treaty principle discussed in the notes, does planting a national flag on the Moon automatically establish national sovereignty over the surrounding territory?&quot;,&quot;options&quot;:[&quot;Yes; any scientific visit necessarily establishes national territory&quot;,&quot;Yes; the flag transfers the entire Moon to that country&quot;,&quot;No; a flag does not itself create national ownership of lunar territory&quot;,&quot;No; therefore every possible resource activity is already covered by one simple blanket rule&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;課堂條約原則禁止以國家主權等方式佔有外太空天體，插旗不會自動取得領土。領土佔有與資源活動如何規管是不同問題；不能由此一句推出所有採礦活動一律相同處理。&quot;,&quot;key_en&quot;:&quot;National appropriation and the regulation of resource activities are distinct issues.&quot;,&quot;source_pages&quot;:[49],&quot;source_note&quot;:&quot;Lecture 8 PDF 49; interpret with the existing study-guide corrections.&quot;,&quot;id&quot;:&quot;L8-040&quot;},{&quot;id&quot;:&quot;H1-01&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Independent and dependent variables&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;To study whether airflow changes drying speed, a pupil sets a fan to low or high and records the time until each wet cloth first reaches 20 g. Each cloth has the same initial wet mass, fabric and distance from the fan. Which assignment of variables is correct?&quot;,&quot;options&quot;:[&quot;IV: airflow setting. DV: mass at 20 g. Controls: time and cloth fabric.&quot;,&quot;IV: airflow setting. DV: time to reach 20 g. Controls: fabric, initial wet mass and distance.&quot;,&quot;IV: duration. DV: the selected fan setting. Controls: distance and target mass.&quot;,&quot;IV: the target mass. DV: drying time. Controls: fan setting and cloth fabric.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;風扇設定係研究者刻意改嘅 IV。20 g 係用來定義終點嘅門檻，所有布都一樣。真正量到而會隨條件改變嘅數據係到門檻所需時間，所以質量唔係本題 DV。&quot;,&quot;key_en&quot;:&quot;A fixed measurement threshold defines the endpoint. Time to reach it is the outcome.&quot;,&quot;source_pages&quot;:[6,8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8, 9&quot;},{&quot;id&quot;:&quot;H1-02&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Unit of assignment&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A study compares two reading methods. One class of 50 pupils receives Method X, another class of 50 Method Y. The classes have different teachers. The tests are identical. Which redesign best addresses the ambiguity about the effect of the method?&quot;,&quot;options&quot;:[&quot;Include more test questions while keeping the teacher and method linked.&quot;,&quot;Treat all 100 pupils as independently assigned because each has an individual score.&quot;,&quot;Swap methods and teachers together in a second term while keeping each teacher with the same method.&quot;,&quot;Randomly assign several comparable classes per method and ensure that comparable teaching staff deliver both methods.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;原設計一個老師／班只配一種教法，老師、班級與教法綁在一起。學生分開有分數，並唔等於教法獨立分配咗 100 次。跨多班隨機分配兼避免老師只對應單一方法，先能減低原本嘅混淆。&quot;,&quot;key_en&quot;:&quot;Individual scores do not remove confounding when the intervention is assigned by class.&quot;,&quot;source_pages&quot;:[8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 8, 9&quot;},{&quot;id&quot;:&quot;H1-03&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Hypothesis and prediction&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A pupil notices that ice survives longer in cups wrapped with felt. If the proposed explanation is that felt slows transfer of heat from the room, which statement is the strongest prediction for a new fair trial?&quot;,&quot;options&quot;:[&quot;With identical cups and starting temperatures, the felt-covered water will warm less over the next ten minutes than the uncovered water.&quot;,&quot;Felt slows heat transfer from the room to the cup.&quot;,&quot;In the previous test, there was more ice left in the felt-covered cup.&quot;,&quot;A felt cover is a practical way to keep a drink cold in any situation.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;假設已經係「felt 減慢熱傳遞」。A 由假設推出新測試中應量到嘅方向、比較組同時間。B 只重複解釋，C 係之前嘅觀察，D 由一次例子跳到所有情況。&quot;,&quot;key_en&quot;:&quot;A prediction specifies a measurable result expected in a defined future test.&quot;,&quot;source_pages&quot;:[5,6,7],&quot;source_note&quot;:&quot;Lecture 1 PDF 5, 6, 7&quot;},{&quot;id&quot;:&quot;H1-04&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Two variables and a conditional effect&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Four groups try two reading methods at two practice durations. The average scores are X with 10 min: 61, Y with 10 min: 65, X with 20 min: 70, and Y with 20 min: 80. Which comparison best answers whether the observed advantage of Y over X changes with duration?&quot;,&quot;options&quot;:[&quot;80 − 61 = 19, so the method advantage grows by 19 points.&quot;,&quot;80 − 65 = 15, so the Y-over-X advantage grows by 15 points.&quot;,&quot;(80 − 70) − (65 − 61) = 6, so the observed advantage is 6 points greater at 20 min.&quot;,&quot;(80 + 65)/2 − (70 + 61)/2 = 7, so the observed advantage grows by 7 points.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;固定時間，先比同一條件下嘅教法差：10 分鐘 +4，20 分鐘 +10，再減得 +6。19 分混埋方法同時間，15 分只係 Y 嘅時間差，7 分係合併平均方法差，三者都答唔到「優勢增加幾多」。只有均值仍未顯示不確定度。&quot;,&quot;key_en&quot;:&quot;Compare Y with X within each duration, then compare the two differences.&quot;,&quot;source_pages&quot;:[6,8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8, 9&quot;},{&quot;id&quot;:&quot;H1-05&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Measurement bias&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A school randomly assigns pupils to two practice apps, gives the same test, and replaces each pupil&#x27;s name with a code. The scorer can still decode which app was used before marking open-ended answers. Which change most directly reduces the remaining risk in scoring?&quot;,&quot;options&quot;:[&quot;Have the scorer randomize the test order after reading the app codes.&quot;,&quot;Use a fixed scoring rubric and hide app assignment from the scorer until scores are recorded.&quot;,&quot;Recruit equal numbers of pupils from each year group while leaving app assignment visible to the scorer.&quot;,&quot;Give a second test and let the scorer choose which test to score after checking the app codes.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;隨機分組處理組間差異，遮名處理身份，但評分員仍知條件，主觀評分可能受期待影響。統一 rubric 加真正遮蔽條件先處理測量偏差。改順序或年級人數唔會消除呢條偏差途徑。&quot;,&quot;key_en&quot;:&quot;Blind assessors to group assignment when subjective scoring can be influenced by expectations.&quot;,&quot;source_pages&quot;:[6,8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8, 9&quot;},{&quot;id&quot;:&quot;H1-06&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Non-detection and test sensitivity&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A hypothesis predicts that a small magnet will move a block by 2 mm in a specified setup. The camera software can only register movements of at least 5 mm, and it records none. What does the observation establish?&quot;,&quot;options&quot;:[&quot;It directly falsifies the 2 mm prediction because the observed movement is exactly zero.&quot;,&quot;It confirms the 2 mm prediction because movements smaller than 5 mm are expected.&quot;,&quot;It rules out movements of 2 mm or more but leaves smaller movements possible.&quot;,&quot;The test did not detect movement at its threshold. A more sensitive measurement is needed to assess the 2 mm prediction.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;預測係 2 mm，儀器偵測門檻係 5 mm。讀不到可能真係無動，也可能移動咗 2 mm，所以既未反駁、亦未確認。試驗要有能力分辨預測範圍，先可以用結果裁決。&quot;,&quot;key_en&quot;:&quot;A test that cannot resolve the predicted effect gives weak evidence about that effect.&quot;,&quot;source_pages&quot;:[5,7,10],&quot;source_note&quot;:&quot;Lecture 1 PDF 5, 7, 10&quot;},{&quot;id&quot;:&quot;H1-07&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Outcome versus explanatory mechanism&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Seed trays are randomly assigned to cover A or cover B. A increases germination under the tested conditions. The report claims A works by keeping the soil warmer, but soil temperature was not measured. Which follow-up most directly tests the proposed explanation?&quot;,&quot;options&quot;:[&quot;Measure soil temperature and independently vary it while controlling the cover comparison and other conditions.&quot;,&quot;Repeat the cover comparison with more trays but record germination alone.&quot;,&quot;Ask the person who designed cover A whether it was intended to retain heat.&quot;,&quot;Measure air temperature in the room after removing all trays and covers.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;隨機比較可以支持罩子同發芽率有關，但未量住土壤溫度呢個中介。要記錄土溫，再獨立操控溫度和罩子，先分到暖土是否解釋差異。單靠增加樣本仍只量到結果，意圖亦唔係機制證據。&quot;,&quot;key_en&quot;:&quot;Evidence for an outcome does not establish the mechanism that produced it.&quot;,&quot;source_pages&quot;:[6,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 9&quot;},{&quot;id&quot;:&quot;H1-08&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Scientific method with pilot data&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A pilot with 12 students measures recall at 5, 15 and 30 minutes. The team notices that the biggest X–Y difference is at 15 minutes. Which plan gives the most defensible test of whether that difference repeats?&quot;,&quot;options&quot;:[&quot;Use the same pilot scores and now label 15 minutes the original primary outcome.&quot;,&quot;Use all three times in a new study and report whichever result is largest without disclosing the selection.&quot;,&quot;State that the pilot suggested 15 minutes, name it as the primary outcome for a new independent study, and report how the test was specified.&quot;,&quot;Discard the pilot and base the new outcome only on which condition the teacher thinks should win.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;先導研究可以幫揀主指標。最有說服力係誠實講 15 分鐘由 pilot 提出，並用新樣本、事前定義重做。事後從同一批挑最大差，再扮成預先測試，容易把噪音當效果。&quot;,&quot;key_en&quot;:&quot;Use pilot results to plan an independent test, and make the selection transparent.&quot;,&quot;source_pages&quot;:[6,8,9],&quot;source_note&quot;:&quot;Lecture 1 PDF 6, 8, 9&quot;},{&quot;id&quot;:&quot;H1-09&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Ancient inventions and physical evidence&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A curator finds two printing tools. Tool X has a full page of characters carved into one slab. Tool Y consists of many separable characters, which the printer can rearrange. Which statement matches the physical evidence and the lecture&#x27;s two Chinese-innovation pages?&quot;,&quot;options&quot;:[&quot;Both are movable-type printing because both transfer ink.&quot;,&quot;X fits the highlighted block-printing example on p15. Y fits the movable-type extension on p16.&quot;,&quot;X fits the movable-type extension on p16. Y fits the highlighted block-printing example on p15.&quot;,&quot;X and Y cannot be distinguished without knowing what paper the printers used.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;整頁雕在一整塊版就係雕版；單粒字可以重排就係活字。兩個都印墨、都可能用紙，但分類關鍵係字模結構。p15 標黃係 block printing，p16 另列 movable type。&quot;,&quot;key_en&quot;:&quot;A single carved page is block printing. Separate rearrangeable characters are movable type.&quot;,&quot;source_pages&quot;:[15,16],&quot;source_note&quot;:&quot;Lecture 1 PDF 15, 16&quot;},{&quot;id&quot;:&quot;H1-10&quot;,&quot;lecture&quot;:1,&quot;topic&quot;:&quot;Conclusion after a conflicting result&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A simple model predicts that doubling the load doubles a strip&#x27;s extension. This holds with small loads, but well-calibrated repeats show a smaller-than-double extension at high loads. Which conclusion best fits the evidence?&quot;,&quot;options&quot;:[&quot;The model must be correct at high loads because it worked at small loads.&quot;,&quot;The high-load tests show the model never described even the small-load data.&quot;,&quot;There is no reason to change the model unless every possible load has been tested.&quot;,&quot;The proportional model works in the measured small-load range. The repeatable high-load result limits its range and motivates a revised model.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;可靠反例足以挑戰「所有負載都成比例」呢個廣泛預測，唔需要試盡每個值。同時細負載資料仍同原模型吻合。合理結論要指明適用範圍，再提修訂方向。&quot;,&quot;key_en&quot;:&quot;A genuine counterexample can narrow a model&#x27;s range without erasing its validated uses.&quot;,&quot;source_pages&quot;:[5,6,10],&quot;source_note&quot;:&quot;Lecture 1 PDF 5, 6, 10&quot;},{&quot;id&quot;:&quot;H2-01&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;World view inquiry and enterprise&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A team assumes that a recurring puddle pattern has an explanation, compares it across slopes and surfaces, and releases its method for another school to scrutinize. In order, which aspects of science do those three actions illustrate most directly?&quot;,&quot;options&quot;:[&quot;World view, inquiry, enterprise.&quot;,&quot;Enterprise, world view, inquiry.&quot;,&quot;Inquiry, enterprise, world view.&quot;,&quot;World view, enterprise, inquiry.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;相信現象有可研究規律係 worldview。實際改變條件並比較資料係 inquiry。開放方法畀另一隊核查係科學群體嘅 enterprise。題目逐項配對，所以三項都有關並唔代表任意排列都得。&quot;,&quot;key_en&quot;:&quot;World view frames inquiry, inquiry tests explanations, and enterprise enables collective scrutiny.&quot;,&quot;source_pages&quot;:[5,6,11,13],&quot;source_note&quot;:&quot;Lecture 2 PDF 5, 6, 11, 13&quot;},{&quot;id&quot;:&quot;H2-02&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Empirical information versus value judgement&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A transport trial estimates that a plan saves 2 minutes per trip for 800 riders and adds 12 minutes per trip for 100 riders. The council says delays of more than 10 minutes to any group should be avoided even if total travel time falls. What is the best classification?&quot;,&quot;options&quot;:[&quot;The council&#x27;s limit is an empirical result because it contains a number.&quot;,&quot;The estimated travel times are values because they refer to people&#x27;s experiences.&quot;,&quot;The estimated changes are empirical information. Giving priority to a maximum loss for any group is a value judgement.&quot;,&quot;All the statements are empirical because a vote can test whether the council supports the rule.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;交通測試所得時間係經驗證據，按每人一程計，總時間估計少 400 分鐘。即使如此，是否優先保障任何群體唔多過 10 分鐘損失係價值取捨。用數字表達規則並唔等於測得規則係公平。&quot;,&quot;key_en&quot;:&quot;A measurable consequence can inform a decision. A fairness threshold expresses what ought to matter.&quot;,&quot;source_pages&quot;:[3,6,21,22],&quot;source_note&quot;:&quot;Lecture 2 PDF 3, 6, 21, 22&quot;},{&quot;id&quot;:&quot;H2-03&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Conflicting indicators and measurement windows&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;One sensor shows a classroom is usually quiet using the median sound level for a lesson. A second shows that noise is severe using the loudest one-second peak. Both sensors are calibrated. Which approach best evaluates the apparent disagreement?&quot;,&quot;options&quot;:[&quot;Average the median and the maximum to find the single correct sound value.&quot;,&quot;Compare matched measurements over the same time window, and decide whether the question is about typical conditions or brief peaks.&quot;,&quot;Keep only the peak because the larger reading represents the lesson more accurately.&quot;,&quot;Discard both datasets because calibrated instruments should return the same summary.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;典型音量低，同一堂中間曾有短高峰，可以同時成立。median 同 maximum 回答唔同問題。對齊時間窗、指標同用途，先知道係真矛盾定係定義唔同；將兩種統計量平均唔能解決問題。&quot;,&quot;key_en&quot;:&quot;Different statistics can describe the same observations without contradiction.&quot;,&quot;source_pages&quot;:[10,11,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 10, 11, 16&quot;},{&quot;id&quot;:&quot;H2-04&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Comparable units and system boundaries&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Food A produces 0.36 kg of emissions per 0.60 kg of edible product in a farm-to-shop estimate. Food B produces 0.35 kg per 0.50 kg of edible product in the same boundary. What follows?&quot;,&quot;options&quot;:[&quot;B is lower because its package produces 0.35 kg rather than 0.36 kg.&quot;,&quot;A is lower under every possible boundary because its package has more edible food.&quot;,&quot;The products tie because the packages differ in size.&quot;,&quot;A is lower within the stated boundary at 0.60 versus 0.70 kg per edible kg. Other boundaries need other data.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;同一功能單位先比較：A 0.36÷0.60＝0.60，B 0.35÷0.50＝0.70。若只睇每包總量會揀反。結論受 farm-to-shop 界線限制，未計入後續處理就唔好擴張範圍。&quot;,&quot;key_en&quot;:&quot;Normalize to the same functional unit and keep the system boundary consistent.&quot;,&quot;source_pages&quot;:[11,12],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 12&quot;},{&quot;id&quot;:&quot;H2-05&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Constraints versus preferences&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A design brief requires a filter to remove at least 90% of particles and cost no more than 50 units. Among compliant designs, choose the one with the lowest cost. Measured removal and cost are W: 98%, 65; X: 89%, 30; Y: 92%, 46; Z: 96%, 49. Which choice follows from the brief?&quot;,&quot;options&quot;:[&quot;Y because it meets both requirements and costs less than the other compliant design.&quot;,&quot;Z because it removes more particles than Y and still fits the budget.&quot;,&quot;X because it is the cheapest of the four.&quot;,&quot;W because it performs best on removal, the primary function.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;先排除違反硬限制嘅 W（超預算）同 X（未到 90%），剩 Y、Z。比較準則係最低成本，所以揀 46 嘅 Y。Z 嘅去除率較高係真，但唔係本題合格後嘅選擇準則。&quot;,&quot;key_en&quot;:&quot;Apply hard constraints before ranking the designs by the stated preference.&quot;,&quot;source_pages&quot;:[18,20,22],&quot;source_note&quot;:&quot;Lecture 2 PDF 18, 20, 22&quot;},{&quot;id&quot;:&quot;H2-06&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Peer review and independent evidence&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A peer-reviewed paper shows that a measurement tool works in a quiet laboratory. A second team tests it on a noisy building site and finds lower accuracy. The manufacturer says peer review settles the disagreement. Which assessment is best?&quot;,&quot;options&quot;:[&quot;Discard the laboratory result because a field study always overrides it.&quot;,&quot;Take the average of the two accuracies and apply it to all environments.&quot;,&quot;Check whether noise, procedure or population differs. More tests in both settings can establish where each estimate applies.&quot;,&quot;Accept the original accuracy everywhere because specialists reviewed it before publication.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;兩個地方條件唔同，兩個數字可能都真。同行評議唔會驗證所有使用環境。對齊程序、固定其他條件、改噪音重測，將可信結論限制在受測範圍。&quot;,&quot;key_en&quot;:&quot;Review and replication answer different questions. Replication across conditions can establish scope.&quot;,&quot;source_pages&quot;:[11,13,14,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 11, 13, 14, 16&quot;},{&quot;id&quot;:&quot;H2-07&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Reading a cited source&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An AI-generated teaching plan says hybrid lessons cause higher retention in secondary pupils and cites a real paper. The paper compared adult volunteers who chose their own learning formats and measured course satisfaction. What should the student infer?&quot;,&quot;options&quot;:[&quot;The paper proves the claim because it is real and both studies concern teaching modes.&quot;,&quot;The only mismatch is age. Changing the participants in the plan to adults would establish causation.&quot;,&quot;The study proves hybrid classes harm retention because the cited result was about a different outcome.&quot;,&quot;The paper cannot directly support that causal claim because assignment, age and the measured outcome differ.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;真文獻唔一定支持 AI 引述。自選教法未排除混淆，成人未必代表中學生，滿意度唔係學習保留。B 只修正年齡仍未處理研究設計同 DV，C 由不相干證據反向斷言。&quot;,&quot;key_en&quot;:&quot;Verify the population, design and outcome before treating a real citation as support.&quot;,&quot;source_pages&quot;:[14,24,25],&quot;source_note&quot;:&quot;Lecture 2 PDF 14, 24, 25&quot;},{&quot;id&quot;:&quot;H2-08&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Durability with revision&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two mapping models agree within ordinary city distances. For longer routes, new independent measurements repeatedly support only Model B. Model A is simpler to use. Which decision best illustrates both durable and revisable scientific knowledge?&quot;,&quot;options&quot;:[&quot;Stop using Model A at any distance because its accuracy failed somewhere.&quot;,&quot;Keep Model A for the range where its error meets requirements, and use Model B for longer routes supported by the new evidence.&quot;,&quot;Keep Model A everywhere because long use makes it more dependable than recent measurements.&quot;,&quot;Say both models are equally well supported at every distance because they agree for short routes.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;已受檢驗嘅短距離範圍可以繼續用 A，體現 durable。長距離有獨立新證據支持 B，就按條件修訂做法。簡單只係使用方便，唔可以蓋過有區分力嘅觀察。&quot;,&quot;key_en&quot;:&quot;Retain validated applications while revising the model or its domain in light of new evidence.&quot;,&quot;source_pages&quot;:[6,8,9,16],&quot;source_note&quot;:&quot;Lecture 2 PDF 6, 8, 9, 16&quot;},{&quot;id&quot;:&quot;H2-09&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Side effect versus failure&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A hallway lighting controller is designed to switch the lights on when someone enters. Case I: it switches on as specified, but reflected glare distracts the next classroom. Case II: a faulty sensor leaves the hall dark when someone enters. Which comparison is best?&quot;,&quot;options&quot;:[&quot;I is an unintended side effect of normal operation. II is a failure to perform the intended function.&quot;,&quot;Both are failures of the switch-on function because the consequences are unwanted.&quot;,&quot;I is a sensor failure, and II is a side effect of a successful switching decision.&quot;,&quot;Both are design constraints because neither occurred during development.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;I 嘅開燈功能運作正常，反光就係正常操作伴隨嘅非預期影響。II 入人時無開燈，直接未達指定功能。要問「達到主要要求未」，唔係單靠結果有冇人鍾意來分類。&quot;,&quot;key_en&quot;:&quot;Separate a side effect of successful operation from failure to perform the specified function.&quot;,&quot;source_pages&quot;:[17,20,21],&quot;source_note&quot;:&quot;Lecture 2 PDF 17, 20, 21&quot;},{&quot;id&quot;:&quot;H2-10&quot;,&quot;lecture&quot;:2,&quot;topic&quot;:&quot;Scientific evidence and a policy tradeoff&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An experiment estimates that streetlights at setting A reduce energy use more, while setting B improves pedestrian visibility more. The measurements are precise. What further information is needed to decide which setting the city should adopt?&quot;,&quot;options&quot;:[&quot;No further information, since precise measurements make the better value self-evident.&quot;,&quot;The rank of the researcher who made the estimate, because the more senior researcher can resolve the tradeoff.&quot;,&quot;A decision criterion on acceptable energy and safety tradeoffs, informed by the size and distribution of the measured effects.&quot;,&quot;A survey about which setting people prefer, which would remove the need to consider measured impacts.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;能源同可見度嘅估計係 empirical。選邊個仍要討論安全底線、能源重要性、誰承受影響，數據愈準都唔會自行定出價值準則。意見調查有用，但唔應取代實測後果。&quot;,&quot;key_en&quot;:&quot;Increasing measurement precision cannot by itself determine how competing goals should be weighted.&quot;,&quot;source_pages&quot;:[3,6,21],&quot;source_note&quot;:&quot;Lecture 2 PDF 3, 6, 21&quot;},{&quot;id&quot;:&quot;H3-01&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Placebo contrasts&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a hypothetical randomized trial, 40% improve with no activity, 55% with an inert activity under neutral instructions, and 67% with the identical activity under encouraging instructions. Which observed contrast most directly targets the effect of the encouraging instructions?&quot;,&quot;options&quot;:[&quot;27 percentage points, comparing encouraging instructions with no activity.&quot;,&quot;15 percentage points, comparing neutral instructions with no activity.&quot;,&quot;67 percentage points, because every improver in the encouraging group experienced an expectation effect.&quot;,&quot;12 percentage points, comparing encouraging and neutral instructions with the activity held constant.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;只想分離鼓勵訊息，就要固定活動，67%−55%＝12 個百分點。對無活動嘅 27 點同時改咗活動和訊息。鼓勵組所有改善亦包含自然變化等，不能逐個歸因期待。&quot;,&quot;key_en&quot;:&quot;To target an instruction effect, compare different instructions with the activity held constant.&quot;,&quot;source_pages&quot;:[15,17,18,19],&quot;source_note&quot;:&quot;Lecture 3 PDF 15, 17, 18, 19&quot;},{&quot;id&quot;:&quot;H3-02&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Nocebo versus ingredient effect&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a simulation, participants randomly receive an inert or active sample and either a neutral or a warning script. Reported discomfort is 8% for inert-neutral, 21% for inert-warning, 18% for active-neutral, and 31% for active-warning. Which reading is best?&quot;,&quot;options&quot;:[&quot;The warning contrast is +13 percentage points at each sample level. This is compatible with a nocebo contribution, with another difference associated with the active sample.&quot;,&quot;All 31% in active-warning experienced a nocebo effect because they were warned.&quot;,&quot;The nocebo contrast is 23 percentage points because 31% − 8% isolates the warning.&quot;,&quot;The inert-warning and active-neutral comparison isolates the active sample effect because one group has a larger rate.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;固定樣本先比訊息：21−8＝13，31−18＝13。固定訊息再比樣本就各 +10 點。31−8 同時換兩個因素，唔能單獨歸因。組間差可支持某因素整體貢獻，唔代表知道每人不適嘅成因。&quot;,&quot;key_en&quot;:&quot;A warning contrast controls sample type. A sample contrast controls the warning condition.&quot;,&quot;source_pages&quot;:[17,18,20],&quot;source_note&quot;:&quot;Lecture 3 PDF 17, 18, 20&quot;},{&quot;id&quot;:&quot;H3-03&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Crystal reading and equivalence&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A new mock trial compares two objects. Improvement is observed in 23 of 40 participants with genuine crystal and 22 of 40 with an imitation. Both teams receive comparable instructions. A promoter says the trial proves the two objects are exactly equivalent. What is the best reply?&quot;,&quot;options&quot;:[&quot;The genuine object is proven effective because its group has one more improver.&quot;,&quot;The imitation effect must be entirely expectation-related because the item contains no genuine crystal.&quot;,&quot;The observed difference is 2.5 percentage points. Practical equivalence needs uncertainty estimates and a pre-specified acceptable difference.&quot;,&quot;Since both groups improved, the crystal-specific effect equals the genuine group&#x27;s full improvement rate.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;23÷40＝57.5%，22÷40＝55%，差 2.5 個百分點。差距細唔足以證明完全冇差，要睇精度同事先定義乜嘢差異可接受。只比較兩件物件亦唔能把每一個人嘅改善分到期待或自然變化。&quot;,&quot;key_en&quot;:&quot;A small observed group difference does not establish equivalence without precision and a defined margin.&quot;,&quot;source_pages&quot;:[15,17,18],&quot;source_note&quot;:&quot;Lecture 3 PDF 15, 17, 18&quot;},{&quot;id&quot;:&quot;H3-04&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Occam and a discriminating test&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two accounts explain why a lamp sometimes flickers. A assumes one unstable switch. B assumes two separate faults. A predicts flicker will disappear completely after the switch is replaced. In repeated controlled trials one kind of flicker disappears while a second kind persists exactly when B predicts. What is the most defensible interpretation?&quot;,&quot;options&quot;:[&quot;Keep A because Occam&#x27;s razor always prefers a single fault.&quot;,&quot;The new results discriminate between the accounts, so B may now be preferred even though it needs two faults.&quot;,&quot;Choose neither because Occam&#x27;s razor requires ignoring every explanation that makes different predictions.&quot;,&quot;The persistence alone establishes the unique identity of both faults without further tests.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;兩個說法唔再同樣解釋新證據，簡約唔足以拯救 A。新結果貼近 B 預測，合理暫時偏向 B，仍可查兩個故障嘅具體機制。Occam 係在其他條件相近下減多餘假設。&quot;,&quot;key_en&quot;:&quot;Evidence that differentiates predictions can favor a more complex explanation.&quot;,&quot;source_pages&quot;:[21,22,23,24],&quot;source_note&quot;:&quot;Lecture 3 PDF 21, 22, 23, 24&quot;},{&quot;id&quot;:&quot;H3-05&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Energy accounting&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;During a short demonstration a device delivers 48 J of useful work and releases 12 J as heat. Its stored energy decreases by 20 J. Assuming there are no other energy changes, how much net energy must enter the system during the demonstration?&quot;,&quot;options&quot;:[&quot;0 J because the demonstration did not burn fuel.&quot;,&quot;28 J because only useful work and storage count.&quot;,&quot;60 J because all measured output must come directly from external input.&quot;,&quot;40 J because total output is 60 J and storage supplied 20 J.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;輸出包括做功 48 J 同熱 12 J，共 60 J。裝置內儲能少咗 20 J，已經供應部分輸出，所以外來淨輸入係 60−20＝40 J。只計有用功會漏熱；不燃燒亦唔等於無輸入。&quot;,&quot;key_en&quot;:&quot;Net input equals useful work plus heat output minus the decrease in stored energy here.&quot;,&quot;source_pages&quot;:[8,9,10,11],&quot;source_note&quot;:&quot;Lecture 3 PDF 8, 9, 10, 11&quot;},{&quot;id&quot;:&quot;H3-06&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Predictive success and base rate&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;An astrologer predicts an event will occur for every one of 100 clients. The event occurs for 88 of them. A baseline rule that predicts the event for everyone makes the same choices. Which metric would best test whether a revised astrology method provides useful individual predictions?&quot;,&quot;options&quot;:[&quot;Compare its pre-specified predictions on new clients against the baseline, reporting performance both when the event occurs and when it does not.&quot;,&quot;Check whether its raw accuracy on the same clients can be made higher by reclassifying ambiguous outcomes.&quot;,&quot;Compare the original 88% with 50%, because two possible outcomes always make 50% the fair baseline.&quot;,&quot;Count only successes for clients whose charts produced a prediction with high confidence.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;88% 同永遠講「會發生」完全一樣，未見個人化預測有額外價值。兩結果唔代表各佔一半，50% 唔係自然基準。用新樣本、事前規則同兩類表現，先見到有冇真正區分能力。&quot;,&quot;key_en&quot;:&quot;Compare with a meaningful base-rate benchmark on new data and report both kinds of outcome.&quot;,&quot;source_pages&quot;:[13,17],&quot;source_note&quot;:&quot;Lecture 3 PDF 13, 17&quot;},{&quot;id&quot;:&quot;H3-07&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Data omissions and reporting bias&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A company photographs 50 treated and 50 untreated samples with a standard method. It publishes the six most attractive treated images and the six least attractive untreated images and claims the treatment changes the usual appearance. Which reanalysis most directly addresses the issue?&quot;,&quot;options&quot;:[&quot;Ask another designer to choose six more photographs from the same published twelve.&quot;,&quot;Use only the camera&#x27;s automated exposure log to prove the treatment changes appearance.&quot;,&quot;Mask group labels, apply a pre-specified scoring rule to the complete image sets, and compare the distributions.&quot;,&quot;Verify that the six published images in each group are authentic and leave the selection unchanged.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;真照片都可以選擇性報告。要由完整樣本檢查典型差異，先定評分、遮蔽組別、比較分布。只驗真、改曝光解釋或再選同一小撮相，都冇解決 cherry-picking。&quot;,&quot;key_en&quot;:&quot;Authenticity of selected data does not establish that the selection is representative.&quot;,&quot;source_pages&quot;:[5,7,17],&quot;source_note&quot;:&quot;Lecture 3 PDF 5, 7, 17&quot;},{&quot;id&quot;:&quot;H3-08&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Hidden cues in a claim test&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Someone claims to identify which of four images a dog owner is viewing without relying on ordinary cues. The first assessor knows the correct answer and interacts with the claimant. Which protocol gives the strongest comparison against the 1-in-4 chance rate?&quot;,&quot;options&quot;:[&quot;Let the informed assessor give the same spoken instructions while watching the correct image.&quot;,&quot;Randomly select each target, prevent people who interact with the claimant from knowing it, require one locked answer per trial, and retain every trial.&quot;,&quot;Display all four images in the same order and ask the assessor to score near-matches as correct.&quot;,&quot;Preselect the trials the claimant feels are strongest, then ask independent researchers to score those alone.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;就算評核員冇意傳暗號，已知答案都可能由語氣、表情漏提示。隨機目標、隔開知道答案嘅人、先鎖答案、保留所有試次，先令 1/4 基準有意義。事後改評分或揀試次會改變比較。&quot;,&quot;key_en&quot;:&quot;Block ordinary information channels and define the chance comparison before collecting results.&quot;,&quot;source_pages&quot;:[14,17],&quot;source_note&quot;:&quot;Lecture 3 PDF 14, 17&quot;},{&quot;id&quot;:&quot;H3-09&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Consequences and consent&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A school wants to publish named learning profiles from a study. Version X offers a slightly larger teaching benefit but discloses identities against some pupils&#x27; stated wishes. Version Y provides most benefits with anonymised profiles. Which justification most directly appeals to a duty or rights constraint?&quot;,&quot;options&quot;:[&quot;Choose X because it offers the greatest measured teaching benefit.&quot;,&quot;Choose Y solely because a survey suggests it will reduce expected complaint-handling costs.&quot;,&quot;Choose X because more pupils support the proposal than oppose it.&quot;,&quot;Choose Y because the school should respect participants&#x27; informed refusal of named disclosure, even if X gives a larger benefit.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;D 將尊重知情拒絕視為責任，正係 duty／rights 角度。B 同樣揀 Y，但唯一理由係預計省成本，屬後果層面。題目問理據類型，唔係淨係睇最終揀邊個。&quot;,&quot;key_en&quot;:&quot;Two people can choose the same policy for different reasons. Identify the reason about duties or rights.&quot;,&quot;source_pages&quot;:[30,44,45,46,48],&quot;source_note&quot;:&quot;Lecture 3 PDF 30, 44, 45, 46, 48&quot;},{&quot;id&quot;:&quot;H3-10&quot;,&quot;lecture&quot;:3,&quot;topic&quot;:&quot;Ethical tradeoff with uncertain outcomes&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Method X helps 80 learners a little but may impose a major, avoidable burden on 8 participants. Method Y helps 60 learners by a similar amount and substantially reduces that burden. Which reasoning best represents a careful consequentialist assessment?&quot;,&quot;options&quot;:[&quot;Compare the size and likelihood of benefits and burdens across all affected groups, then check whether the conclusion depends on uncertain estimates.&quot;,&quot;Choose X because 80 is larger than 60, regardless of the severity of the burdens.&quot;,&quot;Choose Y solely because the participants have a right to refuse, without examining outcomes.&quot;,&quot;Choose whichever method more voters support, treating the vote as the sum of welfare.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;結果論要看整體利弊有幾大、發生可能、受影響群體同不確定。80 人比 60 人多只夠證明人頭數，未計 8 人負擔嚴重程度。C 係權利理由；投票亦未量到實際福祉。&quot;,&quot;key_en&quot;:&quot;A consequentialist comparison uses the magnitudes and probabilities of benefits and harms, not headcounts alone.&quot;,&quot;source_pages&quot;:[30,44,45,48],&quot;source_note&quot;:&quot;Lecture 3 PDF 30, 44, 45, 48&quot;},{&quot;id&quot;:&quot;H4-01&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Encoding capacity with reserved codes&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A system assigns one distinct fixed-length unsigned bit pattern to each of 123 reading states and to each of 5 diagnostic messages. It uses the minimum number of bits. What is the largest possible encoded number, and can one extra distinct message be added without changing the width?&quot;,&quot;options&quot;:[&quot;128, and there is room for one more message.&quot;,&quot;127, and there is room for one more message.&quot;,&quot;127, and there is no room for one more message.&quot;,&quot;128, and there is no room for one more message.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;123＋5＝128 個編碼位置，剛好填滿 7 bits 的 2⁷ 個 pattern。由 0 起計，最大編碼值係 127，所以再增一個訊息須到 8 bits。128 係位置數，唔係最大值；診斷訊息亦已佔用位置。&quot;,&quot;key_en&quot;:&quot;128 patterns fit exactly in 7 bits. The largest unsigned value is 127.&quot;,&quot;source_pages&quot;:[7,8],&quot;source_note&quot;:&quot;Lecture 4 PDF 7, 8 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-02&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Bit packing and byte rounding&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A logger stores 8,012 readings at exactly 5 bits each. The readings are packed consecutively without gaps, and only the final byte may contain padding. A 17-byte header is written separately before the readings. How many bytes does the whole file occupy?&quot;,&quot;options&quot;:[&quot;5,025 bytes&quot;,&quot;5,024 bytes&quot;,&quot;5,008 bytes&quot;,&quot;8,029 bytes&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;資料為 8,012×5＝40,060 bits，即 5,007.5 bytes，須用 5,008 個完整 bytes，再加 17-byte header＝5,025。5,024 將尾半 byte 向下捨入；8,029 錯當每筆至少佔一 byte。&quot;,&quot;key_en&quot;:&quot;Round the packed payload up to a whole byte before adding the header.&quot;,&quot;source_pages&quot;:[7,9],&quot;source_note&quot;:&quot;Lecture 4 PDF 7, 9 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-03&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Carry propagation beyond a half adder&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;An unsigned adder adds 1011₂ and 0111₂ from the right. The rightmost column uses a half adder. What are the sum bit and carry-out of the third column from the right, after using the carry from the second column?&quot;,&quot;options&quot;:[&quot;Sum 1, carry-out 0&quot;,&quot;Sum 1, carry-out 1&quot;,&quot;Sum 0, carry-out 0&quot;,&quot;Sum 0, carry-out 1&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;右一：1＋1 產生 carry 1。右二：1＋1＋1＝11₂，仍送出 carry 1。右三：0＋1＋1＝10₂，所以 sum 0、carry-out 1。若答 (1,0)，係忽略右二傳入嘅 carry，誤用半加器。&quot;,&quot;key_en&quot;:&quot;A carry-in of 1 changes the third column from a total of 1 to a total of 2.&quot;,&quot;source_pages&quot;:[20,21],&quot;source_note&quot;:&quot;Lecture 4 PDF 20, 21 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-04&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;A test that distinguishes two gates&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two proposed alarms have outputs (A OR B) AND NOT(M) and (A XOR B) AND NOT(M), with M the maintenance override. Engineers have already tested all cases in which exactly one of A and B is 1. Which additional test distinguishes the two circuits, and what are their respective outputs?&quot;,&quot;options&quot;:[&quot;A=1, B=1, M=1. First 1, second 0.&quot;,&quot;A=1, B=1, M=0. First 1, second 0.&quot;,&quot;A=0, B=0, M=0. First 0, second 1.&quot;,&quot;A=1, B=0, M=1. First 1, second 0.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;停用維修遮罩要 M＝0。兩個警報同時觸發 (11) 時，OR＝1、XOR＝0；呢個就係兩個電路分歧位。M＝1 會用最後嘅 AND 將兩個都變成 0，睇唔到原 gate 差異。&quot;,&quot;key_en&quot;:&quot;Test both signals together with the override off. Inclusive OR fires and XOR does not.&quot;,&quot;source_pages&quot;:[20,21],&quot;source_note&quot;:&quot;Lecture 4 PDF 20, 21 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-05&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Capacity conversion with a reservation&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A drive contains exactly 500,000,000,000 bytes. Exactly 20 GiB is reserved for the system. A user wants to store 450 GiB of files. Using 1 GiB = 1024³ bytes, which statement is correct?&quot;,&quot;options&quot;:[&quot;About 480.0 GiB remains, so the files fit.&quot;,&quot;About 465.7 GiB remains, so the files fit.&quot;,&quot;About 445.7 GiB remains, so the files do not fit.&quot;,&quot;About 456.8 GiB remains, so the files fit.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;先 500×10⁹ ÷ 1024³ ≈465.66 GiB，再扣同單位嘅 20 GiB，剩約 445.66 GiB，所以 450 GiB 放唔晒。465.7 未扣保留空間；480 用 GB 同 GiB 直接相減，456.8 反映用錯級數。&quot;,&quot;key_en&quot;:&quot;Convert the advertised bytes to GiB first, then subtract the reserved GiB.&quot;,&quot;source_pages&quot;:[9,16],&quot;source_note&quot;:&quot;Lecture 4 PDF 9, 16 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-06&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Clock speed and serial bottleneck&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;A workload needs 4 billion serial cycles and then 8 billion perfectly divisible cycles. System A has one 4 GHz core and no coordination overhead. System B has four 2 GHz cores, uses only one core for the serial stage, and adds 0.4 s of coordination after the parallel stage. Both systems require the stated cycle counts. Which finishes first?&quot;,&quot;options&quot;:[&quot;B, by 1.1 s.&quot;,&quot;B, by 0.4 s.&quot;,&quot;They finish together in 3.0 s.&quot;,&quot;A, by 0.4 s.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;A＝4/4＋8/4＝3.0 s。B 串行只用一核，4/2＝2 s；可分拆部分 8/(4×2)＝1 s；加 0.4 s＝3.4 s。四核唔能夠同時分擔串行部分，亦唔好漏咗 coordination。&quot;,&quot;key_en&quot;:&quot;The serial stage and coordination leave B at 3.4 s, versus A at 3.0 s.&quot;,&quot;source_pages&quot;:[18,19],&quot;source_note&quot;:&quot;Lecture 4 PDF 18, 19 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-07&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;HDD access latency trade-off&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;For random one-block reads, approximate mean service time as average seek time plus half a revolution plus transfer time. HDD A spins at 7,200 rpm with 12 ms seek and 2 ms transfer. HDD B spins at 5,400 rpm with 6 ms seek and 4 ms transfer. Which conclusion follows?&quot;,&quot;options&quot;:[&quot;B has the lower estimated mean service time even though its rotational wait is longer.&quot;,&quot;A has the lower estimated mean service time because its rotational wait is shorter.&quot;,&quot;B has the lower estimated mean service time because its rotational wait is shorter.&quot;,&quot;They are equally fast because the higher rpm cancels the seek difference.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;A 平均半圈＝60,000/(2×7,200)≈4.17 ms，總約 18.17 ms。B 半圈≈5.56 ms，總約 15.56 ms。A 只係旋轉等候短；B 尋道快嘅好處大於其額外旋轉同傳輸時間。&quot;,&quot;key_en&quot;:&quot;Compare all latency components. B is about 15.56 ms versus A at 18.17 ms.&quot;,&quot;source_pages&quot;:[13,17],&quot;source_note&quot;:&quot;Lecture 4 PDF 13, 17 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-08&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Generalisation beyond a training distribution&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A Go-playing model trained by self-play wins 95% of matches against opponents used during development and 92% against new Go opponents. Its developer claims that it can adapt to rule changes. Which additional result would most directly support that narrower claim?&quot;,&quot;options&quot;:[&quot;It beats stronger opponents on the original rules after more self-play.&quot;,&quot;On rule changes held out until evaluation, it improves after a fixed adaptation budget relative to a frozen version.&quot;,&quot;Its overall win rate rises when Go opponents from the training set are included.&quot;,&quot;It needs fewer memory bytes per turn than an older Go engine.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;新對手都係同一套 Go 規則，只支持對手層面嘅泛化。新規則要留出、未曾參與開發，固定適應資源，再同未適應版本比較，先可檢驗 rule change adaptation。算速或原規則更高勝率回答另一個問題。&quot;,&quot;key_en&quot;:&quot;Test adaptation on held-out rule changes against a frozen baseline.&quot;,&quot;source_pages&quot;:[29,32,38],&quot;source_note&quot;:&quot;Lecture 4 PDF 29, 32, 38 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-09&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Accuracy versus error costs&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A school is evaluating AI that flags submissions for manual review. Of 1,000 labelled submissions, 100 actually need review. Model A flags 92 of those 100 and wrongly flags 162 others. Model B flags 80 of those 100 and wrongly flags 45 others. For this exercise, a missed case costs 12 points, an unnecessary flag costs 1, and other decisions cost 0. Which statement is correct?&quot;,&quot;options&quot;:[&quot;A costs 170 points and B costs 65 points, since every incorrect decision costs the same.&quot;,&quot;B is less costly because it has fewer total errors.&quot;,&quot;A is less costly under the stated costs, even though B has higher overall accuracy.&quot;,&quot;A is less costly and also has higher overall accuracy.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;A 漏 8、誤標 162，成本 8×12＋162＝258；B 漏 20、誤標 45，成本 20×12＋45＝285。B 總錯 65 少過 A 嘅 170，準確率較高。題目嘅加權成本重視漏判，所以兩種指標可以揀到唔同模型。&quot;,&quot;key_en&quot;:&quot;A costs 258 points and B costs 285. B has fewer unweighted errors.&quot;,&quot;source_pages&quot;:[31,41,45],&quot;source_note&quot;:&quot;Lecture 4 PDF 31, 41, 45 • new practice scenario&quot;},{&quot;id&quot;:&quot;H4-10&quot;,&quot;lecture&quot;:4,&quot;topic&quot;:&quot;Evidence for staffing gains&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A clinic pilots an automated appointment-sorting tool. Compared with the previous month, sorting keystrokes per booking fell by 40%, but staff began checking a separate exception queue. The clinic claims it therefore needs 40% fewer scheduling staff. Which study would best test the staffing claim?&quot;,&quot;options&quot;:[&quot;Compare complete staff time per matched booking volume, including exceptions, repairs and checks, while verifying comparable outcomes.&quot;,&quot;Count only keystrokes completed by humans before and after, because automated actions require no staff time.&quot;,&quot;Compare vendor processing speed with the old software, then apply the ratio directly to current headcount.&quot;,&quot;Ask whether staff like the new interface, then estimate workload from the agreement rate.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;少 40% 按鍵係一項 task 指標，唔等於整份工作少 40%。要對照相似工作量同成效，記埋例外處理、審核同修正嘅總工時，先可以判斷實際淨節省。受歡迎或者運算快，唔會直接回答人手需要。&quot;,&quot;key_en&quot;:&quot;Measure full workflow labour and outcomes under comparable workloads.&quot;,&quot;source_pages&quot;:[41,42,43,46],&quot;source_note&quot;:&quot;Lecture 4 PDF 41, 42, 43, 46 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-01&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Accessible surface area with agglomeration&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Two batches contain the same mass of solid cubes of equal density. Batch A has 0.12 µm cubes with 75% of their geometric surface area accessible. Batch B has 15 nm cubes with 35% accessible because of clumping. What is B&#x27;s accessible surface area relative to A&#x27;s?&quot;,&quot;options&quot;:[&quot;About 0.47 times as large.&quot;,&quot;About 3.73 times as large.&quot;,&quot;Exactly 8 times as large.&quot;,&quot;About 17.14 times as large.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;0.12 µm＝120 nm。同體積且全分開時，面積／體積隨邊長倒數，所以 B/A 幾何面積＝120/15＝8。再乘可接觸比例 0.35/0.75，得約 3.73。0.47 只比可接觸百分比，8 忽略結團。&quot;,&quot;key_en&quot;:&quot;With equal volume, geometric surface scales as 1/length. Multiply the area ratio by the accessible-fraction ratio.&quot;,&quot;source_pages&quot;:[3,4,6,11],&quot;source_note&quot;:&quot;Lecture 6 PDF 3, 4, 6, 11 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-02&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Classifying a strip cut from a film&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A material is a film 80 nm thick, 25 µm wide and 2 cm long. It is cut into strips 80 nm wide while thickness and length stay constant. Call an axis nanoscale if its dimension is from 1 to 100 nm. Under the convention that the dimensional label counts how many axes extend beyond the nanoscale, how does the label change?&quot;,&quot;options&quot;:[&quot;0D to 1D&quot;,&quot;1D to 2D&quot;,&quot;2D to 0D&quot;,&quot;2D to 1D&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;原本只有厚度係 nanoscale，寬度 25 µm＝25,000 nm，加長度都超出，所以 2D。切窄後厚、寬都係 80 nm，只有長度超出，所以 1D。若倒轉係數咗 nanoscale 方向，題目指定數延伸方向。&quot;,&quot;key_en&quot;:&quot;Two extended axes become one after the width is reduced to 80 nm.&quot;,&quot;source_pages&quot;:[4,9],&quot;source_note&quot;:&quot;Lecture 6 PDF 4, 9 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-03&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Microscope magnification versus true width&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;Image A shows a feature 12 mm wide on screen with a 6 mm scale-bar image representing 30 nm. Image B shows a different feature 15 mm wide with a 5 mm scale-bar image representing 0.012 µm. What are the true widths, and which is larger?&quot;,&quot;options&quot;:[&quot;A is 60 nm, B is 36 nm. A is wider.&quot;,&quot;A is 60 nm, B is 0.036 nm. A is wider.&quot;,&quot;A is 12 nm, B is 15 nm. B is wider.&quot;,&quot;A is 60 nm, B is 90 nm. B is wider.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;A 個 feature 係自己 scale bar 嘅 12/6＝2 倍，真闊 60 nm。B 係自己尺嘅 15/5＝3 倍，0.012 µm＝12 nm，真闊 36 nm。唔可以用畫面 mm 比大小，亦唔可以借 A 嘅比例尺量 B。&quot;,&quot;key_en&quot;:&quot;Scale each image independently and convert 0.012 µm to 12 nm.&quot;,&quot;source_pages&quot;:[4,5,7],&quot;source_note&quot;:&quot;Lecture 6 PDF 4, 5, 7 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-04&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Net radiative cooling under two sky conditions&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;At the same surface temperature, a coating absorbs 45 W/m² of sunlight, emits 85 W/m² of thermal radiation and absorbs 25 W/m² of incoming thermal radiation. All other heat fluxes are zero in the model. Clouds then increase the incoming thermal radiation to 50 W/m² while leaving the other two terms unchanged. What happens?&quot;,&quot;options&quot;:[&quot;It gains 15 W/m² before clouds and loses 10 W/m² afterward.&quot;,&quot;It loses 40 W/m² in both conditions.&quot;,&quot;It loses 15 W/m² before clouds and gains 10 W/m² afterward.&quot;,&quot;It loses 60 W/m² before clouds and 35 W/m² afterward.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;能量流入＝吸收陽光＋吸收入射熱輻射。晴天 45＋25−85＝−15 W/m²，淨失熱；雲後 45＋50−85＝＋10 W/m²，淨得熱。只計太陽同 emission 就錯漏入射熱輻射。數字係指定模型，唔推論所有雲天都一樣。&quot;,&quot;key_en&quot;:&quot;Include both solar and thermal inputs. The net flux flips from −15 to +10 W/m².&quot;,&quot;source_pages&quot;:[13,14],&quot;source_note&quot;:&quot;Lecture 6 PDF 13, 14 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-05&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Cooling before-and-after with a reference&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;A treated building&#x27;s weekly air-conditioning electricity use falls from 1,000 to 900 kWh. An untreated reference building&#x27;s use falls from 800 to 720 kWh during the same weeks. The treated roof also becomes cooler. If the reference&#x27;s percentage change is the estimate of the shared background trend, what do these electricity figures show?&quot;,&quot;options&quot;:[&quot;The coating saved 20 kWh beyond the background trend.&quot;,&quot;There is no observed extra percentage saving beyond the reference trend, even though the treated roof is cooler.&quot;,&quot;The coating saved exactly 100 kWh because the reference building had no treatment.&quot;,&quot;The untreated building saved a greater percentage because its baseline was lower.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;處理與未處理都減 10%，所以按題目指定嘅共同百分比趨勢，處理樓預期亦由 1,000 變 900。20 kWh 係直接減兩棟降幅，基線唔同帶來嘅假差異。表面涼咗同用電額外下降係唔同結果；一次比較亦唔能夠證明塗層永遠無效。&quot;,&quot;key_en&quot;:&quot;Both fall by 10%. The treated building shows no extra reduction under the specified comparison.&quot;,&quot;source_pages&quot;:[14,15],&quot;source_note&quot;:&quot;Lecture 6 PDF 14, 15 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-06&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Wicking, evaporation and humidity&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a mannequin test, Fabric A moves liquid sweat away from the skin twice as fast as Fabric B. In dry air A also gives greater measured evaporative heat loss. In humid air, with air speed matched, both fabrics give the same measured evaporative heat loss. Which inference is best?&quot;,&quot;options&quot;:[&quot;A&#x27;s faster wicking does not guarantee higher evaporation in humid air, where reduced evaporation can limit the cooling difference.&quot;,&quot;A must remove twice as much heat in humid air because it moves sweat twice as fast.&quot;,&quot;Equal humid-air heat loss proves the wicking measurements were invalid.&quot;,&quot;Dry-air results prove A always lowers a person&#x27;s core temperature more than B.&quot;],&quot;answer&quot;:0,&quot;explain_zh&quot;:&quot;導汗量度液態汗移動，蒸發熱損量度由液變氣時帶走嘅熱。高濕度可以壓低蒸發，即使布料搬水更快都未必增冷卻。假人熱損同人體核心溫度又係唔同終點。&quot;,&quot;key_en&quot;:&quot;Wicking and evaporative heat loss are different outcomes, and humidity can limit evaporation.&quot;,&quot;source_pages&quot;:[13,16],&quot;source_note&quot;:&quot;Lecture 6 PDF 13, 16 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-07&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Interpreting dose and rolling-window rules&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;In a fictional label exercise, P and Q name the same practice ingredient. The rule is at most 8 units in any rolling 12 hours and at least 4 hours between exposures to P or Q. The record shows one dose of two 2-unit P tablets at 08:00 and one 3-unit Q sachet at 12:30. At 17:00, a 2-unit practice dose of Q is proposed. Which check is correct?&quot;,&quot;options&quot;:[&quot;It satisfies both rules because the last exposure was more than 4 hours ago.&quot;,&quot;It breaks both rules because P and Q have to be treated as separate products.&quot;,&quot;It breaks the spacing rule only, because 17:00 is in the same 12-hour window.&quot;,&quot;It meets the spacing rule but breaks the rolling total, which would reach 9 units.&quot;],&quot;answer&quot;:3,&quot;explain_zh&quot;:&quot;17:00 距 12:30 4.5 小時，間隔過關。但 08:00 同 12:30 都仍喺前 12 小時內；P 2×2＝4，加 Q 3，再加 2＝9，超過 8。要查每一條規則，唔好按品牌或日曆日分開。&quot;,&quot;key_en&quot;:&quot;The gap is 4.5 hours, but all three same-ingredient exposures sum to 9 units in the window.&quot;,&quot;source_pages&quot;:[19,20],&quot;source_note&quot;:&quot;Lecture 6 PDF 19, 20 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-08&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Identifying a surviving heat path&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;scenario&quot;,&quot;stem&quot;:&quot;Two insulated containers have identical inner vessels, outer walls and solid support posts. The gaps are evacuated. The surfaces facing one gap emit and absorb thermal radiation more weakly than those facing the other gap. The first vessel loses less heat. Which account is consistent with the design?&quot;,&quot;options&quot;:[&quot;The vacuum blocks both convection and radiation, so the result proves the first posts conduct less heat.&quot;,&quot;The observed difference must be due to convection, because radiation can only travel through air.&quot;,&quot;Reduced radiation across the gap can account for the difference. Conduction through the identical supports may still occur.&quot;,&quot;The weaker radiation surfaces make every heat-transfer route smaller, including conduction through the posts.&quot;],&quot;answer&quot;:2,&quot;explain_zh&quot;:&quot;抽真空大幅抑制流體對流，但電磁波輻射照樣可穿真空。改 gap-facing 表面可減少跨間隙輻射。實體支柱仍有傳導路徑，表面發射率低唔會自動令一樣嘅支柱傳導消失。&quot;,&quot;key_en&quot;:&quot;A vacuum suppresses convection across the gap, while radiation and conduction through solid supports can remain.&quot;,&quot;source_pages&quot;:[12,13,14],&quot;source_note&quot;:&quot;Lecture 6 PDF 12, 13, 14 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-09&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Polymer link and by-product counting&quot;,&quot;priority&quot;:&quot;hard&quot;,&quot;kind&quot;:&quot;calculation&quot;,&quot;stem&quot;:&quot;In a simplified condensation-polymerization model, 120 monomer molecules form exactly three separate linear chains and all monomers are used. Every new link releases one water molecule. There is no branching or ring formation. How many water molecules are released?&quot;,&quot;options&quot;:[&quot;120, because there is one water molecule per monomer.&quot;,&quot;117, because each separate chain has one fewer link than monomer units.&quot;,&quot;119, because every polymer sample loses one link at its end.&quot;,&quot;114, because each chain has two ends that both subtract one link.&quot;],&quot;answer&quot;:1,&quot;explain_zh&quot;:&quot;一條直鏈 n 個 unit，只需 n−1 條連結。3 條獨立鏈共 120 個 units，連結數＝120−3＝117。每條 link 放一個水分子，所以答案 117。119 假設全部 units 入同一條鏈。&quot;,&quot;key_en&quot;:&quot;With three linear chains, total new links equal 120 minus 3.&quot;,&quot;source_pages&quot;:[24],&quot;source_note&quot;:&quot;Lecture 6 PDF 24 • new practice scenario&quot;},{&quot;id&quot;:&quot;H6-10&quot;,&quot;lecture&quot;:6,&quot;topic&quot;:&quot;Functional comparison of reusable packaging&
